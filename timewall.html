        function changeLanguage(langCode) {

            document.querySelectorAll('[data-i18n]').forEach(elem => {

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkNc_eIIfqqxbTGqyZ1YWGE3W6lbNqUJQ",
            authDomain: "dudo-63594.firebaseapp.com",
            databaseURL: "https://dudo-63594-default-rtdb.firebaseio.com",
            projectId: "dudo-63594",
            storageBucket: "dudo-63594.firebasestorage.app",
            messagingSenderId: "732244407571",
            appId: "1:732244407571:web:d08486136dea6190de96e6",
            measurementId: "G-H6VVEXCD54"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const uid = localStorage.getItem("userId") || "GuestUser";

        // Custom UI Alert Function
        function showAlert(msg) {
            document.getElementById("alertMessage").innerText = msg;
            document.getElementById("alertOverlay").style.display = "block";
            document.getElementById("customAlertBox").style.display = "block";
        }
        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        document.addEventListener("DOMContentLoaded", () => {
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            // Display current coin status
            database.ref('users/' + uid).on('value', (snap) => {
                if(snap.exists()){
                    document.getElementById("liveTWCoins").innerText = (snap.val().coins || 0) + " 🪙";
                }
            });

            // 🔥 ADMIN CONNECTED DYNAMIC TIMEWALL LINK & BANNERS 🔥
            let baseTimeWallUrl = "https://timewall.io/embed/offers/f258b284e31151e4"; // Default Link

            database.ref('global_system_runtime_configurations').on('value', (snap) => {
                if(snap.exists()) {
                    let conf = snap.val();
                    
                    // 1. TimeWall Iframe URL Sync
                    if(conf.offerwall_configurations && conf.offerwall_configurations.timewall_url) {
                        baseTimeWallUrl = conf.offerwall_configurations.timewall_url;
                    }
                    
                    // Combine URL safely with UID parameter
                    let finalUrl = baseTimeWallUrl;
                    if(finalUrl.includes("?")) {
                        finalUrl += `&ext_user_id=${uid}`;
                    } else {
                        finalUrl += `?ext_user_id=${uid}`;
                    }
                    
                    // Inject Dynamic IFRAME
                    document.getElementById("timewallLocation").innerHTML = `
                        <iframe class="iframe-wrapper" src="${finalUrl}"></iframe>
                    `;

                    // 2. Banner Slots Sync
                    if(conf.watch_ads_banner_slots) {
                        let b = conf.watch_ads_banner_slots;
                        if (b.slot1_html) { let s1 = document.getElementById("twAdSlot1"); if(s1) { s1.innerHTML = b.slot1_html; runScripts(s1); } }
                        if (b.slot2_html) { let s2 = document.getElementById("twAdSlot2"); if(s2) { s2.innerHTML = b.slot2_html; runScripts(s2); } }
                        if (b.slot3_html) { let s3 = document.getElementById("twAdSlot3"); if(s3) { s3.innerHTML = b.slot3_html; runScripts(s3); } }
                        if (b.slot4_html) { let s4 = document.getElementById("twAdSlot4"); if(s4) { s4.innerHTML = b.slot4_html; runScripts(s4); } }
                    }
                }
            });

            function runScripts(container) {
                let scripts = container.getElementsByTagName("script");
                for (let i = 0; i < scripts.length; i++) {
                    let sNode = document.createElement("script");
                    if (scripts[i].src) sNode.src = scripts[i].src;
                    else sNode.text = scripts[i].text;
                    scripts[i].parentNode.replaceChild(sNode, scripts[i]);
                }
            }

            // 🔥 SERVER-SIDE SAFE REVENUE TRANSFER ENGINE + DAILY TASK SYNC 🔥
            database.ref('timewall_postback').on('child_added', (snapshot) => {
                let twData = snapshot.val();
                if(twData && twData.custom_user_id === uid && twData.status === "approved") {
                    let incomingPoints = parseFloat(twData.reward_amount || 0);
                    let txToken = snapshot.key;

                    database.ref('processed_tw_tasks/' + txToken).once('value').then((chk) => {
                        if(!chk.exists()) {
                            database.ref('users/' + uid).once('value').then((uSnap) => {
                                if(uSnap.exists()) {
                                    let currentCoins = uSnap.val().coins || 0;
                                    let currentBalance = uSnap.val().balance || 0;
                                    let currentTask = uSnap.val().taskEarnings || 0;

                                    let absoluteCoins = incomingPoints; 
                                    let monetaryTranslation = absoluteCoins / 100; // 100 Coins = ₹1 Base Matrix

                                    database.ref('users/' + uid).update({
                                        coins: currentCoins + absoluteCoins,
                                        balance: currentBalance + monetaryTranslation,
                                        taskEarnings: currentTask + monetaryTranslation
                                    }).then(() => {
                                        database.ref('processed_tw_tasks/' + txToken).set({
                                            timestamp: firebase.database.ServerValue.TIMESTAMP,
                                            credited: monetaryTranslation
                                        });

                                        // 🔥 DAILY TASK SYNC (t14)
                                        let currentDailyList = uSnap.val().completed_daily_tasks_array_node || [];
                                        if(!currentDailyList.includes("t14")) {
                                            currentDailyList.push("t14");
                                            database.ref('users/' + uid).update({ completed_daily_tasks_array_node: currentDailyList });
                                        }

                                        // Trigger Success Modal
                                        showAlert(`🎉 Awesome! You just received +${absoluteCoins} Coins from TimeWall tasks!`);
                                    });
                                }
                            });
                        }
                    });
                }
            });
        });
    </script>
