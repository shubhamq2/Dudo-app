    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-gold: #facc15;
            --accent-pink: #f43f5e;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 60%); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; color: var(--text-main); min-height: 100vh; padding-bottom: 40px; overflow-x: hidden; }
        
        /* Premium Sync Header */
        .header { width: 100%; background: rgba(15, 23, 42, 0.9); padding: 15px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--primary-blue); backdrop-filter: blur(10px); }
        .back-btn { font-size: 20px; font-weight: bold; color: var(--primary-blue); text-decoration: none; padding: 5px 12px; border-radius: 8px; background: rgba(59, 130, 246, 0.15); transition: 0.2s; border: 1px solid rgba(59, 130, 246, 0.3); }
        .back-btn:active { transform: scale(0.9); }
        .header h2 { margin: 0; font-size: 19px; color: #fff; font-weight: 800; flex-grow: 1; text-align: center; margin-right: 10px; letter-spacing: 0.5px; }

        .header-controls { display: flex; gap: 10px; align-items: center; }
        .custom-lang-select { padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); outline: none; font-size: 12px; background: #1e293b; color: var(--primary-blue); font-weight: bold; cursor: pointer; }

        /* 🔥 Smart Avatar Icon Styles */
        .profile-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary-blue), var(--accent-cyan)); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; border: 1px solid rgba(255,255,255,0.2); overflow: hidden; transition: 0.3s; }
        .profile-icon:active { transform: scale(0.9); border-color: var(--accent-gold); }

        .main-container { width: 92%; max-width: 440px; margin: 15px auto; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }

        /* PLAY STORE SAFE: Only show Coins */
        .balance-card { background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9)); border: 1px solid var(--primary-blue); padding: 15px 20px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; box-sizing: border-box; box-shadow: 0 8px 25px rgba(59, 130, 246, 0.2); backdrop-filter: blur(10px); }
        .balance-card span { font-size: 18px; font-weight: 900; }
        .coin-txt { color: var(--accent-gold); display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 12px; border: 1px solid rgba(251,191,36,0.2); font-size: 20px; font-weight: 900; }

        /* 📢 MULTI-SLOT INCOME ADS SYSTEM */
        .ad-banner-slot { width: 100%; min-height: 52px; background: rgba(255,255,255,0.03); border-radius: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 1px dashed rgba(59, 130, 246, 0.4); box-sizing: border-box; margin: 5px 0; }

        /* 🔥 Premium Dynamic Task Cards */
        .task-card-node { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 22px 18px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; transition: 0.2s; box-shadow: 0 8px 25px rgba(0,0,0,0.4); backdrop-filter: blur(10px); position: relative; overflow: hidden; }
        .task-card-node::before { content: ''; position: absolute; left: 0; top: 0; width: 5px; height: 100%; background: var(--primary-blue); }
        .task-card-node.completed { opacity: 0.6; filter: grayscale(0.8); }
        .task-card-node.completed::before { background: var(--accent-green); }
        
        .task-meta { text-align: left; display: flex; flex-direction: column; gap: 6px; max-width: 65%; }
        .task-title { font-size: 15.5px; font-weight: 900; color: #fff; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
        .task-desc { font-size: 12px; color: var(--text-sub); font-weight: 600; line-height: 1.4; }
        
        .task-reward-badge { background: rgba(250, 204, 21, 0.15); border: 1px solid rgba(250, 204, 21, 0.3); color: var(--accent-gold); padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 900; box-shadow: inset 0 0 10px rgba(250, 204, 21, 0.1); width: fit-content; display: inline-block; margin-top: 5px; }

        .action-task-btn { background: linear-gradient(135deg, var(--primary-blue), #1e3a8a); color: #fff; border: none; padding: 12px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); text-transform: uppercase; transition: 0.2s; white-space: nowrap; letter-spacing: 0.5px; }
        .action-task-btn:active:not(:disabled) { transform: scale(0.95); }
        .action-task-btn:disabled { background: #334155; color: #94a3b8; box-shadow: none; cursor: not-allowed; }

        /* Custom Alert Popups */
        .custom-alert { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); border: 2px solid var(--accent-pink); padding: 25px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 3000; width: 85%; max-width: 350px; text-align: center; backdrop-filter: blur(10px); }
        .custom-alert.success-border { border-color: var(--accent-green); box-shadow: 0 15px 40px rgba(16, 185, 129, 0.2); }
        .custom-alert p { margin: 0 0 18px 0; font-size: 14.5px; color: #fff; font-weight: 700; line-height: 1.5; }
        .custom-alert button { background: var(--primary-blue); border: none; color: white; padding: 12px 25px; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .custom-alert button:active { transform: scale(0.95); }
        .custom-alert.success-border button { background: var(--accent-green); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.85); z-index: 2999; backdrop-filter: blur(5px); }

        /* 🔥 IN-APP AD VIEWER CSS 🔥 */
        .in-app-ad-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999999; background: #000; flex-direction: column; }
        .ad-header { height: 55px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 2px solid var(--primary-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .ad-timer-text { color: var(--accent-gold); font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .ad-close-btn { display: none; background: var(--accent-pink); color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 13px; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        .ad-iframe-frame { width: 100%; height: calc(100% - 55px); border: none; background: #fff; }
    </style>
</head>

    <script>

        const langData = {

            "te": { "sw_title": "స్మార్ట్ టాస్క్ వాల్", "sw_wallet": "బ్యాలెన్స్", "sw_btn_start": "ప్రారంభించండి", "sw_btn_done": "పూర్తయింది", "err_success": "🎉 విజయం! పాయింట్లు జోడించబడ్డాయి." },

            "ta": { "sw_title": "ஸ்மார்ட் டாஸ்க்", "sw_wallet": "இருப்பு", "sw_btn_start": "தொடங்கு", "sw_btn_done": "முடிந்தது", "err_success": "🎉 வெற்றி! நாணயங்கள் சேர்க்கப்பட்டன." },
            "ur": { "sw_title": "اسمارٹ ٹاسک وال", "sw_wallet": "بیلنس", "sw_btn_start": "شروع کریں", "sw_btn_done": "مکمل", "err_success": "🎉 تصدیق ہو گئی! کوئنز شامل ہو گئے۔" },
            "gu": { "sw_title": "સ્માર્ટ ટાસ્ક", "sw_wallet": "બેલેન્સ", "sw_btn_start": "શરૂ કરો", "sw_btn_done": "પૂર્ણ", "err_success": "🎉 સફળતા! સિક્કા ઉમેરાયા." },
            "es": { "sw_title": "Muro de Tareas", "sw_wallet": "Saldo", "sw_btn_start": "INICIAR", "sw_btn_done": "HECHO", "err_success": "🎉 ¡Verificado! Monedas añadidas." },
            "fr": { "sw_title": "Mur de Tâches", "sw_wallet": "Solde", "sw_btn_start": "DÉMARRER", "sw_btn_done": "TERMINÉ", "err_success": "🎉 Vérifié ! Pièces ajoutées." },
            "ar": { "sw_title": "حائط المهام", "sw_wallet": "الرصيد", "sw_btn_start": "ابدأ", "sw_btn_done": "تم", "err_success": "🎉 تم التحقق! أضيفت العملات." },
            "pt": { "sw_title": "Mural de Tarefas", "sw_wallet": "Saldo", "sw_btn_start": "INICIAR", "sw_btn_done": "FEITO", "err_success": "🎉 Verificado! Moedas adicionadas." },
            "ru": { "sw_title": "Стена Заданий", "sw_wallet": "Баланс", "sw_btn_start": "НАЧАТЬ", "sw_btn_done": "ГОТОВО", "err_success": "🎉 Проверено! Монеты добавлены." }
        };

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) {
                    if(elem.tagName === "BUTTON") {
                        if(!elem.disabled) elem.innerHTML = `<span>${transObj[key]}</span> ⚡`;
                        else elem.innerHTML = `${transObj["sw_btn_done"] || "DONE"} ✅`;
                    } else {
                        elem.innerText = transObj[key];
                    }
                }
            });
            document.getElementById("appLanguage").value = langCode;
            
            // Re-render tasks to apply new language to buttons
            if (globalAdminDataConfig) {
                executeDynamicEngineRenderer(globalAdminDataConfig);
            }
        }

        // 💡 SMART EMOJI-TO-IMAGE CONVERTER FIX
        function createEmojiURI(emoji) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50%" y="54%" font-size="55" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
        }

        const uid = localStorage.getItem("userId");

        // Engine State Variables
        let liveTickerCountdownValueInt = 20;
        let totalActiveFocusSecondsInt = 0;
        let runningTaskEngineInterval = null;
        let activeProcessingTaskIdInt = null;
        let activeProcessingTaskCoinsRewardValueInt = 0;
        let isValidationActive = false;
        
        let globalAdminDataConfig = null; // Store config for re-rendering on lang change
        let defaultSmartlinkGlobal = "https://www.profitablecpmrate.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js";

        // Pre-defined UI Presets for Auto-Generating Task Cards Beautifully
        const taskUIPresets = [
            { icon: "fa-play", color: "var(--accent-pink)" },
            { icon: "fa-globe", color: "var(--accent-cyan)" },
            { icon: "fa-bell", color: "var(--accent-gold)" },
            { icon: "fa-rocket", color: "var(--accent-green)" },
            { icon: "fa-bolt", color: "var(--accent-purple)" },
            { icon: "fa-gamepad", color: "#f97316" },
            { icon: "fa-gift", color: "#ec4899" }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.replace("index.html"); return; }
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            auth.onAuthStateChanged((user) => {
                if (user) {
                    // 1. Live Balance Sync (Only Coins) & Avatar Sync
                    db.ref('users/' + uid).on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.val();
                            document.getElementById("liveUserCoins").innerText = data.coins || 0;
                            
                            // Smart Avatar Sync
                            let userName = data.name || "Player";
                            let finalAvatar = data.profile_pic ? data.profile_pic : `https://api.dicebear.com/7.x/adventurer/svg?seed=${userName || uid}&backgroundColor=b6e3f4`;
                            
                            let avatarContainer = document.getElementById("headerProfileIcon");
                            if (finalAvatar.startsWith("http") || finalAvatar.startsWith("data:")) {
                                avatarContainer.innerHTML = `<img src="${finalAvatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            } else {
                                avatarContainer.innerHTML = `<img src="${createEmojiURI(finalAvatar)}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            }
                        }
                    });

                    // 2. Fetch Admin Configurations & Build Wall Dynamically
                    db.ref('global_system_runtime_configurations').on('value', (snap) => {
                        if(snap.exists()) {
                            const adminData = snap.val();
                            
                            if (adminData.globalSmartlink) {
                                defaultSmartlinkGlobal = adminData.globalSmartlink;
                            }
                            
                            globalAdminDataConfig = adminData.smart_tasks_configs || null;
                            
                            // 🔥 GET ADMIN CONTROLLED TIME
                            if (globalAdminDataConfig && globalAdminDataConfig.ad_timer) {
                                globalAdTimerSeconds = parseInt(globalAdminDataConfig.ad_timer);
                            }

                            executeDynamicEngineRenderer(globalAdminDataConfig);
                        }
                    });

                } else {
                    window.location.replace("index.html");
                }
            });
        });

        // 🔥 DYNAMIC WALL BUILDER ENGINE
        function executeDynamicEngineRenderer(adminConfig) {
            const container = document.getElementById("dynamicTasksContainer");
            
            // Save the balance card before clearing
            const balanceHTML = `
                <div class="balance-card">
                    <span data-i18n="sw_wallet">${langData[localStorage.getItem("selectedLang") || "en"]["sw_wallet"] || "Wallet Balance"}</span>
                    <span class="coin-txt"><span id="liveUserCoins">${document.getElementById("liveUserCoins").innerText}</span> 🪙</span>
                </div>
            `;
            
            container.innerHTML = balanceHTML;

            let today = new Date().toISOString().slice(0, 10);
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let doneTxt = langData[currentLang]["sw_btn_done"] || "DONE";
            let startTxt = langData[currentLang]["sw_btn_start"] || "START";

            let validTasksFound = false;

            // Loop 1 to 20 to find all configured tasks and banners
            for (let i = 1; i <= 20; i++) {
                
                // 1. Inject Banner if exists for this slot (slot1 before task1, slot2 before task2 etc)
                if (adminConfig && adminConfig[`slot${i}_code`]) {
                    let bannerDiv = document.createElement("div");
                    bannerDiv.className = "ad-banner-slot";
                    bannerDiv.style.display = "flex";
                    setAdHTML(bannerDiv, adminConfig[`slot${i}_code`]);
                    container.appendChild(bannerDiv);
                }

                // 2. Inject Task if exists
                if (adminConfig && adminConfig[`t${i}_title`] && adminConfig[`t${i}_link`]) {
                    validTasksFound = true;
                    
                    let title = adminDataConfigEscape(adminConfig[`t${i}_title`]);
                    let desc = adminDataConfigEscape(adminConfig[`t${i}_desc`] || "Complete this task to earn rewards.");
                    let reward = parseInt(adminConfig[`t${i}_reward`]) || 10;
                    let link = adminDataConfigEscape(adminConfig[`t${i}_link`]);
                    
                    let design = taskUIPresets[(i-1) % taskUIPresets.length];
                    let isCompleted = localStorage.getItem(`smart_task_date_${i}_${uid}`) === today;
                    
                    let cardClass = isCompleted ? "task-card-node completed" : "task-card-node";
                    
                    let btnHtml = isCompleted 
                        ? `<button class="action-task-btn" disabled style="background:#334155;">${doneTxt} ✅</button>`
                        : `<button class="action-task-btn" id="task_trigger_btn_${i}" onclick="executeTriggerSmartTask(${i}, ${reward}, '${link}')"><span>${startTxt}</span> ⚡</button>`;

                    let taskHtml = `
                        <div class="task-meta">
                            <span class="task-title"><i class="fa-solid ${design.icon}" style="color: ${design.color};"></i> <span>${title}</span></span>
                            <span class="task-desc">${desc}</span>
                            <div><span class="task-reward-badge">+${reward} COINS</span></div>
                        </div>
                        ${btnHtml}
                    `;
                    
                    let taskNode = document.createElement("div");
                    taskNode.className = cardClass;
                    taskNode.id = `task_wrapper_${i}`;
                    taskNode.innerHTML = taskHtml;
                    
                    container.appendChild(taskNode);
                }
            }

            // Fallback Defaults if Admin panel is empty
            if (!validTasksFound && !adminConfig) {
                // Hardcoded Defaults
                let defaultTasks = [
                    { id: 1, title: "Premium Video Ad 01", desc: "Watch the sponsor video completely and remain active.", reward: 30 },
                    { id: 2, title: "Sponsored Web Offer 02", desc: "Explore the partner web portal page completely to receive credits.", reward: 25 },
                    { id: 3, title: "Notification Task 03", desc: "Open the community distribution network hub and stay active.", reward: 40 }
                ];

                defaultTasks.forEach((t, i) => {
                    let design = taskUIPresets[i % taskUIPresets.length];
                    let isCompleted = localStorage.getItem(`smart_task_date_${t.id}_${uid}`) === today;
                    let cardClass = isCompleted ? "task-card-node completed" : "task-card-node";
                    
                    let btnHtml = isCompleted 
                        ? `<button class="action-task-btn" disabled style="background:#334155;">${doneTxt} ✅</button>`
                        : `<button class="action-task-btn" id="task_trigger_btn_${t.id}" onclick="executeTriggerSmartTask(${t.id}, ${t.reward}, '${defaultSmartlinkGlobal}')"><span>${startTxt}</span> ⚡</button>`;

                    let taskNode = document.createElement("div");
                    taskNode.className = cardClass;
                    taskNode.id = `task_wrapper_${t.id}`;
                    taskNode.innerHTML = `
                        <div class="task-meta">
                            <span class="task-title"><i class="fa-solid ${design.icon}" style="color: ${design.color};"></i> <span>${t.title}</span></span>
                            <span class="task-desc">${t.desc}</span>
                            <div><span class="task-reward-badge">+${t.reward} COINS</span></div>
                        </div>
                        ${btnHtml}
                    `;
                    container.appendChild(taskNode);
                });
            }
        }

        // Helper to prevent script injection via admin inputs
        function adminDataConfigEscape(str) {
            if(!str) return "";
            return str.replace(/'/g, "\\'").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Script Injector for Admin Banners
        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        // 🔥 ADDED TAB TRACKER 
        window.hasMainTabHidden = false;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) { window.hasMainTabHidden = true; }
        });

        function showCustomAlert(msgKey, appendText = "", isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msgStr = langData[currentLang] && langData[currentLang][msgKey] ? langData[currentLang][msgKey] : langData["en"][msgKey];

            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msgStr + appendText;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        // 🔒 SMART TASK INTERLOCK MODULE (WITH IN-APP VIEWER)
        function executeTriggerSmartTask(taskIdInt, rewardCoinsValueInt, targetUrlStr) {
            let today = new Date().toISOString().slice(0, 10);
            if(localStorage.getItem(`smart_task_date_${taskIdInt}_${uid}`) === today) return;
            if(isValidationActive) return;

            isValidationActive = true;
            activeProcessingTaskIdInt = taskIdInt;
            activeProcessingTaskCoinsRewardValueInt = rewardCoinsValueInt;

            liveTickerCountdownValueInt = globalAdTimerSeconds;
            totalActiveFocusSecondsInt = 0;
            window.hasMainTabHidden = false; // Reset Tracker

            // IN-APP VIEWER DISPLAY
            document.getElementById("inAppAdViewer").style.display = "flex";
            document.getElementById("adTimerDisplay").style.display = "flex";
            document.getElementById("adCloseBtn").style.display = "none";
            document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${liveTickerCountdownValueInt}s`;
            
            // Load Ad URL into iframe
            document.getElementById("adIframe").src = targetUrlStr;

            runningTaskEngineInterval = setInterval(() => {
                liveTickerCountdownValueInt--;
                document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${liveTickerCountdownValueInt}s`;

                // Check: Background tab minimizing validation monitor
                if(document.hidden) {
                    clearInterval(runningTaskEngineInterval);
                    document.getElementById("inAppAdViewer").style.display = "none";
                    document.getElementById("adIframe").src = "";
                    executeRollbackTaskWallHUD();
                    showCustomAlert("err_invalid");
                    return;
                }

                if(liveTickerCountdownValueInt <= 0) {
                    clearInterval(runningTaskEngineInterval);
                    document.getElementById("adTimerDisplay").style.display = "none";
                    document.getElementById("adCloseBtn").style.display = "block"; // Show X Button
                }
            }, 1000);
        }

        // 💰 DATA REWARD PIPELINE (PURE FIREBASE API & DAILY TASK SYNC 't13')
        function closeInAppAdAndClaim() {
            document.getElementById("inAppAdViewer").style.display = "none";
            document.getElementById("adIframe").src = ""; // Stop video/ad
            executeCreditVerifiedTaskCoinsViaFirebase();
        }

        function executeCreditVerifiedTaskCoinsViaFirebase() {
            // 1. Add Coins securely via Transaction
            db.ref(`users/${uid}/coins`).transaction((current) => {
                return (current || 0) + activeProcessingTaskCoinsRewardValueInt;
            }).then(() => {
                
                // 2. Mark Daily Task 't13' as Complete
                db.ref(`users/${uid}/completed_daily_tasks`).once('value', (snap) => {
                    let tasks = snap.val() || [];
                    if (!tasks.includes("t13")) {
                        tasks.push("t13");
                        db.ref(`users/${uid}/completed_daily_tasks`).set(tasks);
                    }
                });

                // Lock the task locally for today
                let today = new Date().toISOString().slice(0, 10);
                localStorage.setItem(`smart_task_date_${activeProcessingTaskIdInt}_${uid}`, today);
                
                showCustomAlert("err_success", ` (+${activeProcessingTaskCoinsRewardValueInt} 🪙)`, true);
                
                // Refresh the UI to show it as completed
                if (globalAdminDataConfig) {
                    executeDynamicEngineRenderer(globalAdminDataConfig);
                } else {
                    window.location.reload(); // Fallback reload
                }
                
            }).catch(() => {
                alert("Task Verified but couldn't sync with server. Try again.");
            }).finally(() => {
                executeRollbackTaskWallHUD();
            });
        }

        function executeRollbackTaskWallHUD() {
            isValidationActive = false;
        }
    </script>
</body>
</html>
