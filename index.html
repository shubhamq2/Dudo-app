<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - DUDO</title>
    
    <!-- 🔥 Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <!-- Auto-Login Check -->
    <script>
        if(localStorage.getItem("userId")) {
            window.location.href = "ho.html";
        }
    </script>

    <style>
        /* Premium DUDO Dark Theme */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #060913; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
        
        .login-container { background: #1e293b; width: 90%; max-width: 400px; border-radius: 20px; padding: 30px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; position: relative; overflow: hidden; }
        .login-container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981); }

        .login-header { text-align: center; margin-bottom: 20px; }
        .login-header h2 { margin: 0; font-size: 32px; font-weight: 900; color: #fff; letter-spacing: 1px; }
        .login-header h2 span { color: #06b6d4; }
        .login-header p { margin: 5px 0 0 0; font-size: 13px; color: #94a3b8; }

        /* Google Button */
        .google-btn { width: 100%; background: #ffffff; color: #1e293b; border: none; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(255,255,255,0.1); transition: 0.2s; margin-bottom: 15px; }
        .google-btn:active { transform: scale(0.97); }
        .google-btn img { width: 18px; }

        .divider { display: flex; align-items: center; text-align: center; color: #64748b; font-size: 11px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .auth-toggle { display: flex; background: #0f172a; border-radius: 12px; padding: 5px; margin-bottom: 20px; border: 1px solid #334155; }
        .auth-toggle button { flex: 1; padding: 12px; border: none; background: transparent; color: #94a3b8; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .auth-toggle button.active { background: #3b82f6; color: #fff; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 11px; font-weight: bold; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        .input-group input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; padding: 14px; font-size: 14px; outline: none; box-sizing: border-box; transition: 0.2s; }
        .input-group input:focus { border-color: #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.2); }

        .forgot-pass { text-align: right; margin-bottom: 20px; }
        .forgot-pass a { color: #06b6d4; font-size: 12px; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .forgot-pass a:hover { color: #3b82f6; text-decoration: underline; }

        .action-btn { width: 100%; border: none; padding: 16px; border-radius: 50px; font-size: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; color: #fff; }
        .btn-login { background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }
        .btn-register { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
        .action-btn:active { transform: scale(0.97); }

        .support-btn { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; width: 100%; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
        .support-btn:hover { border-color: #06b6d4; color: #06b6d4; background: rgba(6, 182, 212, 0.05); }

        .compliance-text { font-size: 10px; text-align: center; margin-top: 15px; color: #64748b; line-height: 1.4; }

        /* Hidden Sections */
        #setupProfileScreen { display: none; text-align: center; }
        .main-auth-box { display: block; }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="main-auth-box" id="mainAuthBox">
            <div class="login-header">
                <h2>DU<span>DO</span> 🚀</h2>
                <p>Welcome back to the best reward app!</p>
            </div>

            <!-- Free Google Login Button -->
            <button class="google-btn" onclick="loginWithGoogle()" id="googleLoginBtnMain">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G">
                Fast Login with Google
            </button>

            <div class="divider">OR USE EMAIL ADDRESS</div>

            <div class="auth-toggle">
                <button id="tabLogin" class="active" onclick="switchTab('login')">Login</button>
                <button id="tabRegister" onclick="switchTab('register')">Register</button>
            </div>
            
            <!-- 🟢 1. LOGIN FORM (Email + Password) -->
            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                
                <div class="forgot-pass">
                    <a href="support.html">Forgot Password?</a>
                </div>
                
                <button type="submit" class="action-btn btn-login" id="btnLogin">Login Securely</button>
            </form>

            <!-- 🔵 2. REGISTER FORM (Email + Password + Name + Referral) -->
            <form id="registerForm" style="display: none;">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label>Create Password</label>
                    <input type="password" id="regPassword" placeholder="Create a strong password (min 6 chars)" required>
                </div>
                <div class="input-group">
                    <label>Referral Code (Optional)</label>
                    <input type="text" id="regReferral" placeholder="Enter friend's invite code">
                </div>
                
                <button type="submit" id="btnRegister" class="action-btn btn-register">Create Account</button>
                
                <p class="compliance-text">By registering, you agree to our Terms of Service & Privacy Policy.<br>Multiple accounts on the same device will lead to account restrictions.</p>
            </form>

            <button class="support-btn" onclick="window.location.href='support.html'">
                🎧 Need Help? Contact Customer Support
            </button>
        </div>

        <!-- 🟣 PROFILE SETUP FOR GOOGLE LOGIN -->
        <div id="setupProfileScreen">
            <h3 style="color:#10b981; margin-top:0;">🎉 Welcome to Dudo!</h3>
            <p style="font-size:13px; color:#94a3b8;">Set up your profile to start rewards.</p>
            
            <div class="input-group" style="text-align: left;">
                <label>Your Full Name</label>
                <input type="text" id="googleRegName" placeholder="Enter your name" required>
            </div>
            <div class="input-group" style="text-align: left;">
                <label>Referral Code (Optional)</label>
                <input type="text" id="googleRegReferral" placeholder="Got an invite code?">
            </div>

            <button class="action-btn btn-login" onclick="completeGoogleRegistration()">Start Earn rewards Now ➔</button>
        </div>

    </div>

    <!-- Firebase Init & Auth Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkNc_eIIfqqxbTGqyZ1YWGE3W6lbNqUJQ",
            authDomain: "dudo-63594.firebaseapp.com",
            databaseURL: "https://dudo-63594-default-rtdb.firebaseio.com",
            projectId: "dudo-63594",
            storageBucket: "dudo-63594.firebasestorage.app",
            messagingSenderId: "732244407571",
            appId: "1:732244407571:web:d08486136dea6190de96e6",
            measurementId: "G-H6VVEXCD54"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const auth = firebase.auth();

        // 🛡️ ANTI-FARMING: Generate & Store Unique Device ID
        let currentDeviceId = localStorage.getItem("dudo_device_token");
        if (!currentDeviceId) {
            currentDeviceId = "DEV_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9).toUpperCase();
            localStorage.setItem("dudo_device_token", currentDeviceId);
        }

        let authenticatedGoogleUser = null;

        // UI Tab Switcher
        function switchTab(tab) {
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
        }

        // Auto-fill Refer Code from URL Link
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            if(refCode) {
                switchTab('register');
                document.getElementById("regReferral").value = refCode;
                document.getElementById("googleRegReferral").value = refCode;
            }
        };

        // ==========================================
        // 1️⃣ EMAIL LOGIN
        // ==========================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            document.getElementById('btnLogin').innerText = "Authenticating...";

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    const user = userCredential.user;
                    database.ref('users/' + user.uid).once('value', snapshot => {
                        if(snapshot.exists()) {
                            let userData = snapshot.val();
                            if(userData.account_security_status_state_flag === 'BANNED_TERMINATED') {
                                auth.signOut();
                                document.getElementById('btnLogin').innerText = "Login Securely";
                                alert("🚨 Your account has been restricted for policy violations.");
                                return;
                            }
                            localStorage.setItem("userId", user.uid);
                            window.location.href = "ho.html";
                        } else {
                            localStorage.setItem("userId", user.uid);
                            window.location.href = "ho.html";
                        }
                    });
                })
                .catch((error) => {
                    document.getElementById('btnLogin').innerText = "Login Securely";
                    alert("❌ Login Failed: " + error.message);
                });
        });

        // ==========================================
        // 2️⃣ EMAIL REGISTRATION
        // ==========================================
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value.trim();
            const ref = document.getElementById('regReferral').value.trim();

            if (pass.length < 6) return alert("❌ Password must be at least 6 characters!");

            document.getElementById('btnRegister').innerText = "Creating Account...";

            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    const user = userCredential.user;
                    const cleanRefCode = ref ? ref.toUpperCase() : "NONE";

                    const newUserData = {
                        name: name,
                        email: email,
                        phone: "EMAIL_LOGIN",
                        password: pass,
                        balance: 0,
                        coins: 0,
                        ad_coins: 0,
                        total_lifetime_coins_earned: 0,
                        total_referrals: 0,
                        joined_at: Date.now(),
                        device_id_token: currentDeviceId,
                        account_security_status_state_flag: "ACTIVE",
                        referral_code_used: cleanRefCode
                    };

                    database.ref('users/' + user.uid).set(newUserData).then(() => {
                        executeReferralBonusEngine(cleanRefCode);
                        alert("✅ Account created successfully!");
                        localStorage.setItem("userId", user.uid); 
                        window.location.href = "ho.html"; 
                    }).catch(err => {
                        alert("Error saving profile: " + err.message);
                    });
                })
                .catch((error) => {
                    document.getElementById('btnRegister').innerText = "Create Account";
                    alert("❌ Registration Error: " + error.message);
                });
        });

        // ==========================================
        // 3️⃣ GOOGLE LOGIN (Redirect Method)
        // ==========================================
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        
        function loginWithGoogle() {
            document.getElementById("googleLoginBtnMain").innerText = "Redirecting to Google...";
            auth.signInWithRedirect(googleProvider);
        }

        // Catch the result when page reloads from Google Auth
        auth.getRedirectResult().then((result) => {
            if (result && result.user) {
                authenticatedGoogleUser = result.user;
                
                database.ref('users/' + authenticatedGoogleUser.uid).once('value', snapshot => {
                    if (snapshot.exists()) {
                        let userData = snapshot.val();
                        if(userData.account_security_status_state_flag === 'BANNED_TERMINATED') {
                            auth.signOut();
                            alert("🚨 Your account is restricted!");
                            return;
                        }
                        localStorage.setItem("userId", authenticatedGoogleUser.uid);
                        window.location.href = "ho.html";
                    } else {
                        document.getElementById("mainAuthBox").style.display = "none";
                        document.getElementById("googleRegName").value = authenticatedGoogleUser.displayName || "";
                        document.getElementById("setupProfileScreen").style.display = "block";
                    }
                });
            }
        }).catch((error) => {
            if (error.code !== 'auth/redirect-cancelled-by-user') {
                alert("Google Sign-In Failed: " + error.message);
            }
        });

        function completeGoogleRegistration() {
            const name = document.getElementById("googleRegName").value.trim();
            const ref = document.getElementById("googleRegReferral").value.trim();
            if(!name) return alert("Please enter your name!");

            const cleanRefCode = ref ? ref.toUpperCase() : "NONE";

            const newUserData = {
                name: name,
                phone: "GOOGLE_LOGIN",
                email: authenticatedGoogleUser.email,
                password: "GOOGLE_ACCOUNT",
                balance: 0,
                coins: 0,
                ad_coins: 0,
                total_lifetime_coins_earned: 0,
                total_referrals: 0,
                joined_at: Date.now(),
                device_id_token: currentDeviceId,
                account_security_status_state_flag: "ACTIVE",
                referral_code_used: cleanRefCode
            };

            database.ref('users/' + authenticatedGoogleUser.uid).set(newUserData).then(() => {
                executeReferralBonusEngine(cleanRefCode);
                alert("✅ Google Account Setup Successful!");
                localStorage.setItem("userId", authenticatedGoogleUser.uid); 
                window.location.href = "ho.html"; 
            });
        }

        // ==========================================
        // 🔥 COMMON REFERRAL ENGINE (₹5 INSTANT)
        // ==========================================
        function executeReferralBonusEngine(cleanRefCode) {
            if (!cleanRefCode || cleanRefCode === "NONE") return;
            
            database.ref('users').orderByChild('referCode').equalTo(cleanRefCode).once('value', refSnap => {
                if(refSnap.exists()) {
                    refSnap.forEach(refChild => {
                        let refUid = refChild.key;
                        let currentBal = parseFloat(refChild.val().balance || 0);
                        let currentRefs = Number(refChild.val().total_referrals || 0);
                        
                        database.ref('users/' + refUid).update({
                            balance: currentBal + 5,
                            total_referrals: currentRefs + 1
                        });

                        database.ref('users/' + refUid + '/earning_history').push({
                            activity: `Referral Bonus (Instant Lvl 1)`,
                            amount: 5,
                            coins_credited: 0,
                            timestamp: Date.now()
                        });
                    });
                }
            });
        }
    </script>
</body>
    </html>
