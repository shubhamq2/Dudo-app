<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dudo App - Login & Registration</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0f0f1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: #1e1e2f;
            width: 100%;
            max-width: 420px;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #2d2d48;
            position: relative;
        }

        .app-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-logo h1 {
            color: #00d2ff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .app-logo p {
            color: #8a8aa3;
            font-size: 13px;
            margin-top: 4px;
        }

        .tab-box {
            display: flex;
            background: #141423;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 22px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #8a8aa3;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #00d2ff;
            color: #0f0f1a;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #b0b0cc;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            background: #141423;
            border: 1px solid #2d2d48;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #00d2ff;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #8a8aa3;
            font-size: 14px;
            user-select: none;
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 12px;
            color: #00d2ff;
            text-decoration: none;
            margin-top: -6px;
            margin-bottom: 14px;
            cursor: pointer;
        }

        .action-btn {
            width: 100%;
            padding: 13px;
            background: #00d2ff;
            color: #0f0f1a;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .action-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #666;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #2d2d48;
        }

        .divider span {
            padding: 0 10px;
            color: #8a8aa3;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .google-btn:hover {
            background: #e6e6e6;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .support-box {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #aaa;
        }

        .support-box a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
        }

        .legal-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #666680;
            line-height: 1.6;
        }

        .legal-footer a {
            color: #00d2ff;
            text-decoration: none;
        }

        /* Modal Popup CSS for Forgot Password */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1e1e2f;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 360px;
            border: 1px solid #2d2d48;
            text-align: center;
        }
        .modal-content h3 { margin-bottom: 12px; color: #00d2ff; }
        .modal-content p { font-size: 13px; color: #aaa; margin-bottom: 16px; }
        .close-btn { background: #ff4757; color: #fff; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="app-logo">
            <h1>Dudo App</h1>
            <p>Earn Rewards & Complete Tasks</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="tab-box">
            <button class="tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Login</button>
            <button class="tab-btn" id="tabRegBtn" onclick="switchAuthTab('register')">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="loginSection" class="form-section active">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="loginEmail" placeholder="e.g. user@gmail.com">
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter password">
                    <span class="toggle-password" onclick="togglePass('loginPassword', this)">👁️</span>
                </div>
            </div>
            <span class="forgot-link" onclick="openForgotModal()">Forgot Password?</span>
            <button class="action-btn" id="btnLogin" onclick="processEmailLogin()">Login</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerSection" class="form-section">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="regName" placeholder="Enter full name">
                </div>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="regEmail" placeholder="Enter email address">
                </div>
            </div>
            <div class="form-group">
                <label>Create Password</label>
                <div class="input-wrapper">
                    <input type="password" id="regPassword" placeholder="Minimum 6 characters">
                    <span class="toggle-password" onclick="togglePass('regPassword', this)">👁️</span>
                </div>
            </div>
            <div class="form-group">
                <label>Referral Code (Optional)</label>
                <div class="input-wrapper">
                    <input type="text" id="regReferral" placeholder="Enter referral code">
                </div>
            </div>
            <button class="action-btn" id="btnRegister" onclick="processEmailRegister()">Create Account</button>
        </div>

        <div class="divider">
            <span>OR CONTINUE WITH GMAIL</span>
        </div>

        <!-- GOOGLE / GMAIL LOGIN BUTTON -->
        <button class="google-btn" onclick="handleGoogleClick()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
            Sign in with Google
        </button>

        <!-- HELP DESK / SUPPORT LINK -->
        <div class="support-box">
            Need Help? <a href="mailto:support@dudoapp.com?subject=Dudo%20App%20Support">Contact Support</a>
        </div>
    </div>

    <!-- FORGOT PASSWORD MODAL POPUP -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <h3>Reset Password</h3>
            <p>Enter your email to receive password reset instructions.</p>
            <div class="form-group">
                <input type="email" id="resetEmail" placeholder="Enter your registered email">
            </div>
            <button class="action-btn" onclick="submitPasswordReset()">Send Reset Link</button>
            <button class="action-btn close-btn" onclick="closeForgotModal()">Close</button>
        </div>
    </div>

    <!-- LEGAL FOOTER (FOR PLAY STORE APPROVAL) -->
    <div class="legal-footer">
        By continuing, you agree to our <br>
        <a href="privacypolicy.html" target="_blank">Privacy Policy</a> &bull; 
        <a href="terms.html" target="_blank">Terms of Service</a>
    </div>

    <script>
        const API_URL = "https://dudo-app.onrender.com/api";

        // Tab Switcher
        function switchAuthTab(type) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));

            if (type === 'login') {
                document.getElementById('tabLoginBtn').classList.add('active');
                document.getElementById('loginSection').classList.add('active');
            } else {
                document.getElementById('tabRegBtn').classList.add('active');
                document.getElementById('registerSection').classList.add('active');
            }
        }

        // Toggle Password Visibility
        function togglePass(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.innerText = "🙈";
            } else {
                input.type = "password";
                icon.innerText = "👁️";
            }
        }

        // Forgot Password Modal Controls
        function openForgotModal() { document.getElementById('forgotModal').style.display = 'flex'; }
        function closeForgotModal() { document.getElementById('forgotModal').style.display = 'none'; }

        async function submitPasswordReset() {
            const email = document.getElementById('resetEmail').value.trim();
            if (!email) return alert("Please enter your email.");
            alert("Password reset instructions sent to " + email);
            closeForgotModal();
        }

        // Email Login Execution
        async function processEmailLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('btnLogin');

            if (!email || !password) return alert("Please enter both Email and Password.");

            btn.innerText = "Authenticating...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem("userToken", data.token);
                    localStorage.setItem("userId", data.userId);
                    window.location.href = "ho.html";
                } else {
                    alert("❌ Login Failed: " + data.message);
                }
            } catch (err) {
                alert("⚠️ Connection Delayed: Server is waking up. Retry in 10s.");
            } finally {
                btn.innerText = "Login";
                btn.disabled = false;
            }
        }

        // Email Registration Execution
        async function processEmailRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const referralCode = document.getElementById('regReferral').value.trim();
            const btn = document.getElementById('btnRegister');

            if (!name || !email || !password) return alert("Please fill in all required fields.");
            if (password.length < 6) return alert("Password must be at least 6 characters.");

            btn.innerText = "Creating Account...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, referralCode })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem("userToken", data.token);
                    localStorage.setItem("userId", data.userId);
                    alert("🎉 Account Created Successfully!");
                    window.location.href = "ho.html";
                } else {
                    alert("❌ Registration Failed: " + data.message);
                }
            } catch (err) {
                alert("⚠️ Server Connection Error.");
            } finally {
                btn.innerText = "Create Account";
                btn.disabled = false;
            }
        }

        function handleGoogleClick() {
            alert("Redirecting to Google Authentication...");
        }
    </script>
</body>
</html>
