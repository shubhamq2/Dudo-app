        .profile-img-preview { width: 95px; height: 95px; border-radius: 50%; border: 4px solid var(--primary-blue); background: #0f172a; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); display: flex; justify-content: center; align-items: center; overflow: hidden; }

        .avatar-modal { background: var(--card-bg); width: 100%; max-width: 440px; border-top-left-radius: 25px; border-top-right-radius: 25px; padding: 25px 20px; box-sizing: border-box; text-align: center; border-top: 4px solid var(--primary-blue); animation: slideUp 0.3s ease-out; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); border-left: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); }

            "pt": { "edit_title": "Editar Perfil", "locked": "Bloqueado", "lbl_uid": "ID do Usuário", "lbl_name": "Nome Completo", "lbl_email": "E-mail", "lbl_state": "Estado", "btn_save": "Atualizar", "success_msg": "Perfil atualizado com sucesso!", "tap_avatar": "Toque para mudar o avatar", "err_empty": "❌ O nome é obrigatório!", "err_server": "❌ Falha na atualização." },
            "ru": { "edit_title": "Изменить профиль", "locked": "Заблокировано", "lbl_uid": "ID пользователя", "lbl_name": "Полное имя", "lbl_email": "Почта", "lbl_state": "Штат / Регион", "btn_save": "Обновить", "success_msg": "Профиль успешно обновлен!", "tap_avatar": "Нажмите, чтобы изменить аватар", "err_empty": "❌ Имя обязательно!", "err_server": "❌ Ошибка обновления." }
        };

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) { elem.innerText = transObj[key]; }
            });
            document.getElementById("appLanguage").value = langCode;
        }

        const uid = localStorage.getItem("userId");
        let pendingAvatarUrl = "https://api.dicebear.com/7.x/fun-emoji/svg?seed=Smile&backgroundColor=b6e3f4"; // Fallback
        
        // 🔥 MAPPED BOT AVATARS FROM 1v1.html / game.html
        const systemAvatarsList = [
            "🎯", "🦊", "🥷", "🦁", "🐉", "🦅", "💀", "👦", "😎", "👩", 
            "https://api.dicebear.com/7.x/avataaars/svg?seed=Rahul&backgroundColor=b6e3f4",
            "https://api.dicebear.com/7.x/micah/svg?seed=King&backgroundColor=e2e8f0"
        ];

        // 💡 SMART EMOJI-TO-IMAGE CONVERTER
        function createEmojiURI(emoji) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50%" y="54%" font-size="55" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.href = "index.html"; return; }
            if (!navigator.onLine) document.getElementById("globalOfflineWarningOverlay").style.display = "flex";

            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            document.getElementById("displayUID").value = uid.toUpperCase();
            document.getElementById("displayEmail").value = "Fetching from server...";

            populateAvatarModal();

            auth.onAuthStateChanged((user) => {
                if (user) {
                    // 1. Fetch User Data to Populate Edit Form
                    db.ref('users/' + uid).once('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.val();
                            
                            document.getElementById("displayEmail").value = data.email || user.email || "Not Available";
                            document.getElementById("editName").value = data.name || "";
                            document.getElementById("editState").value = data.state || "";

                            if(data.profile_pic) {
                                pendingAvatarUrl = (data.profile_pic.startsWith("http") || data.profile_pic.startsWith("data:")) ? data.profile_pic : createEmojiURI(data.profile_pic);
                            }
                            updateAvatarPreviewUI(pendingAvatarUrl);
                        }
                    });

                    // 2. Fetch Admin Banners for Edit Profile Page
                    db.ref('global_system_runtime_configurations/edit_profile_configs').on('value', (snap) => {
                        if(snap.exists()) {
                            const adminData = snap.val();
                            
                            // Load Banners safely to prevent app crash
                            let s1Code = (adminData.slot1 && adminData.slot1.code) ? adminData.slot1.code : adminData.slot1_code;
                            let s1Active = (adminData.slot1 && adminData.slot1.active !== undefined) ? adminData.slot1.active : adminData.active;
                            if (s1Code && s1Active !== false) {
                                document.getElementById("adminBannerSlot1").style.display = "flex";
                                setTimeout(() => setAdHTML(document.getElementById("adminBannerSlot1"), s1Code), 400);
                            } else { document.getElementById("adminBannerSlot1").style.display = "none"; }
                            
                            let s2Code = (adminData.slot2 && adminData.slot2.code) ? adminData.slot2.code : adminData.slot2_code;
                            let s2Active = (adminData.slot2 && adminData.slot2.active !== undefined) ? adminData.slot2.active : adminData.active;
                            if (s2Code && s2Active !== false) {
                                document.getElementById("adminBannerSlot2").style.display = "flex";
                                setTimeout(() => setAdHTML(document.getElementById("adminBannerSlot2"), s2Code), 800);
                            } else { document.getElementById("adminBannerSlot2").style.display = "none"; }
                            
                            let s3Code = (adminData.slot3 && adminData.slot3.code) ? adminData.slot3.code : adminData.slot3_code;
                            let s3Active = (adminData.slot3 && adminData.slot3.active !== undefined) ? adminData.slot3.active : adminData.active;
                            if (s3Code && s3Active !== false) {
                                document.getElementById("adminBannerSlot3").style.display = "flex";
                                setTimeout(() => setAdHTML(document.getElementById("adminBannerSlot3"), s3Code), 1200);
                            } else { document.getElementById("adminBannerSlot3").style.display = "none"; }
                            
                            let s4Code = (adminData.slot4 && adminData.slot4.code) ? adminData.slot4.code : adminData.slot4_code;
                            let s4Active = (adminData.slot4 && adminData.slot4.active !== undefined) ? adminData.slot4.active : adminData.active;
                            if (s4Code && s4Active !== false) {
                                document.getElementById("adminBannerSlot4").style.display = "flex";
                                setTimeout(() => setAdHTML(document.getElementById("adminBannerSlot4"), s4Code), 1600);
                            } else { document.getElementById("adminBannerSlot4").style.display = "none"; }
                        }
                    });
                } else {
                    window.location.replace("index.html");
                }
            });
        });

        // Script Injector for Admin Banners
        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        // Generate Avatar Modal Selection Grid
        function populateAvatarModal() {
            const gridBox = document.getElementById("avatarGridBox");
            gridBox.innerHTML = "";
            systemAvatarsList.forEach((avatarCode) => {
                let url = avatarCode.startsWith("http") ? avatarCode : createEmojiURI(avatarCode);
                
                let elem = document.createElement("div");
                elem.className = "avatar-option";
                elem.innerHTML = `<img src="${url}">`;
                
                elem.onclick = () => {
                    pendingAvatarUrl = url; 
                    updateAvatarPreviewUI(pendingAvatarUrl);
                    closeAvatarModal();
                };
                gridBox.appendChild(elem);
            });
        }

        function updateAvatarPreviewUI(avatarData) {
            const previewBox = document.getElementById("editDisplayPic");
            previewBox.innerHTML = `<img src="${avatarData}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
        }

        function openAvatarModal() { document.getElementById("avatarModal").style.display = "flex"; }
        function closeAvatarModal() { document.getElementById("avatarModal").style.display = "none"; }

        function showCustomAlert(msgKey, isSuccess = false, redirectUrl = null) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msgStr = langData[currentLang] && langData[currentLang][msgKey] ? langData[currentLang][msgKey] : langData["en"][msgKey] || msgKey;

            const box = document.getElementById("customAlertBox");
            if(isSuccess) box.classList.add("success-border");
            else box.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msgStr;
            document.getElementById("alertOverlay").style.display = "block";
            box.style.display = "block";

            box.querySelector("button").onclick = () => {
                closeCustomAlert();
                if(redirectUrl) window.location.href = redirectUrl;
            };
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        // 🚀 SECURE PROFILE SAVE TO PURE FIREBASE DATABASE
        function saveProfileData() {
            let nameInput = document.getElementById("editName").value.trim();
            let stateInput = document.getElementById("editState").value.trim();

            if(!nameInput) {
                showCustomAlert("err_empty");
                return;
            }

            const btn = document.getElementById("btnUpdateProfile");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            
            btn.innerText = "SAVING...";
            btn.disabled = true;

            // Direct Firebase Update
            db.ref(`users/${uid}`).update({
                name: nameInput,
                state: stateInput,
                profile_pic: pendingAvatarUrl
            })
            .then(() => {
                localStorage.setItem("userName", nameInput);
                showCustomAlert("success_msg", true, "profile.html"); 
            })
            .catch((error) => {
                showCustomAlert("err_server");
            })
            .finally(() => {
                btn.innerText = langData[currentLang]["btn_save"] || "Update Profile";
                btn.disabled = false;
            });
        }
    </script>
</body>
