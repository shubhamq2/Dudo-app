<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Tasks - Dudo</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🔥 Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-gold: #fbbf24;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; color: var(--text-main); padding-bottom: 20px; min-height: 100vh; }
        
        /* Premium Corporate Header */
        .header { width: 100%; background: rgba(15, 23, 42, 0.9); padding: 15px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--primary-blue); backdrop-filter: blur(10px); }
        .back-btn { font-size: 20px; font-weight: bold; color: var(--primary-blue); text-decoration: none; padding: 5px 12px; border-radius: 8px; background: rgba(59, 130, 246, 0.15); transition: 0.2s; border: 1px solid rgba(59, 130, 246, 0.3); }
        .back-btn:active { transform: scale(0.9); }
        .header h2 { margin: 0; font-size: 19px; color: #fff; font-weight: 800; flex-grow: 1; text-align: center; margin-right: 40px; letter-spacing: 0.5px; }
        
        .custom-lang-select { padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); outline: none; font-size: 12px; background: #1e293b; color: var(--primary-blue); font-weight: bold; cursor: pointer; }

        /* Live Synced Mini Dashboard for User Trust */
        .task-status-bar { width: 92%; max-width: 460px; background: rgba(59, 130, 246, 0.1); border: 1px dashed var(--primary-blue); padding: 12px 18px; border-radius: 12px; margin-top: 15px; display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 800; color: #93c5fd; box-sizing: border-box; align-items: center; }
        .task-status-bar i { margin-right: 5px; }
        .coin-accent { color: var(--accent-gold); font-size: 15px; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(251,191,36,0.3); transition: 0.3s; }

        .main-container { width: 100%; max-width: 500px; margin-top: 15px; box-sizing: border-box; flex-grow: 1; display: flex; flex-direction: column; padding: 0 10px; }
        .iframe-wrapper { width: 100%; height: 85vh; background: #ffffff; border-radius: 16px; overflow: hidden; border: 2px solid rgba(59, 130, 246, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .loading-wall { text-align: center; color: var(--text-sub); margin-top: 50px; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="ho.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 data-i18n="task_title">Premium Tasks</h2>
        <select class="custom-lang-select" id="appLanguage" onchange="changeLanguage(this.value)">
            <option value="en">EN</option><option value="hi">HI</option><option value="bn">BN</option>
            <option value="te">TE</option><option value="mr">MR</option><option value="ta">TA</option>
            <option value="ur">UR</option><option value="gu">GU</option><option value="es">ES</option>
            <option value="fr">FR</option><option value="ar">AR</option><option value="pt">PT</option>
            <option value="ru">RU</option>
        </select>
    </div>

    <div class="task-status-bar">
        <span><i class="fa-solid fa-satellite-dish" style="color: var(--accent-green);"></i> <span data-i18n="wall_active">Wall Connected</span></span>
        <span>Points: <span class="coin-accent" id="liveTaskCoins">...</span></span>
    </div>

    <div class="main-container">
        <div id="offerwallLocation">
            <div class="loading-wall"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading secure offerwall...</div>
        </div>
    </div>

    <!-- 🔥 PURE FIREBASE REALTIME SCRIPT ENGINE -->
    <script>
        // 1. Firebase Config
       const firebaseConfig = {
    apiKey: "AIzaSyDuLIk8A5X7w0zZVblZZlIuMwExDUW56zQ",
    authDomain: "dudo-dc7cd.firebaseapp.com",
    databaseURL: "https://dudo-dc7cd-default-rtdb.firebaseio.com",
    projectId: "dudo-dc7cd",
    storageBucket: "dudo-dc7cd.firebasestorage.app",
    messagingSenderId: "254085241041",
    appId: "1:254085241041:web:3a8f3d8490aa37ff454df0",
    measurementId: "G-8BKZSHYLF6"
};
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // 🌐 FULL 13+ LANGUAGES SUPPORT
        const langData = {
            "en": { "task_title": "Premium Tasks", "wall_active": "Wall Connected" },
            "hi": { "task_title": "प्रीमियम टास्क", "wall_active": "सक्रिय (Live)" },
            "bn": { "task_title": "প্রিমিয়াম টাস্ক", "wall_active": "সংযুক্ত আছে" },
            "te": { "task_title": "ప్రీమియం టాస్క్‌లు", "wall_active": "కనెక్ట్ చేయబడింది" },
            "mr": { "task_title": "प्रीमियम टास्क", "wall_active": "कनेक्ट केले" },
            "ta": { "task_title": "பிரீமியம் பணிகள்", "wall_active": "இணைக்கப்பட்டது" },
            "ur": { "task_title": "پریمیم ٹاسک", "wall_active": "منسلک ہے" },
            "gu": { "task_title": "પ્રીમિયમ ટાસ્ક", "wall_active": "કનેક્ટેડ" },
            "es": { "task_title": "Tareas Premium", "wall_active": "Conectado" },
            "fr": { "task_title": "Tâches Premium", "wall_active": "Connecté" },
            "ar": { "task_title": "مهام مميزة", "wall_active": "متصل الآن" },
            "pt": { "task_title": "Tarefas Premium", "wall_active": "Conectado" },
            "ru": { "task_title": "Премиум задачи", "wall_active": "Подключено" }
        };

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) { elem.innerText = transObj[key]; }
            });
            document.getElementById("appLanguage").value = langCode;
        }

        const uid = localStorage.getItem("userId");
        let cpxAppId = "33205"; // Default CPX ID (Will be updated from Admin)
        let currentDisplayedCoins = -1;

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.replace("index.html"); return; }
            
            // Sync Language from Home Page
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            auth.onAuthStateChanged((user) => {
                if (user) {
                    loadOfferwallContext(user);
                } else {
                    window.location.replace("index.html");
                }
            });
        });

        // 📡 FETCH ADMIN CPX ID & INJECT SECURE IFRAME
        function loadOfferwallContext(user) {
            let uname = "Player";
            let uemail = user.email || "user@gmail.com";

            // 1. Fetch User Data (For dynamic URL params and Live Wallet Sync)
            db.ref('users/' + uid).on('value', (snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    uname = encodeURIComponent(userData.name || "Player");
                    
                    const newCoins = userData.coins || 0;
                    const coinDisplay = document.getElementById("liveTaskCoins");

                    // 🔥 MAGIC SILENT SYNC: If coins increase while user is on this page (via CPX Webhook to DB)
                    if (currentDisplayedCoins !== -1 && newCoins > currentDisplayedCoins) {
                        // Visual effect to show user they got money while staying on page
                        coinDisplay.innerText = newCoins + " 🪙";
                        coinDisplay.style.color = "var(--accent-green)";
                        coinDisplay.style.borderColor = "var(--accent-green)";
                        
                        setTimeout(() => {
                            coinDisplay.style.color = "var(--accent-gold)";
                            coinDisplay.style.borderColor = "rgba(251,191,36,0.3)";
                        }, 3000);
                        
                        // Fire a background request to log task 't6' as completed
                        syncDailyTaskCompletion();
                    } else {
                        coinDisplay.innerText = newCoins + " 🪙";
                    }
                    
                    currentDisplayedCoins = newCoins; // Update tracker
                }
            });

            // 2. Fetch Admin Configurations (For CPX ID from cpx_surveys node)
            db.ref('global_system_runtime_configurations/cpx_surveys').once('value', (snap) => {
                if(snap.exists()) {
                    const adminData = snap.val();
                    if(adminData.cpx_app_id) {
                        cpxAppId = adminData.cpx_app_id;
                    }
                }

                // 3. Inject iFrame securely once data is ready
                let secureFrameSrc = `https://offers.cpx-research.com/index.php?app_id=${cpxAppId}&ext_user_id=${uid}&username=${uname}&email=${uemail}`;
                
                document.getElementById("offerwallLocation").innerHTML = `
                    <iframe class="iframe-wrapper" src="${secureFrameSrc}" allow="clipboard-write; clipboard-read"></iframe>
                `;
            });
        }

        // 📝 AUTO-SYNC DAILY TASK 't6' WHEN REWARD DETECTED
        function syncDailyTaskCompletion() {
            db.ref(`users/${uid}/completed_daily_tasks`).once('value', (snap) => {
                let tasks = snap.val() || [];
                if (!tasks.includes("t6")) {
                    tasks.push("t6");
                    db.ref(`users/${uid}/completed_daily_tasks`).set(tasks);
                }
            });
        }
    </script>
</body>
</html>
