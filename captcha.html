        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) {
                    if(elem.tagName === "BUTTON" && elem.id === "captchaSubmitBtn") {
                        if(!elem.disabled) elem.innerText = transObj[key];
                    } else {
                        elem.innerText = transObj[key];
                    }
                }
            });
            document.getElementById("appLanguage").value = langCode;
        }

        // Script Injector for Admin Banners
        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        const uid = localStorage.getItem("userId");
        let currentActiveCaptchaCode = "";
        let activeAdminSmartlinkUrl = "https://www.profitablecpmrate.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js"; // Fallback default

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.replace("index.html"); return; }
            
            // Sync Language from Home Page
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);
            generateNewCaptchaCode();

            auth.onAuthStateChanged((user) => {
                if (user) {
                    // 1. Live Balance
                    db.ref('users/' + uid).on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.val();
                            document.getElementById("liveUserCoins").innerText = data.coins || 0;
                            
                            function createEmojiURI(emoji) {
                                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50%" y="54%" font-size="55" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
                                return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
                            }

                            // Smart Avatar Sync
                            let userName = data.name || "Player";
                            let finalAvatar = data.profile_pic ? data.profile_pic : `https://api.dicebear.com/7.x/adventurer/svg?seed=${userName || uid}&backgroundColor=b6e3f4`;
                            let avatarContainer = document.getElementById("headerProfileIcon");
                            if (finalAvatar.startsWith("http") || finalAvatar.startsWith("data:")) {
                                avatarContainer.innerHTML = `<img src="${finalAvatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            } else {
                                avatarContainer.innerHTML = `<img src="${createEmojiURI(finalAvatar)}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            }
                        }
                    });

                    // 2. Fetch Admin Configurations (Banners & Captcha Link & Coins/Time)
                    db.ref('global_system_runtime_configurations/captcha_configs').on('value', (snap) => {
                        if(snap.exists()) {
                            const adminData = snap.val();
                            
                            // 🔥 GET ADMIN CONTROLLED TIME AND COINS
                            if (adminData.ad_timer) { globalAdTimerSeconds = parseInt(adminData.ad_timer); }
                            if (adminData.reward_coins) { globalRewardCoins = parseInt(adminData.reward_coins); }

                            // Load Banners
                            if(adminData.slot1_code && adminData.active !== false) { document.getElementById("adminBannerSlot1").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot1"), adminData.slot1_code); } else { document.getElementById("adminBannerSlot1").style.display = "none"; }
                            if(adminData.slot2_code && adminData.active !== false) { document.getElementById("adminBannerSlot2").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot2"), adminData.slot2_code); } else { document.getElementById("adminBannerSlot2").style.display = "none"; }
                            if(adminData.slot3_code && adminData.active !== false) { document.getElementById("adminBannerSlot3").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot3"), adminData.slot3_code); } else { document.getElementById("adminBannerSlot3").style.display = "none"; }
                            if(adminData.slot4_code && adminData.active !== false) { document.getElementById("adminBannerSlot4").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot4"), adminData.slot4_code); } else { document.getElementById("adminBannerSlot4").style.display = "none"; }

                            // Setup Captcha Link
                            if (adminData.captcha_link) {
                                activeAdminSmartlinkUrl = adminData.captcha_link;
                            }
                        } else {
                            // Fallback to Global Smartlink
                            db.ref('global_system_runtime_configurations/globalSmartlink').once('value').then(globalSnap => {
                                if(globalSnap.exists()) activeAdminSmartlinkUrl = globalSnap.val();
                            });
                        }
                    });

                } else {
                    window.location.replace("index.html");
                }
            });
        });

        // Dynamic 6-Character Shield Token Generator
        function generateNewCaptchaCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; 
            let code = "";
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentActiveCaptchaCode = code;
            document.getElementById("captchaCodeString").innerText = currentActiveCaptchaCode;
            document.getElementById("captchaInputText").value = "";
        }

        function showCustomAlert(msgKey, isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msgStr = langData[currentLang] && langData[currentLang][msgKey] ? langData[currentLang][msgKey] : langData["en"][msgKey];

            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msgStr;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        let platformTimer = null;
        let isValidationActive = false;

        // 🚀 PLAY STORE SAFE ANTI-CHEATING LOGIC WITH IN-APP VIEWER
        function verifyCaptchaCodeSubmit() {
            if (isValidationActive) return;

            const userInput = document.getElementById("captchaInputText").value.trim().toUpperCase();
            const btn = document.getElementById("captchaSubmitBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";

            if (!userInput) return;

            // Step 1: Strict word matching
            if (userInput !== currentActiveCaptchaCode) {
                showCustomAlert("err_wrong");
                generateNewCaptchaCode();
                return;
            }

            // Step 2: Trigger secure In-App Viewer
            isValidationActive = true;
            let countdownTime = globalAdTimerSeconds;
            btn.disabled = true;

            let baseWaitTxt = langData[currentLang]["wait_txt"] || "Verifying... ";
            btn.innerText = baseWaitTxt;

            // Show In-App Viewer
            document.getElementById("inAppAdViewer").style.display = "flex";
            document.getElementById("adTimerDisplay").style.display = "flex";
            document.getElementById("adCloseBtn").style.display = "none";
            document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${countdownTime}s`;
            
            // Load Ad URL into iframe
            document.getElementById("adIframe").src = activeAdminSmartlinkUrl;

            if (platformTimer) clearInterval(platformTimer);

            platformTimer = setInterval(() => {
                countdownTime--;
                document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${countdownTime}s`;

                // 🛡️ ANTI-CHEAT FIX: Only triggers if the entire app is minimized
                if (document.hidden) { 
                    clearInterval(platformTimer);
                    document.getElementById("inAppAdViewer").style.display = "none";
                    document.getElementById("adIframe").src = "";
                    resetCaptchaSubmitButton();
                    showCustomAlert("err_invalid");
                    return;
                }

                if (countdownTime <= 0) {
                    clearInterval(platformTimer);
                    document.getElementById("adTimerDisplay").style.display = "none";
                    document.getElementById("adCloseBtn").style.display = "block"; // Show X Button
                }
            }, 1000);
        }

        // 💰 REWARD SYNC API & DAILY CHECKLIST INTEGRATION (PURE FIREBASE)
        function closeInAppAdAndClaim() {
            document.getElementById("inAppAdViewer").style.display = "none";
            document.getElementById("adIframe").src = ""; // Stop video/ad

            // Add Coins securely via Transaction
            db.ref(`users/${uid}/coins`).transaction((current) => {
                return (current || 0) + globalRewardCoins;
            }).then(() => {
                
                // Mark Daily Task 't9' as Complete
                db.ref(`users/${uid}/completed_daily_tasks`).once('value', (snap) => {
                    let tasks = snap.val() || [];
                    if (!tasks.includes("t9")) {
                        tasks.push("t9");
                        db.ref(`users/${uid}/completed_daily_tasks`).set(tasks);
                    }
                });

                resetCaptchaSubmitButton();
                generateNewCaptchaCode();
                
                // Success message with dynamic coins replacement
                let currentLang = localStorage.getItem("selectedLang") || "en";
                let successMsg = langData[currentLang]["err_success"] || langData["en"]["err_success"];
                successMsg = successMsg.replace(/5/g, globalRewardCoins);
                
                const alertBox = document.getElementById("customAlertBox");
                const overlay = document.getElementById("alertOverlay");
                document.getElementById("alertMessage").innerText = successMsg;
                alertBox.classList.add("success-border");
                alertBox.style.display = "block";
                overlay.style.display = "block";
                
            }).catch(() => {
                resetCaptchaSubmitButton();
                alert("Task Verified but couldn't sync with server. Try again.");
            });
        }

        function resetCaptchaSubmitButton() {
            const btn = document.getElementById("captchaSubmitBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            btn.disabled = false;
            btn.innerText = langData[currentLang]["cc_btn"] || "SUBMIT CAPTCHA";
            isValidationActive = false;
        }
    </script>
