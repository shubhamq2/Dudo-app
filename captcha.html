        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) {
                    if(elem.tagName === "BUTTON" && elem.id === "captchaSubmitBtn") {
                        if(!elem.disabled) elem.innerText = transObj[key];
                    } else {
                        elem.innerText = transObj[key];
                    }
                }
            });
            document.getElementById("appLanguage").value = langCode;
        }

        const uid = localStorage.getItem("userId");
        const token = localStorage.getItem("userToken");

        let currentActiveCaptchaCode = "";
        let activeAdminSmartlinkUrl = "https://www.profitablecpmrate.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js"; // Fallback default

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid || !token) { window.location.href = "index.html"; return; }
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            fetchDataFromAdminServer();
            generateNewCaptchaCode();
        });

        // 📡 FETCH DATA FROM NODE.JS ADMIN SERVER
        async function fetchDataFromAdminServer() {
            try {
                // 1. Fetch Profile Balance
                const userRes = await fetch(`${API_BASE_URL}/user/${uid}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const userData = await userRes.json();
                if (userData.success && userData.user) {
                    document.getElementById("liveUserCoins").innerText = userData.user.coins || 0;
                    document.getElementById("liveUserBalance").innerText = "₹" + (userData.user.balance || 0).toFixed(2);
                }

                // 2. Fetch Admin Banners & Captcha Smartlink
                const confRes = await fetch(`${API_BASE_URL}/app-config/banners`);
                const confData = await confRes.json();
                
                if (confData.success) {
                    if (confData.banners) {
                        if(confData.banners[0]) document.getElementById("adminBannerSlot1").innerHTML = confData.banners[0];
                        if(confData.banners[1]) document.getElementById("adminBannerSlot2").innerHTML = confData.banners[1];
                        if(confData.banners[2]) document.getElementById("adminBannerSlot3").innerHTML = confData.banners[2];
                        if(confData.banners[3]) document.getElementById("adminBannerSlot4").innerHTML = confData.banners[3];
                    }
                    if (confData.captchaLink) {
                        activeAdminSmartlinkUrl = confData.captchaLink;
                    } else if (confData.globalSmartlink) {
                        activeAdminSmartlinkUrl = confData.globalSmartlink;
                    }
                }
            } catch (err) {
                console.log("Using default cached configuration.");
            }
        }

        // Dynamic 6-Character Shield Token Generator
        function generateNewCaptchaCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // Removed O, 0, 1, I to avoid confusion
            let code = "";
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentActiveCaptchaCode = code;
            document.getElementById("captchaCodeString").innerText = currentActiveCaptchaCode;
            document.getElementById("captchaInputText").value = "";
        }

        function showCustomAlert(msgKey, isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msgStr = langData[currentLang] && langData[currentLang][msgKey] ? langData[currentLang][msgKey] : langData["en"][msgKey];

            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msgStr;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        let platformTimer = null;
        let countdownTime = 25;
        let targetWindow = null;
        let totalSecondsOpen = 0;
        let isValidationActive = false;

        // 🚀 PLAY STORE SAFE ANTI-CHEATING LOGIC (25 SECONDS)
        function verifyCaptchaCodeSubmit() {
            if (isValidationActive) return;

            const userInput = document.getElementById("captchaInputText").value.trim().toUpperCase();
            const btn = document.getElementById("captchaSubmitBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";

            if (!userInput) return;

            // Step 1: Strict word matching
            if (userInput !== currentActiveCaptchaCode) {
                showCustomAlert("err_wrong");
                generateNewCaptchaCode();
                return;
            }

            // Step 2: Trigger secure 25-seconds sponsor view phase
            isValidationActive = true;
            countdownTime = 25;
            totalSecondsOpen = 0;
            btn.disabled = true;

            let baseWaitTxt = langData[currentLang]["wait_txt"] || "Verifying... ";
            btn.innerText = baseWaitTxt + `(${countdownTime}s)`;

            targetWindow = window.open(activeAdminSmartlinkUrl, '_blank', 'noopener,noreferrer');

            if (platformTimer) clearInterval(platformTimer);

            platformTimer = setInterval(() => {
                countdownTime--;
                btn.innerText = baseWaitTxt + `(${countdownTime}s)`;

                // Safe Validation 1: User closed tab early
                if (targetWindow && targetWindow.closed) {
                    clearInterval(platformTimer);
                    resetCaptchaSubmitButton();
                    showCustomAlert("err_early");
                    return;
                }

                // Safe Validation 2: Invalid rapid tab switching detection
                if (!document.hidden) {
                    if (totalSecondsOpen < 24) {
                        clearInterval(platformTimer);
                        resetCaptchaSubmitButton();
                        showCustomAlert("err_invalid");
                        return;
                    }
                }

                totalSecondsOpen++;

                if (countdownTime <= 0) {
                    clearInterval(platformTimer);
                    btn.innerText = "SAVING...";
                    evaluateCaptchaReward();
                }
            }, 1000);
        }

        // 💰 REWARD SYNC API & DAILY CHECKLIST INTEGRATION
        async function evaluateCaptchaReward() {
            try {
                // Call API to add 5 Points and Sync Daily Task 't9' (Captcha Solver)
                const res = await fetch(`${API_BASE_URL}/user/update-balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ 
                        userId: uid, 
                        pointsToAdd: 5, 
                        action: "captcha_solve",
                        syncTask: "t9" // Tells backend to complete task 't9'
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    document.getElementById("liveUserCoins").innerText = data.newCoins;
                    document.getElementById("liveUserBalance").innerText = "₹" + data.newBalance.toFixed(2);
                    
                    resetCaptchaSubmitButton();
                    generateNewCaptchaCode();
                    showCustomAlert("err_success", true);
                } else {
                    throw new Error("API Failure");
                }
            } catch (err) {
                resetCaptchaSubmitButton();
                alert("Task Verified but couldn't sync with server. Try again.");
            }
        }

        function resetCaptchaSubmitButton() {
            const btn = document.getElementById("captchaSubmitBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            btn.disabled = false;
            btn.innerText = langData[currentLang]["cc_btn"] || "SUBMIT CAPTCHA";
            isValidationActive = false;
        }
