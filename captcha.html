        const langData = {

        };

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) elem.innerText = transObj[key];
            });
            document.getElementById("appLanguage").value = langCode;
        }

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkNc_eIIfqqxbTGqyZ1YWGE3W6lbNqUJQ",
            authDomain: "dudo-63594.firebaseapp.com",
            databaseURL: "https://dudo-63594-default-rtdb.firebaseio.com",
            projectId: "dudo-63594",
            storageBucket: "dudo-63594.firebasestorage.app",
            messagingSenderId: "732244407571",
            appId: "1:732244407571:web:d08486136dea6190de96e6",
            measurementId: "G-H6VVEXCD54"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const uid = localStorage.getItem("userId") || "GuestUser";

        let currentActiveCaptchaCode = "";
        let activeAdminSmartlinkUrl = "https://www.highperformanceformat.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js";

        // 🔥 CONNECT BANNERS AND TASKS SMARTLINK DIRECT TO FIREBASE ADMIN CONTROL NODES
        database.ref('global_system_runtime_configurations').on('value', (snap) => {
            if(snap.exists()) {
                let conf = snap.val();
                if(conf.watch_ads_configuration && conf.watch_ads_configuration.global_smartlink) {
                    activeAdminSmartlinkUrl = conf.watch_ads_configuration.global_smartlink;
                }
                if(conf.watch_ads_banner_slots) {
                    let b = conf.watch_ads_banner_slots;
                    if (b.slot1_html) { let s1 = document.getElementById("captchaAdSlot1"); if(s1) { s1.innerHTML = b.slot1_html; runScripts(s1); } }
                    if (b.slot2_html) { let s2 = document.getElementById("captchaAdSlot2"); if(s2) { s2.innerHTML = b.slot2_html; runScripts(s2); } }
                    if (b.slot3_html) { let s3 = document.getElementById("captchaAdSlot3"); if(s3) { s3.innerHTML = b.slot3_html; runScripts(s3); } }
                    if (b.slot4_html) { let s4 = document.getElementById("captchaAdSlot4"); if(s4) { s4.innerHTML = b.slot4_html; runScripts(s4); } }
                }
            }
        });

        function runScripts(container) {
            let scripts = container.getElementsByTagName("script");
            for (let i = 0; i < scripts.length; i++) {
                let sNode = document.createElement("script");
                if (scripts[i].src) sNode.src = scripts[i].src;
                else sNode.text = scripts[i].text;
                scripts[i].parentNode.replaceChild(sNode, scripts[i]);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            // Fetch current real-time user metrics
            database.ref('users/' + uid).on('value', (snap) => {
                if(snap.exists()) {
                    let d = snap.val();
                    document.getElementById("liveUserCoins").innerText = d.coins || 0;
                    document.getElementById("liveUserBalance").innerText = "₹" + (d.balance || 0).toFixed(2);
                }
            });

            generateNewCaptchaCode();
        });

        // Dynamic 6-Character Shield Token Generator
        function generateNewCaptchaCode() {
            const chars = "ABCDEFGHJKLMNOPQRSTUVWXYZ23456789"; 
            let code = "";
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentActiveCaptchaCode = code;
            document.getElementById("captchaCodeString").innerText = currentActiveCaptchaCode;
            document.getElementById("captchaInputText").value = "";
        }

        function showCustomAlert(msgKey, isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msg = langData[currentLang][msgKey] || langData["en"][msgKey];
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        let platformTimer = null;
        let countdownTime = 25;
        let targetWindow = null;
        let totalSecondsOpen = 0;

        // 🔥 ADDED TAB TRACKER 
        window.hasMainTabHidden = false;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                window.hasMainTabHidden = true;
            }
        });

        function verifyCaptchaCodeSubmit() {
            const userInput = document.getElementById("captchaInputText").value.trim().toUpperCase();
            const btn = document.getElementById("captchaSubmitBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";

            if (!userInput) return;

            // Step 1: Strict word matching execution check
            if (userInput !== currentActiveCaptchaCode) {
                showCustomAlert("err_wrong");
                generateNewCaptchaCode();
                return;
            }

            // Step 2: Trigger secure 25-seconds Adsterra smartlink rotation phase
            countdownTime = 25;
            totalSecondsOpen = 0;
            window.hasMainTabHidden = false; // Reset tracker
            btn.disabled = true;

            let baseWaitTxt = langData[currentLang]["wait_txt"] || langData["en"]["wait_txt"];
            btn.innerText = baseWaitTxt + `(${countdownTime}s)`;

            targetWindow = window.open(activeAdminSmartlinkUrl, '_blank', 'noopener,noreferrer');

            platformTimer = setInterval(() => {
                // Check 1: Early window close tracking guard
                if (targetWindow && targetWindow.closed) {
                    clearInterval(platformTimer);
                    resetCaptchaSubmitButton();
                    showCustomAlert("err_early");
                    return;
                }

                // Check 2: Dynamic visibility focus checker loop
                if (!document.hidden && window.hasMainTabHidden) {
                    if (totalSecondsOpen < 24) {
                        clearInterval(platformTimer);
                        resetCaptchaSubmitButton();
                        showCustomAlert("err_invalid");
                        return;
                    }
                }

                totalSecondsOpen++;
                countdownTime--;
                btn.innerText = baseWaitTxt + `(${countdownTime}s)`;

                if (countdownTime <= 0) {
                    clearInterval(platformTimer);
                    btn.innerText = "...";

                    // Sync verified 5 coins reward with main realtime branch nodes safely
                    database.ref('users/' + uid).once('value').then((snapshot) => {
                        if (snapshot.exists()) {
                            let oldCoins = snapshot.val().coins || 0;
                            let oldBalance = snapshot.val().balance || 0;
                            let monetizedValue = 0.05; // 5 Coins = ₹0.05 Matrix

                            database.ref('users/' + uid).update({
                                coins: oldCoins + 5,
                                balance: oldBalance + monetizedValue
                            }).then(() => {
                                resetCaptchaSubmitButton();
                                generateNewCaptchaCode();
                                showCustomAlert("err_success", true);

                                // 🔥 SYNC LOG DATA WITH BACKEND HOME CHECKLIST PROGRESS BAR (t9 node)
                                let currentDailyList = snapshot.val().completed_daily_tasks_array_node || [];
                                if(!currentDailyList.includes("t9")) {
                                    currentDailyList.push("t9");
                                    database.ref('users/' + uid).update({ completed_daily_tasks_array_node: currentDailyList });
                                }
                            });
                        }
                    });
                }
            }, 1000);
        }

        function resetCaptchaSubmitButton() {
            const btn = document.getElementById("captchaSubmitBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            btn.disabled = false;
            btn.innerText = langData[currentLang]["cc_btn"] || "SUBMIT CAPTCHA";
        }
