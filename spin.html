            { label: 20, angle: 247.5 },
            { label: 3, angle: 292.5 },
            { label: 5, angle: 337.5 }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.replace("index.html"); return; }
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            auth.onAuthStateChanged((user) => {
                if (user) {
                    // 1. Live Balance & Avatar Sync
                    db.ref('users/' + uid).on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.val();
                            document.getElementById("wallCoins").innerText = (data.coins || 0) + " 🪙";
                            
                            // Client reads spins from DB
                            let today = new Date().toLocaleDateString();
                            if(data.lastSpinDate !== today) {
                                spinsLeft = 2; // Default daily free spins
                                updateSpinsToFirebase(2, today);
                            } else {
                                spinsLeft = data.spinsLeftToday !== undefined ? data.spinsLeftToday : 0;
                            }
                            updateButtonsUI();
                            
                            // Smart Avatar Sync
                            let userName = data.name || "Player";
                            let finalAvatar = data.profile_pic ? data.profile_pic : `https://api.dicebear.com/7.x/adventurer/svg?seed=${userName || uid}&backgroundColor=b6e3f4`;
                            
                            let avatarContainer = document.getElementById("headerProfileIcon");
                            if (finalAvatar.startsWith("http") || finalAvatar.startsWith("data:")) {
                                avatarContainer.innerHTML = `<img src="${finalAvatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            } else {
                                avatarContainer.innerHTML = `<img src="${createEmojiURI(finalAvatar)}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            }
                        }
                    });

                    // 2. Fetch Admin Configurations (Banners, Time & Links from spin_win_configs node)
                    db.ref('global_system_runtime_configurations').on('value', (snap) => {
                        if(snap.exists()) {
                            const adminData = snap.val();
                            
                            if (adminData.spin_win_configs) {
                                const swConfig = adminData.spin_win_configs;
                                
                                // 🔥 GET ADMIN CONTROLLED TIME
                                if (swConfig.ad_timer) { globalAdTimerSeconds = parseInt(swConfig.ad_timer); }
                                
                                // Load Banners
                                if (swConfig.slot1_code) {
                                    document.getElementById("adminBannerSlot1").style.display = "flex";
                                    setAdHTML(document.getElementById("adminBannerSlot1"), swConfig.slot1_code);
                                } else {
                                    document.getElementById("adminBannerSlot1").style.display = "none";
                                }
                                
                                if (swConfig.slot2_code) {
                                    document.getElementById("adminBannerSlot2").style.display = "flex";
                                    setAdHTML(document.getElementById("adminBannerSlot2"), swConfig.slot2_code);
                                } else {
                                    document.getElementById("adminBannerSlot2").style.display = "none";
                                }

                                // Load Post Spin / Watch Ad Link
                                if (swConfig.task_ad_link) {
                                    activeAdminSmartlinkUrl = swConfig.task_ad_link;
                                } else if (adminData.globalSmartlink) {
                                    activeAdminSmartlinkUrl = adminData.globalSmartlink;
                                }

                            } else {
                                // Global Fallbacks
                                if (adminData.banner_ads && adminData.banner_ads.slot1 && adminData.banner_ads.slot1.active) {
                                    document.getElementById("adminBannerSlot1").style.display = "flex";
                                    setAdHTML(document.getElementById("adminBannerSlot1"), adminData.banner_ads.slot1.code);
                                }
                                if (adminData.globalSmartlink) {
                                    activeAdminSmartlinkUrl = adminData.globalSmartlink;
                                }
                            }
                        }
                    });

                } else {
                    window.location.replace("index.html");
                }
            });
        });

        // Script Injector for Admin Banners
        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        function updateSpinsToFirebase(spins, dateStr) {
            db.ref(`users/${uid}`).update({
                spinsLeftToday: spins,
                lastSpinDate: dateStr
            });
        }

        function updateButtonsUI() {
            document.getElementById("spinCountText").innerText = spinsLeft;
            if(spinsLeft > 0) {
                document.getElementById("spinBtn").style.display = "block";
                document.getElementById("adBtn").style.display = "none";
            } else {
                document.getElementById("spinBtn").style.display = "none";
                document.getElementById("adBtn").style.display = "block";
            }
        }

        function showCustomAlert(msgKey, appendText = "", isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msgStr = langData[currentLang][msgKey] || langData["en"][msgKey] || msgKey;

            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msgStr + appendText;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        // 🔥 ADDED TAB TRACKER 
        window.hasMainTabHidden = false;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) { window.hasMainTabHidden = true; }
        });

        // 🎰 SECURE SPIN LOGIC (Pure Firebase)
        function executeSecureSpinRequest() {
            if(isSpinning || spinsLeft <= 0) return;
            isSpinning = true;
            
            document.getElementById("spinBtn").disabled = true;

            // 1. Calculate random reward based on probabilities
            const probabilities = [
                { val: 0, chance: 30 }, // 30% chance
                { val: 1, chance: 20 },
                { val: 2, chance: 20 },
                { val: 3, chance: 15 },
                { val: 5, chance: 10 },
                { val: 10, chance: 4 },
                { val: 20, chance: 1 }  // 1% chance
            ];
            
            let rand = Math.random() * 100;
            let wonCoins = 0;
            let cumulative = 0;
            for(let p of probabilities) {
                cumulative += p.chance;
                if(rand < cumulative) { wonCoins = p.val; break; }
            }

            // 2. Perform Transaction
            db.ref(`users/${uid}/coins`).transaction((currentCoins) => {
                return (currentCoins || 0) + wonCoins;
            }).then((result) => {
                if(result.committed) {
                    
                    // Deduct Spin & Add Daily Task 't4'
                    spinsLeft--;
                    let today = new Date().toLocaleDateString();
                    updateSpinsToFirebase(spinsLeft, today);
                    
                    db.ref(`users/${uid}/completed_daily_tasks`).once('value', (snap) => {
                        let tasks = snap.val() || [];
                        if (!tasks.includes("t4")) {
                            tasks.push("t4");
                            db.ref(`users/${uid}/completed_daily_tasks`).set(tasks);
                        }
                    });

                    // 3. UI Wheel Animation Logic
                    let targetSliceIndex = prizesMap.findIndex(p => p.label === wonCoins);
                    if(targetSliceIndex === -1) targetSliceIndex = 0; // Fallback

                    let extraSpins = 5 * 360; 
                    let stopAngle = 360 - prizesMap[targetSliceIndex].angle; 
                    
                    currentRotation += extraSpins + stopAngle;
                    
                    let wheel = document.getElementById("spinWheel");
                    // 🔥 FIX 3: JavaScript में भी translateZ(0) जोड़ दिया ताकि स्पिन होते समय ग्राफिक्स ना फटे
                    wheel.style.transform = `rotate(${currentRotation}deg) translateZ(0)`;

                    setTimeout(() => {
                        isSpinning = false;
                        document.getElementById("spinBtn").disabled = false;
                        updateButtonsUI();
                        
                        if(wonCoins > 0) {
                            showCustomAlert("won_msg", `${wonCoins} Coins!`, true);
                        } else {
                            showCustomAlert("lost_msg");
                        }
                    }, 4100);

                } else {
                    throw new Error("Transaction failed");
                }
            }).catch((err) => {
                isSpinning = false;
                document.getElementById("spinBtn").disabled = false;
                alert("Server connection failed. Try again.");
            });
        }

        // 📺 SECURE AD VERIFICATION WITH IN-APP VIEWER
        let platformTimer = null;
        let countdownTime = 25;
        let targetWindow = null;
        let totalSecondsOpen = 0;

        function watchAdForSpin() {
            const btn = document.getElementById("adBtn");
            btn.disabled = true;

            countdownTime = globalAdTimerSeconds;
            totalSecondsOpen = 0;
            window.hasMainTabHidden = false; // Tracker reset
            
            btn.innerText = `Verifying... (${countdownTime}s)`;

            // Show In-App Viewer
            document.getElementById("inAppAdViewer").style.display = "flex";
            document.getElementById("adTimerDisplay").style.display = "flex";
            document.getElementById("adCloseBtn").style.display = "none";
            document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${countdownTime}s`;
            
            // Load Ad URL into iframe
            document.getElementById("adIframe").src = activeAdminSmartlinkUrl;

            platformTimer = setInterval(() => {
                countdownTime--;
                btn.innerText = `Verifying... (${countdownTime}s)`;
                document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${countdownTime}s`;

                // 🛡️ ANTI-CHEAT FIX: Only triggers if the entire app is minimized
                if(document.hidden) {
                    clearInterval(platformTimer);
                    document.getElementById("inAppAdViewer").style.display = "none";
                    document.getElementById("adIframe").src = "";
                    resetAdBtn();
                    showCustomAlert("err_invalid");
                    return;
                }

                if(countdownTime <= 0) {
                    clearInterval(platformTimer);
                    btn.innerText = "SAVING...";
                    document.getElementById("adTimerDisplay").style.display = "none";
                    document.getElementById("adCloseBtn").style.display = "block"; // Show X Button
                }
            }, 1000);
        }

        // 💰 REWARD SYNC API
        function closeInAppAdAndClaim() {
            document.getElementById("inAppAdViewer").style.display = "none";
            document.getElementById("adIframe").src = ""; // Stop video/ad

            // Add +1 Spin and Save to Server
            spinsLeft++;
            let today = new Date().toLocaleDateString();
            updateSpinsToFirebase(spinsLeft, today);
            
            updateButtonsUI();
            resetAdBtn();
            showCustomAlert("spin_added", "", true);
        }

        function resetAdBtn() {
            const btn = document.getElementById("adBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-play"></i> ${langData[currentLang]["btn_watch_ad"] || "WATCH AD FOR 1 SPIN"}`;
        }
    </script>
</body>
</html>
