        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #fbbf24; box-sizing: border-box; box-shadow: 0 0 30px rgba(251, 191, 36, 0.6), inset 0 0 25px rgba(0,0,0,0.8); overflow: hidden; position: relative; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); background: conic-gradient( #f59e0b 0deg 45deg, #1e293b 45deg 90deg, #f59e0b 90deg 135deg, #1e293b 135deg 180deg, #f59e0b 180deg 225deg, #1e293b 225deg 270deg, #f59e0b 270deg 315deg, #1e293b 315deg 360deg ); z-index: 5; }
        
        /* Wheel Center Dot */

    <script>

        };

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) { elem.innerText = transObj[key]; }
            });
            document.getElementById("appLanguage").value = langCode;

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkNc_eIIfqqxbTGqyZ1YWGE3W6lbNqUJQ",
            authDomain: "dudo-63594.firebaseapp.com",
            databaseURL: "https://dudo-63594-default-rtdb.firebaseio.com",
            projectId: "dudo-63594",
            storageBucket: "dudo-63594.firebasestorage.app",
            messagingSenderId: "732244407571",
            appId: "1:732244407571:web:d08486136dea6190de96e6",
            measurementId: "G-H6VVEXCD54"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const uid = localStorage.getItem("userId");

        let currentRotation = 0;
        let isSpinning = false;
        let userCoins = 0;
        let userBalance = 0;
        let spinsLeft = 0;
        let activeAdminSmartlinkUrl = "https://www.highperformanceformat.com/a1c908f939a51bb1a404ef5926c0fa52/invoke.js";
        
        const prizes = [0, 5, 1, 10, 2, 20, 3, 5]; 

        // 🔥 CONNECT BANNERS AND TASKS SMARTLINK DIRECT TO FIREBASE ADMIN CONTROL NODES
        database.ref('global_system_runtime_configurations').on('value', (snap) => {
            if(snap.exists()) {
                let conf = snap.val();
                if(conf.watch_ads_configuration && conf.watch_ads_configuration.global_smartlink) {
                    activeAdminSmartlinkUrl = conf.watch_ads_configuration.global_smartlink;
                }
                if(conf.watch_ads_banner_slots) {
                    let b = conf.watch_ads_banner_slots;
                    if (b.slot1_html) { let s1 = document.getElementById("spinAdSlot1"); if(s1) { s1.innerHTML = b.slot1_html; runScripts(s1); } }
                }
            }
        });

        function runScripts(container) {
            let scripts = container.getElementsByTagName("script");
            for (let i = 0; i < scripts.length; i++) {
                let sNode = document.createElement("script");
                if (scripts[i].src) sNode.src = scripts[i].src;
                else sNode.text = scripts[i].text;
                scripts[i].parentNode.replaceChild(sNode, scripts[i]);
            }
        }

        // 🔥 SYSTEM TAB TRACKER 
        window.hasMainTabHidden = false;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                window.hasMainTabHidden = true;
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.href = "index.html"; return; }
            changeLanguage(localStorage.getItem("selectedLang") || "en");

            database.ref('users/' + uid).on('value', (snap) => {
                if (snap.exists()) {
                    let data = snap.val();
                    userBalance = data.balance || 0;
                    userCoins = data.coins || 0;
                    document.getElementById("wallBal").innerText = "₹ " + userBalance.toFixed(2);
                    document.getElementById("wallCoins").innerText = userCoins + " 🪙";

                    let today = new Date().toLocaleDateString();
                    if(data.lastSpinDate !== today) {
                        spinsLeft = 2; // 2 FREE Spins Everyday
                        database.ref('users/' + uid).update({ spinsLeftToday: 2, lastSpinDate: today });
                    } else {
                        spinsLeft = data.spinsLeftToday !== undefined ? data.spinsLeftToday : 0;
                    }
                    updateButtons();
                }
            });
        });

        function updateButtons() {
            document.getElementById("spinCountText").innerText = spinsLeft;
            if(spinsLeft > 0) {
                document.getElementById("spinBtn").style.display = "block";
                document.getElementById("adBtn").style.display = "none";
            } else {
                document.getElementById("spinBtn").style.display = "none";
                document.getElementById("adBtn").style.display = "block";
            }
        }

        function showCustomAlert(msgKey, appendText = "", isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msg = langData[currentLang][msgKey] || langData["en"][msgKey];
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg + appendText;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        function startSpin() {
            if(isSpinning || spinsLeft <= 0) return;
            isSpinning = true;
            
            document.getElementById("spinBtn").disabled = true;

            spinsLeft--;
            database.ref('users/' + uid).update({ spinsLeftToday: spinsLeft });
            updateButtons();

            let randomSliceIndex = Math.floor(Math.random() * 8); 
            let extraSpins = 5 * 360; 
            let stopAngle = (randomSliceIndex * 45) + 22.5; 
            
            currentRotation += extraSpins + stopAngle;
            
            let wheel = document.getElementById("spinWheel");
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                document.getElementById("spinBtn").disabled = false;
                
                let actualPrizeIndex = (8 - randomSliceIndex - 1) % 8;
                if (actualPrizeIndex < 0) actualPrizeIndex += 8; 
                let wonCoins = prizes[actualPrizeIndex];
                
                if(wonCoins > 0) {
                    showCustomAlert("won_msg", `${wonCoins} Coins!`, true);
                    
                    let monetizedValue = wonCoins / 100;
                    
                    database.ref('users/' + uid).once('value').then((snapshot) => {
                        if(snapshot.exists()) {
                            let oldCoins = snapshot.val().coins || 0;
                            let oldBalance = snapshot.val().balance || 0;
                            database.ref('users/' + uid).update({ 
                                coins: oldCoins + wonCoins,
                                balance: oldBalance + monetizedValue
                            }).then(() => {
                                // 🔥 SYNC LOG DATA WITH BACKEND HOME CHECKLIST PROGRESS BAR (t11 node)
                                let currentDailyList = snapshot.val().completed_daily_tasks_array_node || [];
                                if(!currentDailyList.includes("t11")) {
                                    currentDailyList.push("t11");
                                    database.ref('users/' + uid).update({ completed_daily_tasks_array_node: currentDailyList });
                                }
                            });
                        }
                    });
                } else {
                    showCustomAlert("lost_msg");
                }
            }, 4100);
        }

        let platformTimer = null;
        let countdownTime = 25;
        let targetWindow = null;
        let totalSecondsOpen = 0;

        // 🔥 FIXED VERIFICATION ENGINE: Handles Popup Blocking and Safety Properly
        function watchAdForSpin() {
            const btn = document.getElementById("adBtn");
            btn.disabled = true;

            countdownTime = 25;
            totalSecondsOpen = 0;
            window.hasMainTabHidden = false; // Add tracker for active verification
            
            btn.innerText = `Verifying... (${countdownTime}s)`;

            targetWindow = window.open(activeAdminSmartlinkUrl, '_blank', 'noopener,noreferrer');

            platformTimer = setInterval(() => {
                // If user instantly closes the ad window without waiting
                if(targetWindow && targetWindow.closed) {
                    clearInterval(platformTimer);
                    resetAdBtn();
                    showCustomAlert("err_early");
                    return;
                }

                // If they came BACK to the main app BEFORE 24 seconds are up
                if(!document.hidden && window.hasMainTabHidden) {
                    if(totalSecondsOpen < 24) {
                        clearInterval(platformTimer);
                        resetAdBtn();
                        showCustomAlert("err_invalid");
                        return;
                    }
                }

                totalSecondsOpen++;
                countdownTime--;
                btn.innerText = `Verifying... (${countdownTime}s)`;

                // Success Event Completion Loop
                if(countdownTime <= 0) {
                    clearInterval(platformTimer);
                    btn.innerText = "CLAIMED SUCCESSFULLY";

                    spinsLeft++;
                    database.ref('users/' + uid).update({ spinsLeftToday: spinsLeft }).then(() => {
                        updateButtons();
                        resetAdBtn();
                        showCustomAlert("spin_added", "", true);
                    });
                }
            }, 1000);
        }

        function resetAdBtn() {
            const btn = document.getElementById("adBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            btn.disabled = false;
            btn.innerText = langData[currentLang]["btn_watch_ad"] || "📺 WATCH AD FOR 1 SPIN";
        }
    </script>
