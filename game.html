        };

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkNc_eIIfqqxbTGqyZ1YWGE3W6lbNqUJQ",
            authDomain: "dudo-63594.firebaseapp.com",
            databaseURL: "https://dudo-63594-default-rtdb.firebaseio.com",
            projectId: "dudo-63594",
            storageBucket: "dudo-63594.firebasestorage.app",
            messagingSenderId: "732244407571",
            appId: "1:732244407571:web:d08486136dea6190de96e6",
            measurementId: "G-H6VVEXCD54"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const uid = localStorage.getItem("userId") || "GuestUser";

        let activeAdminSmartlinkUrl = "https://www.highperformanceformat.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js";

        // 🔥 CONNECT BANNERS AND TASKS SMARTLINK DIRECT TO FIREBASE ADMIN CONTROL NODES
        database.ref('global_system_runtime_configurations').on('value', (snap) => {
            if(snap.exists()) {
                let conf = snap.val();
                if(conf.watch_ads_configuration && conf.watch_ads_configuration.global_smartlink) {
                    activeAdminSmartlinkUrl = conf.watch_ads_configuration.global_smartlink;
                }
                if(conf.watch_ads_banner_slots) {
                    let b = conf.watch_ads_banner_slots;
                    if (b.slot1_html) { let s1 = document.getElementById("gameAdSlot1"); if(s1) { s1.innerHTML = b.slot1_html; runScripts(s1); } }
                    if (b.slot2_html) { let s2 = document.getElementById("gameAdSlot2"); if(s2) { s2.innerHTML = b.slot2_html; runScripts(s2); } }
                    if (b.slot3_html) { let s3 = document.getElementById("gameAdSlot3"); if(s3) { s3.innerHTML = b.slot3_html; runScripts(s3); } }
                    if (b.slot4_html) { let s4 = document.getElementById("gameAdSlot4"); if(s4) { s4.innerHTML = b.slot4_html; runScripts(s4); } }
                }
            }
        });

        function runScripts(container) {
            let scripts = Array.from(container.getElementsByTagName("script"));
            for (let i = 0; i < scripts.length; i++) {
                let sNode = document.createElement("script");
                if (scripts[i].src) sNode.src = scripts[i].src;
                else sNode.text = scripts[i].text;
                scripts[i].parentNode.replaceChild(sNode, scripts[i]);
            }
        }

        // HTML5 Engine Parameters variables mapping
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let animationFrameLoopRef = null;
        let isGameCurrentlyRunning = false;
        let scoreCounter = 0;

        let playerSquareObj = { x: 50, y: 170, width: 25, height: 25, gravity: 0.65, velocity: 0, jumpStrength: -10, isGrounded: true, rotationAngle: 0 };
        let obstaclesArray = [];
        let particlesArray = []; 
        let gameSpeed = 4.0;
        let obstacleSpawnIntervalCounter = 0;

        // 🔥 ADDED SYSTEM TAB TRACKER 
        window.hasMainTabHidden = false;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                window.hasMainTabHidden = true;
            }
        });

        // Initialize Canvas layout properly before game starts
        function initialDraw() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#3b82f6";
            ctx.strokeStyle = "#3b82f6";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 195);
            ctx.lineTo(canvas.width, 195);
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.shadowBlur = 15;
            ctx.shadowColor = "#22d3ee";
            ctx.fillStyle = "#06b6d4";
            ctx.fillRect(playerSquareObj.x, playerSquareObj.y, playerSquareObj.width, playerSquareObj.height);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(playerSquareObj.x, playerSquareObj.y, playerSquareObj.width, playerSquareObj.height);
            ctx.shadowBlur = 0;
        }

        document.addEventListener("DOMContentLoaded", () => {
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            database.ref('users/' + uid).on('value', (snap) => {
                if(snap.exists()) {
                    let d = snap.val();
                    document.getElementById("liveUserCoins").innerText = d.coins || 0;
                    document.getElementById("liveUserBalance").innerText = "₹" + (d.balance || 0).toFixed(2);
                }
            });

            initialDraw();

            // 🔥 FIXED: Added event listeners DIRECTLY to the canvas so it doesn't block the "Play Game" button
            window.addEventListener("keydown", (e) => { if(e.code === "Space") executionTriggerPlayerJump(); });
            canvas.addEventListener("touchstart", (e) => { e.preventDefault(); executionTriggerPlayerJump(); }, {passive: false});
            canvas.addEventListener("mousedown", () => { executionTriggerPlayerJump(); });
        });

        function executionTriggerPlayerJump() {
            if(playerSquareObj.isGrounded && isGameCurrentlyRunning) {
                playerSquareObj.velocity = playerSquareObj.jumpStrength;
                playerSquareObj.isGrounded = false;
            }
        }

        function initiateArcadeGameplayLoop() {
            document.getElementById("gameMenuOverlay").style.display = "none";
            isGameCurrentlyRunning = true;
            scoreCounter = 0;
            gameSpeed = 4.0;
            obstaclesArray = [];
            particlesArray = [];
            
            playerSquareObj.y = 170;
            playerSquareObj.velocity = 0;
            playerSquareObj.isGrounded = true;
            playerSquareObj.rotationAngle = 0;

            document.getElementById("liveScoreCounter").innerText = scoreCounter;
            
            if(animationFrameLoopRef) cancelAnimationFrame(animationFrameLoopRef);
            executionRenderEngineCoreLoop();
        }

        // Native 60FPS Canvas Painting Loop Engine
        function executionRenderEngineCoreLoop() {
            if(!isGameCurrentlyRunning) return;

            ctx.clearRect(0,0, canvas.width, canvas.height);

            // Draw Neon Horizon Line
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#3b82f6";
            ctx.strokeStyle = "#3b82f6";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 195);
            ctx.lineTo(canvas.width, 195);
            ctx.stroke();
            ctx.shadowBlur = 0;

            playerSquareObj.velocity += playerSquareObj.gravity;
            playerSquareObj.y += playerSquareObj.velocity;

            if(playerSquareObj.y >= 170) {
                playerSquareObj.y = 170;
                playerSquareObj.velocity = 0;
                playerSquareObj.isGrounded = true;
                playerSquareObj.rotationAngle = Math.round(playerSquareObj.rotationAngle / (Math.PI / 2)) * (Math.PI / 2);
            } else {
                playerSquareObj.rotationAngle += 0.08;
            }

            // Trail Particle System
            if(!playerSquareObj.isGrounded || scoreCounter > 0) {
                particlesArray.push({
                    x: playerSquareObj.x + playerSquareObj.width / 2,
                    y: playerSquareObj.y + playerSquareObj.height,
                    size: Math.random() * 4 + 2,
                    opacity: 1
                });
            }

            for(let i = 0; i < particlesArray.length; i++) {
                let p = particlesArray[i];
                p.x -= gameSpeed;
                p.opacity -= 0.05;
                
                ctx.fillStyle = `rgba(34, 211, 238, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                
                if(p.opacity <= 0) {
                    particlesArray.splice(i, 1);
                    i--;
                }
            }

            // Paint Neon Player
            ctx.save();
            ctx.translate(playerSquareObj.x + playerSquareObj.width/2, playerSquareObj.y + playerSquareObj.height/2);
            ctx.rotate(playerSquareObj.rotationAngle);
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#22d3ee";
            ctx.fillStyle = "#06b6d4";
            ctx.fillRect(-playerSquareObj.width/2, -playerSquareObj.height/2, playerSquareObj.width, playerSquareObj.height);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.strokeRect(-playerSquareObj.width/2, -playerSquareObj.height/2, playerSquareObj.width, playerSquareObj.height);
            ctx.restore();

            obstacleSpawnIntervalCounter++;
            if(obstacleSpawnIntervalCounter > Math.max(60, 90 - (scoreCounter * 2))) { 
                obstacleSpawnIntervalCounter = 0;
                let obstacleHeight = Math.random() > 0.5 ? 25 : 35; 
                obstaclesArray.push({ x: canvas.width, y: 195 - obstacleHeight, width: 15, height: obstacleHeight, isPassedCheckedFlag: false });
            }

            for(let i = obstaclesArray.length - 1; i >= 0; i--) {
                let obs = obstaclesArray[i];
                obs.x -= gameSpeed;

                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ef4444";
                ctx.fillStyle = "#f43f5e";
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width / 2, obs.y);
                ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;

                if(obs.x + obs.width < playerSquareObj.x && !obs.isPassedCheckedFlag) {
                    obs.isPassedCheckedFlag = true;
                    scoreCounter++;
                    document.getElementById("liveScoreCounter").innerText = scoreCounter;
                    
                    if(scoreCounter % 5 === 0) gameSpeed += 0.5;
                }

                if (playerSquareObj.x < obs.x + obs.width - 2 &&
                    playerSquareObj.x + playerSquareObj.width - 2 > obs.x &&
                    playerSquareObj.y < obs.y + obs.height &&
                    playerSquareObj.y + playerSquareObj.height > obs.y + 2) {
                    
                    executeGameOverStateCrash();
                    return;
                }

                if(obs.x < -40) obstaclesArray.splice(i, 1);
            }

            animationFrameLoopRef = requestAnimationFrame(executionRenderEngineCoreLoop);
        }

        function executeGameOverStateCrash() {
            isGameCurrentlyRunning = false;
            cancelAnimationFrame(animationFrameLoopRef);
            
            let currentLang = localStorage.getItem("selectedLang") || "en";
            
            document.getElementById("overlayPanelTitle").innerText = langData[currentLang]["game_over_txt"] || "GAME OVER";
            document.getElementById("overlayPanelTitle").style.color = "#ef4444";
            document.getElementById("overlayPanelTitle").style.textShadow = "0 0 10px rgba(239, 68, 68, 0.5)";
            
            document.getElementById("overlayPanelReport").innerText = (langData[currentLang]["score_prefix"] || "Final Score: ") + scoreCounter;
            
            let actionBtn = document.getElementById("overlayActionBtn");
            actionBtn.style.background = "#374151";
            actionBtn.disabled = true;
            
            document.getElementById("gameMenuOverlay").style.display = "flex";

            if (scoreCounter === 0) {
                resetGameMenuUIElements();
                return;
            }

            triggerSecureEarningVerificationRoute();
        }

        function showCustomAlert(msgKey, appendText = "", isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msg = langData[currentLang][msgKey] || langData["en"][msgKey];
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg + appendText;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        // 🚀 SYSTEM MULTI-TAB SHIELD SECURE FOR ARCADE
        let platformTimer = null;
        let countdownTime = 25;
        let targetWindow = null;
        let totalSecondsOpen = 0;

        function triggerSecureEarningVerificationRoute() {
            const btn = document.getElementById("overlayActionBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            
            countdownTime = 25;
            totalSecondsOpen = 0;
            window.hasMainTabHidden = false; // Reset tracker

            let baseWaitTxt = langData[currentLang]["wait_txt"] || langData["en"]["wait_txt"];
            btn.innerText = baseWaitTxt + `(${countdownTime}s)`;

            targetWindow = window.open(activeAdminSmartlinkUrl, '_blank', 'noopener,noreferrer');

            platformTimer = setInterval(() => {
                if(targetWindow && targetWindow.closed) {
                    clearInterval(platformTimer);
                    resetGameMenuUIElements();
                    showCustomAlert("err_early");
                    return;
                }

                if(!document.hidden && window.hasMainTabHidden) {
                    if(totalSecondsOpen < 24) {
                        clearInterval(platformTimer);
                        resetGameMenuUIElements();
                        showCustomAlert("err_invalid");
                        return;
                    }
                }

                totalSecondsOpen++;
                countdownTime--;
                btn.innerText = baseWaitTxt + `(${countdownTime}s)`;

                if(countdownTime <= 0) {
                    clearInterval(platformTimer);
                    btn.innerText = "...";

                    let rewardCoinsCalculatedValue = scoreCounter * 2;

                    database.ref('users/' + uid).once('value').then((snapshot) => {
                        if(snapshot.exists()) {
                            let oldCoins = snapshot.val().coins || 0;
                            let oldBalance = snapshot.val().balance || 0;
                            let monetaryConvertedValue = rewardCoinsCalculatedValue / 100; 

                            database.ref('users/' + uid).update({
                                coins: oldCoins + rewardCoinsCalculatedValue,
                                balance: oldBalance + monetaryConvertedValue
                            }).then(() => {
                                resetGameMenuUIElements();
                                showCustomAlert("err_success", `${rewardCoinsCalculatedValue} 🪙`, true);

                                // 🔥 SYNC LOG DATA WITH BACKEND HOME CHECKLIST PROGRESS BAR (t15 node)
                                let currentDailyList = snapshot.val().completed_daily_tasks_array_node || [];
                                if(!currentDailyList.includes("t15")) {
                                    currentDailyList.push("t15");
                                    database.ref('users/' + uid).update({ completed_daily_tasks_array_node: currentDailyList });
                                }
                            });
                        }
                    });
                }
            }, 1000);
        }

        function resetGameMenuUIElements() {
            const btn = document.getElementById("overlayActionBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            
            btn.disabled = false;
            btn.style.background = "linear-gradient(to right, #f43f5e, #e11d48)";
            btn.innerText = langData[currentLang]["gm_start_btn"] || "PLAY GAME";
            
            document.getElementById("overlayPanelTitle").innerText = langData[currentLang]["gm_start_title"] || "Neon Dash";
            document.getElementById("overlayPanelTitle").style.color = "#22d3ee";
            document.getElementById("overlayPanelTitle").style.textShadow = "0 0 10px rgba(34, 211, 238, 0.5)";
            
            document.getElementById("overlayPanelReport").innerText = langData[currentLang]["gm_start_desc"] || "Tap screen to jump. Evade the red laser spikes!";
        }
    </script>
</body>
</html>
