        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) {
                    if(elem.tagName === "BUTTON" && elem.id === "overlayActionBtn") {
                        if(!elem.disabled) elem.innerText = transObj[key];
                    } else {
                        elem.innerText = transObj[key];
                    }
                }
            });
            document.getElementById("appLanguage").value = langCode;
            
            if(!isGameCurrentlyRunning && scoreCounter > 0) {
                document.getElementById("overlayPanelTitle").innerText = transObj["game_over_txt"] || "GAME OVER";
                document.getElementById("overlayPanelReport").innerText = (transObj["score_prefix"] || "Final Score: ") + scoreCounter;
            }
        }

        // Script Injector for Admin Banners
        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        const uid = localStorage.getItem("userId");
        let activeAdminSmartlinkUrl = "https://www.profitablecpmrate.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js"; // Fallback URL

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.replace("index.html"); return; }
            
            // Sync Language from Home Page
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            auth.onAuthStateChanged((user) => {
                if (user) {
                    // 1. Live Balance & Avatar Sync
                    db.ref('users/' + uid).on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.val();
                            document.getElementById("liveUserCoins").innerText = data.coins || 0;
                            
                            // Smart Avatar Sync
                            function createEmojiURI(emoji) {
                                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50%" y="54%" font-size="55" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
                                return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
                            }

                            let userName = data.name || "Player";
                            let finalAvatar = data.profile_pic ? data.profile_pic : `https://api.dicebear.com/7.x/adventurer/svg?seed=${userName || uid}&backgroundColor=b6e3f4`;
                            let avatarContainer = document.getElementById("headerProfileIcon");
                            if (finalAvatar.startsWith("http") || finalAvatar.startsWith("data:")) {
                                avatarContainer.innerHTML = `<img src="${finalAvatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            } else {
                                avatarContainer.innerHTML = `<img src="${createEmojiURI(finalAvatar)}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            }
                        }
                    });

                    // 2. Fetch Admin Configurations (Banners, Link & Time)
                    db.ref('global_system_runtime_configurations/arcade_game_configs').on('value', (snap) => {
                        if(snap.exists()) {
                            const adminData = snap.val();
                            
                            // 🔥 GET ADMIN CONTROLLED TIME
                            if (adminData.ad_timer) { globalAdTimerSeconds = parseInt(adminData.ad_timer); }
                            
                            // Load Banners
                            if(adminData.slot1_code && adminData.active !== false) { document.getElementById("adminBannerSlot1").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot1"), adminData.slot1_code); } else { document.getElementById("adminBannerSlot1").style.display = "none"; }
                            if(adminData.slot2_code && adminData.active !== false) { document.getElementById("adminBannerSlot2").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot2"), adminData.slot2_code); } else { document.getElementById("adminBannerSlot2").style.display = "none"; }
                            if(adminData.slot3_code && adminData.active !== false) { document.getElementById("adminBannerSlot3").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot3"), adminData.slot3_code); } else { document.getElementById("adminBannerSlot3").style.display = "none"; }
                            if(adminData.slot4_code && adminData.active !== false) { document.getElementById("adminBannerSlot4").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot4"), adminData.slot4_code); } else { document.getElementById("adminBannerSlot4").style.display = "none"; }

                            // Setup Game Link
                            if (adminData.game_ad_link) {
                                activeAdminSmartlinkUrl = adminData.game_ad_link;
                            }
                        } else {
                            // Fallback to Global Smartlink
                            db.ref('global_system_runtime_configurations/globalSmartlink').once('value').then(globalSnap => {
                                if(globalSnap.exists()) activeAdminSmartlinkUrl = globalSnap.val();
                            });
                        }
                    });

                } else {
                    window.location.replace("index.html");
                }
            });
            
            initialDraw();

            // Event listeners directly to Canvas
            window.addEventListener("keydown", (e) => { if(e.code === "Space") executionTriggerPlayerJump(); });
            canvas.addEventListener("touchstart", (e) => { e.preventDefault(); executionTriggerPlayerJump(); }, {passive: false});
            canvas.addEventListener("mousedown", () => { executionTriggerPlayerJump(); });
        });

        // HTML5 Engine Parameters variables
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let animationFrameLoopRef = null;
        let isGameCurrentlyRunning = false;
        let scoreCounter = 0;

        // 🔥 CHARACTER: ROCKET
        let playerSquareObj = { x: 50, y: 175, width: 30, height: 30, gravity: 0.95, velocity: 0, jumpStrength: -12, isGrounded: true, emoji: "🚀" };
        let obstaclesArray = [];
        let gameSpeed = 6.5; 
        let obstacleSpawnIntervalCounter = 0;

        function initialDraw() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            // Draw Ground Line
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#3b82f6";
            ctx.strokeStyle = "#3b82f6";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 205);
            ctx.lineTo(canvas.width, 205);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw Initial Rocket
            ctx.font = "30px Arial";
            ctx.fillText(playerSquareObj.emoji, playerSquareObj.x, playerSquareObj.y + playerSquareObj.height - 2);
        }

        function executionTriggerPlayerJump() {
            if(playerSquareObj.isGrounded && isGameCurrentlyRunning) {
                playerSquareObj.velocity = playerSquareObj.jumpStrength;
                playerSquareObj.isGrounded = false;
            }
        }

        function initiateArcadeGameplayLoop() {
            document.getElementById("gameMenuOverlay").style.display = "none";
            isGameCurrentlyRunning = true;
            scoreCounter = 0;
            gameSpeed = 6.5; // Reset to hard base speed
            obstaclesArray = [];
            
            playerSquareObj.y = 175;
            playerSquareObj.velocity = 0;
            playerSquareObj.isGrounded = true;

            document.getElementById("liveScoreCounter").innerText = scoreCounter;
            
            if(animationFrameLoopRef) cancelAnimationFrame(animationFrameLoopRef);
            executionRenderEngineCoreLoop();
        }

        // Native 60FPS Canvas Painting Loop Engine
        function executionRenderEngineCoreLoop() {
            if(!isGameCurrentlyRunning) return;

            ctx.clearRect(0,0, canvas.width, canvas.height);

            // Draw Horizon Line
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#3b82f6";
            ctx.strokeStyle = "#3b82f6";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 205);
            ctx.lineTo(canvas.width, 205);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Player Physics
            playerSquareObj.velocity += playerSquareObj.gravity;
            playerSquareObj.y += playerSquareObj.velocity;

            if(playerSquareObj.y >= 175) {
                playerSquareObj.y = 175;
                playerSquareObj.velocity = 0;
                playerSquareObj.isGrounded = true;
            }

            // Draw Player Emoji (Rocket)
            ctx.font = "30px Arial";
            ctx.fillText(playerSquareObj.emoji, playerSquareObj.x, playerSquareObj.y + playerSquareObj.height - 2);

            obstacleSpawnIntervalCounter++;
            
            // 🔥 HARD MODE: Tighter gaps as score increases
            if(obstacleSpawnIntervalCounter > Math.max(25, 50 - (scoreCounter * 2))) { 
                obstacleSpawnIntervalCounter = 0;
                
                // 50% chance for Air (Meteor) or Ground (Volcano)
                let isAirObstacle = Math.random() > 0.5;
                let obsSize = isAirObstacle ? 35 : 40; 
                let obsY = isAirObstacle ? (40 + Math.random() * 60) : (205 - obsSize);
                let obsEmoji = isAirObstacle ? "☄️" : "🌋";

                obstaclesArray.push({ 
                    x: canvas.width, 
                    y: obsY, 
                    width: 30, 
                    height: obsSize, 
                    isPassedCheckedFlag: false, 
                    emoji: obsEmoji 
                });
            }

            for(let i = obstaclesArray.length - 1; i >= 0; i--) {
                let obs = obstaclesArray[i];
                obs.x -= gameSpeed;

                // Draw Danger Emoji
                ctx.font = `${obs.height}px Arial`;
                ctx.fillText(obs.emoji, obs.x, obs.y + obs.height - 5);

                // Scoring Tweak
                if(obs.x + obs.width < playerSquareObj.x && !obs.isPassedCheckedFlag) {
                    obs.isPassedCheckedFlag = true;
                    scoreCounter++;
                    document.getElementById("liveScoreCounter").innerText = scoreCounter;
                    
                    // 🔥 HARD MODE: Speed increases every 3 points
                    if(scoreCounter % 3 === 0) gameSpeed += 0.6;
                }

                // 🔥 Strict Collision Box Tweak (Hitbox tighter for emojis)
                if (playerSquareObj.x < obs.x + obs.width - 10 &&
                    playerSquareObj.x + playerSquareObj.width - 10 > obs.x &&
                    playerSquareObj.y < obs.y + obs.height - 8 &&
                    playerSquareObj.y + playerSquareObj.height - 8 > obs.y) {
                    
                    executeGameOverStateCrash();
                    return;
                }

                if(obs.x < -40) obstaclesArray.splice(i, 1);
            }

            animationFrameLoopRef = requestAnimationFrame(executionRenderEngineCoreLoop);
        }

        function executeGameOverStateCrash() {
            isGameCurrentlyRunning = false;
            cancelAnimationFrame(animationFrameLoopRef);
            
            let currentLang = localStorage.getItem("selectedLang") || "en";
            
            document.getElementById("overlayPanelTitle").innerText = langData[currentLang]["game_over_txt"] || "GAME OVER";
            document.getElementById("overlayPanelTitle").style.color = "#ef4444";
            document.getElementById("overlayPanelTitle").style.textShadow = "0 0 15px rgba(239, 68, 68, 0.6)";
            
            document.getElementById("overlayPanelReport").innerText = (langData[currentLang]["score_prefix"] || "Final Score: ") + scoreCounter;
            
            let actionBtn = document.getElementById("overlayActionBtn");
            actionBtn.style.background = "#374151";
            actionBtn.disabled = true;
            
            document.getElementById("gameMenuOverlay").style.display = "flex";

            if (scoreCounter === 0) {
                resetGameMenuUIElements();
                return;
            }

            triggerSecureEarningVerificationRoute();
        }

        function showCustomAlert(msgKey, appendText = "", isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msg = langData[currentLang][msgKey] || langData["en"][msgKey];
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg + appendText;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        // 🚀 SYSTEM SECURE IN-APP AD VIEWER FOR ARCADE
        let platformTimer = null;

        function triggerSecureEarningVerificationRoute() {
            const btn = document.getElementById("overlayActionBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            
            let countdownTime = globalAdTimerSeconds;

            let baseWaitTxt = langData[currentLang]["wait_txt"] || "Verifying Score... ";
            btn.innerText = baseWaitTxt;
            btn.disabled = true;

            // Show In-App Viewer
            document.getElementById("inAppAdViewer").style.display = "flex";
            document.getElementById("adTimerDisplay").style.display = "flex";
            document.getElementById("adCloseBtn").style.display = "none";
            document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${countdownTime}s`;
            
            // Load Ad URL into iframe
            document.getElementById("adIframe").src = activeAdminSmartlinkUrl;

            if (platformTimer) clearInterval(platformTimer);

            platformTimer = setInterval(() => {
                countdownTime--;
                document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${countdownTime}s`;

                // 🛡️ ANTI-CHEAT FIX: Only triggers if the entire app is minimized
                if(document.hidden) {
                    clearInterval(platformTimer);
                    document.getElementById("inAppAdViewer").style.display = "none";
                    document.getElementById("adIframe").src = "";
                    resetGameMenuUIElements();
                    showCustomAlert("err_invalid");
                    return;
                }

                if(countdownTime <= 0) {
                    clearInterval(platformTimer);
                    document.getElementById("adTimerDisplay").style.display = "none";
                    document.getElementById("adCloseBtn").style.display = "block"; // Show X Button
                }
            }, 1000);
        }

        // 💰 REWARD SYNC API & DAILY CHECKLIST INTEGRATION
        function closeInAppAdAndClaim() {
            document.getElementById("inAppAdViewer").style.display = "none";
            document.getElementById("adIframe").src = ""; // Stop video/ad

            // Strict Reward: 1 Score = 1 Coin 
            let rewardCoinsCalculatedValue = scoreCounter * 1; 
            evaluateGameRewardViaFirebase(rewardCoinsCalculatedValue);
        }

        function evaluateGameRewardViaFirebase(rewardAmount) {
            
            // 1. Add Coins securely via Transaction
            db.ref(`users/${uid}/coins`).transaction((current) => {
                return (current || 0) + rewardAmount;
            }).then(() => {
                
                // 2. Mark Daily Task 't15' as Complete
                db.ref(`users/${uid}/completed_daily_tasks`).once('value', (snap) => {
                    let tasks = snap.val() || [];
                    if (!tasks.includes("t15")) {
                        tasks.push("t15");
                        db.ref(`users/${uid}/completed_daily_tasks`).set(tasks);
                    }
                });

                resetGameMenuUIElements();
                showCustomAlert("err_success", `${rewardAmount} 🪙`, true);
                
            }).catch(() => {
                resetGameMenuUIElements();
                alert("Task Verified but couldn't sync with server. Try again.");
            });
        }

        function resetGameMenuUIElements() {
            const btn = document.getElementById("overlayActionBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            
            btn.disabled = false;
            btn.style.background = "linear-gradient(135deg, var(--accent-pink), #be123c)";
            btn.innerText = langData[currentLang]["gm_start_btn"] || "PLAY GAME";
            
            document.getElementById("overlayPanelTitle").innerText = langData[currentLang]["gm_start_title"] || "Space Dash";
            document.getElementById("overlayPanelTitle").style.color = "var(--accent-cyan)";
            document.getElementById("overlayPanelTitle").style.textShadow = "0 0 15px rgba(34, 211, 238, 0.6)";
            
            document.getElementById("overlayPanelReport").innerText = langData[currentLang]["gm_start_desc"] || "Tap to jump over Volcanoes 🌋 & Dodge flying Meteors ☄️!";
        }
    </script>
