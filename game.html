            "pt": { "gm_title": "Zona Arcade", "gm_score": "Pontuação", "gm_start_title": "Space Dash", "gm_start_desc": "Pule vulcões 🌋 e desvie de meteoros ☄️!", "gm_start_btn": "JOGAR", "gm_security": "Aproveite o jogo e colete seus pontos com segurança.", "err_early": "❌ Interrompido! Mantenha-se ativo.", "err_invalid": "❌ Fique na página do jogo.", "err_success": "🎉 Recompensas adicionadas: ", "game_over_txt": "FIM DE JOGO", "score_prefix": "Pontuação Final: ", "wait_txt": "Verificando... " },
            "ru": { "gm_title": "Аркадная Зона", "gm_score": "Счет", "gm_start_title": "Космический Рывок", "gm_start_desc": "Перепрыгивайте вулканы 🌋 и уворачивайтесь от метеоритов ☄️!", "gm_start_btn": "ИГРАТЬ", "gm_security": "Наслаждайтесь игрой и безопасно собирайте очки.", "err_early": "❌ Прервано! Оставайтесь активными.", "err_invalid": "❌ Оставайтесь на странице игры.", "err_success": "🎉 Награды добавлены: ", "game_over_txt": "ИГРА ОКОНЧЕНА", "score_prefix": "Итоговый счет: ", "wait_txt": "Проверка... " }
        };

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) elem.innerText = transObj[key];
            });
            document.getElementById("appLanguage").value = langCode;
        }

        const uid = localStorage.getItem("userId");
        const token = localStorage.getItem("userToken");
        
        let activeAdminSmartlinkUrl = "https://www.profitablecpmrate.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js";

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid || !token) { window.location.href = "index.html"; return; }
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            fetchDataFromAdminServer();
            initialDraw();

            // Event listeners directly to Canvas
            window.addEventListener("keydown", (e) => { if(e.code === "Space") executionTriggerPlayerJump(); });
            canvas.addEventListener("touchstart", (e) => { e.preventDefault(); executionTriggerPlayerJump(); }, {passive: false});
            canvas.addEventListener("mousedown", () => { executionTriggerPlayerJump(); });
        });

        // 📡 FETCH DATA FROM NODE.JS ADMIN SERVER
        async function fetchDataFromAdminServer() {
            try {
                // 1. Fetch Profile Balance
                const userRes = await fetch(`${API_BASE_URL}/user/${uid}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const userData = await userRes.json();
                if (userData.success && userData.user) {
                    document.getElementById("liveUserCoins").innerText = userData.user.coins || 0;
                    document.getElementById("liveUserBalance").innerText = "₹" + (userData.user.balance || 0).toFixed(2);
                }

                // 2. Fetch Admin Banners and Smartlink
                const confRes = await fetch(`${API_BASE_URL}/app-config/banners`);
                const confData = await confRes.json();
                
                if (confData.success) {
                    if (confData.banners) {
                        if(confData.banners[0]) document.getElementById("adminBannerSlot1").innerHTML = confData.banners[0];
                        if(confData.banners[1]) document.getElementById("adminBannerSlot2").innerHTML = confData.banners[1];
                        if(confData.banners[2]) document.getElementById("adminBannerSlot3").innerHTML = confData.banners[2];
                        if(confData.banners[3]) document.getElementById("adminBannerSlot4").innerHTML = confData.banners[3];
                    }
                    if (confData.globalSmartlink) {
                        activeAdminSmartlinkUrl = confData.globalSmartlink;
                    }
                }
            } catch (err) {
                console.log("Using default cached configuration.");
            }
        }

        // HTML5 Engine Parameters variables
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let animationFrameLoopRef = null;
        let isGameCurrentlyRunning = false;
        let scoreCounter = 0;

        // 🔥 CHARACTER: ROCKET
        let playerSquareObj = { x: 50, y: 175, width: 30, height: 30, gravity: 0.8, velocity: 0, jumpStrength: -12, isGrounded: true, emoji: "🚀" };
        let obstaclesArray = [];
        let gameSpeed = 5.5; // Faster Initial Speed
        let obstacleSpawnIntervalCounter = 0;

        // 🔥 ADDED SYSTEM TAB TRACKER 
        window.hasMainTabHidden = false;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) { window.hasMainTabHidden = true; }
        });

        function initialDraw() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            
            // Draw Ground Line
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#3b82f6";
            ctx.strokeStyle = "#3b82f6";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 205);
            ctx.lineTo(canvas.width, 205);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Draw Initial Rocket
            ctx.font = "30px Arial";
            ctx.fillText(playerSquareObj.emoji, playerSquareObj.x, playerSquareObj.y + playerSquareObj.height - 2);
        }

        function executionTriggerPlayerJump() {
            if(playerSquareObj.isGrounded && isGameCurrentlyRunning) {
                playerSquareObj.velocity = playerSquareObj.jumpStrength;
                playerSquareObj.isGrounded = false;
            }
        }

        function initiateArcadeGameplayLoop() {
            document.getElementById("gameMenuOverlay").style.display = "none";
            isGameCurrentlyRunning = true;
            scoreCounter = 0;
            gameSpeed = 5.5;
            obstaclesArray = [];
            
            playerSquareObj.y = 175;
            playerSquareObj.velocity = 0;
            playerSquareObj.isGrounded = true;

            document.getElementById("liveScoreCounter").innerText = scoreCounter;
            
            if(animationFrameLoopRef) cancelAnimationFrame(animationFrameLoopRef);
            executionRenderEngineCoreLoop();
        }

        // Native 60FPS Canvas Painting Loop Engine
        function executionRenderEngineCoreLoop() {
            if(!isGameCurrentlyRunning) return;

            ctx.clearRect(0,0, canvas.width, canvas.height);

            // Draw Horizon Line
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#3b82f6";
            ctx.strokeStyle = "#3b82f6";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 205);
            ctx.lineTo(canvas.width, 205);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Player Physics
            playerSquareObj.velocity += playerSquareObj.gravity;
            playerSquareObj.y += playerSquareObj.velocity;

            if(playerSquareObj.y >= 175) {
                playerSquareObj.y = 175;
                playerSquareObj.velocity = 0;
                playerSquareObj.isGrounded = true;
            }

            // Draw Player Emoji (Rocket)
            ctx.font = "30px Arial";
            ctx.fillText(playerSquareObj.emoji, playerSquareObj.x, playerSquareObj.y + playerSquareObj.height - 2);

            obstacleSpawnIntervalCounter++;
            
            // 🔥 HARD MODE: Tighter gaps as score increases
            if(obstacleSpawnIntervalCounter > Math.max(35, 60 - (scoreCounter * 2))) { 
                obstacleSpawnIntervalCounter = 0;
                
                // 50% chance for Air (Meteor) or Ground (Volcano)
                let isAirObstacle = Math.random() > 0.5;
                let obsSize = isAirObstacle ? 35 : 40; 
                let obsY = isAirObstacle ? (40 + Math.random() * 60) : (205 - obsSize); // Top logic vs Ground logic
                let obsEmoji = isAirObstacle ? "☄️" : "🌋";

                obstaclesArray.push({ 
                    x: canvas.width, 
                    y: obsY, 
                    width: 30, 
                    height: obsSize, 
                    isPassedCheckedFlag: false, 
                    emoji: obsEmoji 
                });
            }

            for(let i = obstaclesArray.length - 1; i >= 0; i--) {
                let obs = obstaclesArray[i];
                obs.x -= gameSpeed;

                // Draw Danger Emoji
                ctx.font = `${obs.height}px Arial`;
                ctx.fillText(obs.emoji, obs.x, obs.y + obs.height - 5);

                // Scoring Tweak
                if(obs.x + obs.width < playerSquareObj.x && !obs.isPassedCheckedFlag) {
                    obs.isPassedCheckedFlag = true;
                    scoreCounter++;
                    document.getElementById("liveScoreCounter").innerText = scoreCounter;
                    
                    // 🔥 HARD MODE: Speed increases every 4 points
                    if(scoreCounter % 4 === 0) gameSpeed += 0.5;
                }

                // 🔥 Strict Collision Box Tweak (Hitbox adjusted for emojis)
                if (playerSquareObj.x < obs.x + obs.width - 8 &&
                    playerSquareObj.x + playerSquareObj.width - 8 > obs.x &&
                    playerSquareObj.y < obs.y + obs.height - 5 &&
                    playerSquareObj.y + playerSquareObj.height - 5 > obs.y) {
                    
                    executeGameOverStateCrash();
                    return;
                }

                if(obs.x < -40) obstaclesArray.splice(i, 1);
            }

            animationFrameLoopRef = requestAnimationFrame(executionRenderEngineCoreLoop);
        }

        function executeGameOverStateCrash() {
            isGameCurrentlyRunning = false;
            cancelAnimationFrame(animationFrameLoopRef);
            
            let currentLang = localStorage.getItem("selectedLang") || "en";
            
            document.getElementById("overlayPanelTitle").innerText = langData[currentLang]["game_over_txt"] || "GAME OVER";
            document.getElementById("overlayPanelTitle").style.color = "#ef4444";
            document.getElementById("overlayPanelTitle").style.textShadow = "0 0 15px rgba(239, 68, 68, 0.6)";
            
            document.getElementById("overlayPanelReport").innerText = (langData[currentLang]["score_prefix"] || "Final Score: ") + scoreCounter;
            
            let actionBtn = document.getElementById("overlayActionBtn");
            actionBtn.style.background = "#374151";
            actionBtn.disabled = true;
            
            document.getElementById("gameMenuOverlay").style.display = "flex";

            if (scoreCounter === 0) {
                resetGameMenuUIElements();
                return;
            }

            triggerSecureEarningVerificationRoute();
        }

        function showCustomAlert(msgKey, appendText = "", isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msg = langData[currentLang][msgKey] || langData["en"][msgKey];
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg + appendText;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        // 🚀 SYSTEM MULTI-TAB SHIELD SECURE FOR ARCADE
        let platformTimer = null;
        let countdownTime = 25;
        let targetWindow = null;
        let totalSecondsOpen = 0;

        function triggerSecureEarningVerificationRoute() {
            const btn = document.getElementById("overlayActionBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            
            countdownTime = 25;
            totalSecondsOpen = 0;
            window.hasMainTabHidden = false; // Reset tracker

            let baseWaitTxt = langData[currentLang]["wait_txt"] || "Verifying Score... ";
            btn.innerText = baseWaitTxt + `(${countdownTime}s)`;

            targetWindow = window.open(activeAdminSmartlinkUrl, '_blank', 'noopener,noreferrer');

            platformTimer = setInterval(() => {
                if(targetWindow && targetWindow.closed) {
                    clearInterval(platformTimer);
                    resetGameMenuUIElements();
                    showCustomAlert("err_early");
                    return;
                }

                if(!document.hidden && window.hasMainTabHidden) {
                    if(totalSecondsOpen < 24) {
                        clearInterval(platformTimer);
                        resetGameMenuUIElements();
                        showCustomAlert("err_invalid");
                        return;
                    }
                }

                totalSecondsOpen++;
                countdownTime--;
                btn.innerText = baseWaitTxt + `(${countdownTime}s)`;

                if(countdownTime <= 0) {
                    clearInterval(platformTimer);
                    btn.innerText = "SAVING...";

                    // Strict Reward: 1 Score = 1 Coin 
                    let rewardCoinsCalculatedValue = scoreCounter * 1; 
                    evaluateGameRewardViaNodeServer(rewardCoinsCalculatedValue);
                }
            }, 1000);
        }

        // 💰 REWARD SYNC API & DAILY CHECKLIST INTEGRATION
        async function evaluateGameRewardViaNodeServer(rewardAmount) {
            try {
                // Call API to add points and Sync Daily Task 't15'
                const res = await fetch(`${API_BASE_URL}/user/update-balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ 
                        userId: uid, 
                        pointsToAdd: rewardAmount, 
                        action: "arcade_game_win",
                        syncTask: "t15" // Tells backend to complete task 't15'
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    document.getElementById("liveUserCoins").innerText = data.newCoins;
                    document.getElementById("liveUserBalance").innerText = "₹" + data.newBalance.toFixed(2);
                    
                    resetGameMenuUIElements();
                    showCustomAlert("err_success", `${rewardAmount} 🪙`, true);
                }
            } catch (err) {
                resetGameMenuUIElements();
                alert("Task Verified but couldn't sync with server. Try again.");
            }
        }

        function resetGameMenuUIElements() {
            const btn = document.getElementById("overlayActionBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            
            btn.disabled = false;
            btn.style.background = "linear-gradient(135deg, var(--accent-pink), #be123c)";
            btn.innerText = langData[currentLang]["gm_start_btn"] || "PLAY GAME";
            
            document.getElementById("overlayPanelTitle").innerText = langData[currentLang]["gm_start_title"] || "Space Dash";
            document.getElementById("overlayPanelTitle").style.color = "var(--accent-cyan)";
            document.getElementById("overlayPanelTitle").style.textShadow = "0 0 15px rgba(34, 211, 238, 0.6)";
            
            document.getElementById("overlayPanelReport").innerText = langData[currentLang]["gm_start_desc"] || "Tap to jump over Volcanoes 🌋 & Dodge flying Meteors ☄️!";
        }
    </script>
</body>
