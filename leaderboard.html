        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) {
                    if (elem.tagName === "BUTTON") {
                        if(!elem.disabled) elem.innerHTML = `<i class="fa-solid fa-gift"></i> ${transObj[key]}`;
                    } else if (elem.tagName === "H4") {
                        elem.innerHTML = `<i class="fa-solid fa-shield-halved"></i> ${transObj[key]}`;
                    } else {
                        elem.innerText = transObj[key];
                    }
                }
            });
            document.getElementById("appLanguage").value = langCode;
            executeValidateHourlyTimerStatus(); 
        }

        const uid = localStorage.getItem("userId");
        const token = localStorage.getItem("userToken");

        let activeAdminSmartlinkUrl = "https://www.profitablecpmrate.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js";
        let hourlyRewardCoinsPool = 25; 

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid || !token) { window.location.href = "index.html"; return; }
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            fetchDataFromAdminServer();
            executeLiveLeaderboardSync();
            executeValidateHourlyTimerStatus();
        });

        // 📡 FETCH USER, BANNERS AND CONFIGS FROM NODE.JS API
        async function fetchDataFromAdminServer() {
            try {
                // Fetch User Balance
                const userRes = await fetch(`${API_BASE_URL}/user/${uid}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const userData = await userRes.json();
                if (userData.success && userData.user) {
                    document.getElementById("liveUserCoins").innerText = userData.user.coins || 0;
                }

                // Fetch Admin Banners and Smartlink
                const confRes = await fetch(`${API_BASE_URL}/app-config/banners`);
                const confData = await confRes.json();
                
                if (confData.success) {
                    if (confData.banners) {
                        if(confData.banners[0]) document.getElementById("adminBannerSlot1").innerHTML = confData.banners[0];
                        if(confData.banners[1]) document.getElementById("adminBannerSlot2").innerHTML = confData.banners[1];
                        if(confData.banners[2]) document.getElementById("adminBannerSlot3").innerHTML = confData.banners[2];
                    }
                    if (confData.globalSmartlink) {
                        activeAdminSmartlinkUrl = confData.globalSmartlink;
                    }
                    if (confData.hourlyRewardAmount) {
                        hourlyRewardCoinsPool = parseInt(confData.hourlyRewardAmount) || 25;
                    }
                }
            } catch (err) {
                console.log("Using cached configuration.");
            }
        }

        // 🏆 FETCH LEADERBOARD FROM NODE.JS API
        async function executeLiveLeaderboardSync() {
            const listContainer = document.getElementById("leaderboardListSlot");
            try {
                const res = await fetch(`${API_BASE_URL}/leaderboard`);
                const data = await res.json();

                if(data.success && data.leaderboard && data.leaderboard.length > 0) {
                    listContainer.innerHTML = "";
                    data.leaderboard.forEach((user, index) => {
                        let currentRank = index + 1;
                        let cardClass = "rank-card";
                        if(currentRank === 1) cardClass += " rank-1-card";
                        else if(currentRank === 2) cardClass += " rank-2-card";
                        else if(currentRank === 3) cardClass += " rank-3-card";

                        let badgeEmoji = currentRank;
                        if(currentRank === 1) badgeEmoji = '<i class="fa-solid fa-crown"></i>';

                        let initial = user.name.charAt(0).toUpperCase();

                        let rankCard = document.createElement("div");
                        rankCard.className = cardClass;

                        rankCard.innerHTML = `
                            <div class="rank-left-section">
                                <div class="rank-badge">${badgeEmoji}</div>
                                <div class="rank-avatar">${initial}</div>
                                <div class="rank-info">
                                    <h4>${user.name}</h4>
                                    <p>Global Earner</p>
                                </div>
                            </div>
                            <div class="rank-amount">
                                ${user.coins} 🪙
                            </div>
                        `;
                        listContainer.appendChild(rankCard);
                    });
                } else {
                    listContainer.innerHTML = `<p class="empty-txt">No active rank metrics loaded yet.</p>`;
                }
            } catch(e) {
                listContainer.innerHTML = `<p class="empty-txt">Could not connect to leaderboard server.</p>`;
            }
        }

        let isTimerActiveState = true;
        let clockInterval = null;
        let validationTimer = null;
        let validationTimeInt = 15;
        let targetAdWindowProxy = null;
        let totalAdSecondsActive = 0;

        // 🔥 ADDED TAB TRACKER 
        window.hasMainTabHidden = false;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) { window.hasMainTabHidden = true; }
        });

        function showCustomAlert(msgKey, isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msg = langData[currentLang][msgKey] || langData["en"][msgKey];
            
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        function executeValidateHourlyTimerStatus() {
            const lastClaimTimestamp = parseInt(localStorage.getItem("lastHourlyClaimedTime") || "0");
            const currentTimestampNow = Date.now();
            
            if (clockInterval) { clearInterval(clockInterval); }

            if (lastClaimTimestamp === 0 || (currentTimestampNow - lastClaimTimestamp >= 3600000)) {
                isTimerActiveState = false;
                document.getElementById("resetTimer").style.display = "none";
                
                let currentLang = localStorage.getItem("selectedLang") || "en";
                document.getElementById("timerLabelTxt").innerText = "🎁 Status: Ready!";
                document.getElementById("timerLabelTxt").style.color = "var(--accent-green)";
                
                document.getElementById("claimDropBtn").style.display = "block";
                document.getElementById("claimDropBtn").disabled = false;
                document.getElementById("claimDropBtn").innerHTML = `<i class="fa-solid fa-gift"></i> ${langData[currentLang]["hb_claim"] || "Claim Hourly Bonus"}`;
            } else {
                isTimerActiveState = true;
                document.getElementById("resetTimer").style.display = "block";
                
                let currentLang = localStorage.getItem("selectedLang") || "en";
                document.getElementById("timerLabelTxt").innerText = langData[currentLang]["hb_next"] || "Next Hourly Bonus In";
                document.getElementById("timerLabelTxt").style.color = "var(--text-sub)";
                
                document.getElementById("claimDropBtn").style.display = "none";
                startCountdownEngine(lastClaimTimestamp);
            }
        }

        function startCountdownEngine(lastClaim) {
            function updateClock() {
                if (!isTimerActiveState) {
                    clearInterval(clockInterval);
                    return;
                }

                const timePassed = Date.now() - lastClaim;
                const timeRemaining = 3600000 - timePassed;

                if (timeRemaining <= 0) {
                    clearInterval(clockInterval);
                    executeValidateHourlyTimerStatus(); 
                } else {
                    let minutesLeft = Math.floor(timeRemaining / 60000);
                    let secondsLeft = Math.floor((timeRemaining % 60000) / 1000);
                    
                    let displayMin = minutesLeft < 10 ? "0" + minutesLeft : minutesLeft;
                    let displaySec = secondsLeft < 10 ? "0" + secondsLeft : secondsLeft;
                    
                    document.getElementById("resetTimer").innerText = `${displayMin}m ${displaySec}s`;
                }
            }
            
            updateClock();
            clockInterval = setInterval(updateClock, 1000);
        }

        // 🚀 SECURE SYSTEM SHIELD (15 SECONDS)
        function executeSystemValidationAndClaim() {
            const btn = document.getElementById("claimDropBtn");
            btn.style.display = "none";
            
            document.getElementById("validationCardBox").style.display = "block";
            
            validationTimeInt = 15;
            totalAdSecondsActive = 0;
            window.hasMainTabHidden = false; // Reset tracker

            targetAdWindowProxy = window.open(activeAdminSmartlinkUrl, '_blank', 'noopener,noreferrer');

            validationTimer = setInterval(() => {
                if(targetAdWindowProxy && targetAdWindowProxy.closed) {
                    clearInterval(validationTimer);
                    executeResetValidationUI();
                    showCustomAlert("err_early");
                    return;
                }

                if(!document.hidden && window.hasMainTabHidden) {
                    if(totalAdSecondsActive < 14) {
                        clearInterval(validationTimer);
                        executeResetValidationUI();
                        showCustomAlert("err_invalid");
                        return;
                    }
                }

                totalAdSecondsActive++;
                validationTimeInt--;
                document.getElementById("validationClockTxt").innerText = `${validationTimeInt}s`;

                if(validationTimeInt <= 0) {
                    clearInterval(validationTimer);
                    document.getElementById("validationClockTxt").innerText = "0s";
                    executeRewardSyncWithNodeServer();
                }
            }, 1000);
        }

        // 💰 REWARD ENGINE: Calls Node.js API, Syncs t7
        async function executeRewardSyncWithNodeServer() {
            try {
                const res = await fetch(`${API_BASE_URL}/user/update-balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ 
                        userId: uid, 
                        pointsToAdd: hourlyRewardCoinsPool, 
                        action: "hourly_bonus_claim",
                        syncTask: "t7" // Completes Daily Task 't7'
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    document.getElementById("liveUserCoins").innerText = data.newCoins;
                    
                    localStorage.setItem("lastHourlyClaimedTime", Date.now().toString());
                    
                    executeResetValidationUI();
                    executeValidateHourlyTimerStatus(); 
                    showCustomAlert("err_success", true);
                }
            } catch (err) {
                executeResetValidationUI();
                alert("Task Verified but couldn't sync with server. Try again.");
            }
        }

        function executeResetValidationUI() {
            document.getElementById("validationCardBox").style.display = "none";
            document.getElementById("claimDropBtn").style.display = "block";
            let currentLang = localStorage.getItem("selectedLang") || "en";
            document.getElementById("claimDropBtn").innerHTML = `<i class="fa-solid fa-gift"></i> ${langData[currentLang]["hb_claim"] || "Claim Hourly Bonus"}`;
            document.getElementById("claimDropBtn").disabled = false;
            document.getElementById("validationClockTxt").innerText = "15s";
        }
    </script>
