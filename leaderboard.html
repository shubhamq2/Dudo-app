<html lang="en">
<head>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-gold: #fbbf24;
            --accent-pink: #ec4899;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --rank1-color: #facc15;
            --rank2-color: #cbd5e1;
            --rank3-color: #d97706;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(circle at 50% 0%, rgba(250, 204, 21, 0.1) 0%, transparent 60%); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; color: var(--text-main); min-height: 100vh; padding-bottom: 150px; overflow-x: hidden; }
        
        /* Premium Sync Header */
        .header { width: 100%; background: rgba(15, 23, 42, 0.95); padding: 15px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--accent-gold); backdrop-filter: blur(15px); }
        .back-btn { font-size: 20px; font-weight: bold; color: var(--accent-gold); text-decoration: none; padding: 5px 12px; border-radius: 8px; background: rgba(250, 204, 21, 0.15); transition: 0.2s; border: 1px solid rgba(250, 204, 21, 0.3); }
        .back-btn:active { transform: scale(0.9); }
        .header h2 { margin: 0; font-size: 19px; color: #fff; font-weight: 900; flex-grow: 1; text-align: center; margin-right: 10px; letter-spacing: 0.5px; text-transform: uppercase; }

        .header-controls { display: flex; gap: 10px; align-items: center; }
        .custom-lang-select { padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); outline: none; font-size: 12px; background: #1e293b; color: var(--accent-gold); font-weight: bold; cursor: pointer; }
        
        /* Banner Ads Slots */
        .ad-container-block { width: 92%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; margin: 15px 0; }
        .ad-slot-banner { width: 100%; min-height: 52px; background: rgba(255,255,255,0.03); border-radius: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 1px dashed rgba(250, 204, 21, 0.4); box-sizing: border-box; display: none; }

        /* 🏆 WINNERS PODIUM DESIGN */
        .podium-container { width: 92%; max-width: 440px; display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-top: 30px; margin-bottom: 25px; height: 180px; }
        .podium-step { display: flex; flex-direction: column; align-items: center; position: relative; width: 30%; }
        
        .avatar-box { border-radius: 50%; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #1e293b; position: relative; z-index: 2; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .crown { position: absolute; font-size: 24px; top: -20px; z-index: 3; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); animation: floatCrown 2s infinite alternate; }
        
        @keyframes floatCrown { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

        .podium-name { font-size: 11px; font-weight: 800; color: #fff; margin-top: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .podium-score { font-size: 13px; font-weight: 900; color: var(--accent-gold); margin-top: 4px; background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 8px; }
        
        .step-block { width: 100%; border-radius: 12px 12px 0 0; display: flex; justify-content: center; align-items: flex-start; padding-top: 10px; font-size: 24px; font-weight: 900; color: rgba(0,0,0,0.5); margin-top: 10px; box-shadow: inset 0 5px 15px rgba(255,255,255,0.2); }

        /* RANK 1 */
        .rank-1 .avatar-box { width: 75px; height: 75px; border: 3px solid var(--rank1-color); box-shadow: 0 0 25px rgba(250, 204, 21, 0.6); }
        .rank-1 .step-block { height: 90px; background: linear-gradient(180deg, var(--rank1-color), #854d0e); border-top: 2px solid #fff; }
        /* RANK 2 */
        .rank-2 .avatar-box { width: 60px; height: 60px; border: 3px solid var(--rank2-color); box-shadow: 0 0 15px rgba(203, 213, 225, 0.4); }
        .rank-2 .step-block { height: 65px; background: linear-gradient(180deg, var(--rank2-color), #475569); }
        /* RANK 3 */
        .rank-3 .avatar-box { width: 55px; height: 55px; border: 3px solid var(--rank3-color); box-shadow: 0 0 15px rgba(217, 119, 6, 0.4); }
        .rank-3 .step-block { height: 50px; background: linear-gradient(180deg, var(--rank3-color), #78350f); }

        /* 📜 LEADERBOARD LIST */
        .list-container { width: 92%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; }
        .list-item { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 12px 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.2s; }
        .list-item:hover { background: rgba(30, 41, 59, 0.95); border-color: rgba(255,255,255,0.1); transform: scale(0.98); }
        
        .list-rank { font-size: 16px; font-weight: 900; color: var(--text-sub); width: 30px; text-align: center; }
        .list-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--primary-blue); overflow: hidden; display: flex; justify-content: center; align-items: center; background: #1e293b; }
        .list-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .list-details { flex-grow: 1; overflow: hidden; }
        .list-name { font-size: 14.5px; font-weight: 800; color: #fff; margin: 0 0 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-score { font-size: 12px; font-weight: 700; color: var(--accent-gold); display: flex; align-items: center; gap: 4px; }
        
        /* 📌 STICKY MY RANK BAR */
        .my-rank-sticky { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 440px; background: linear-gradient(135deg, rgba(6, 182, 212, 0.95), rgba(59, 130, 246, 0.95)); border: 1px solid #67e8f9; border-radius: 20px; padding: 12px 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4); backdrop-filter: blur(15px); z-index: 90; box-sizing: border-box; }
        .my-rank-sticky .list-rank { color: #fff; font-size: 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .my-rank-sticky .list-avatar { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .my-rank-sticky .list-name { color: #fff; }
        .my-rank-sticky .list-score { color: #fef08a; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }

        /* 📱 Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 24px); max-width: 460px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px; padding: 8px 12px; display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(20px); box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 999; box-sizing: border-box; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); text-decoration: none; font-size: 10px; font-weight: 800; padding: 8px; border-radius: 20px; transition: 0.25s; flex: 1; text-align: center; cursor: pointer; }
        .nav-item i { font-size: 18px; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent-gold); background: rgba(250, 204, 21, 0.12); border: 1px solid rgba(250, 204, 21, 0.3); transform: translateY(-3px); box-shadow: 0 6px 15px rgba(250, 204, 21, 0.2); }

        /* System Modal & Offline */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.85); z-index: 99999; backdrop-filter: blur(5px); }
        #globalOfflineWarningOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(6, 9, 19, 0.95); z-index: 99999999; flex-direction: column; justify-content: center; align-items: center; padding: 25px; text-align: center; backdrop-filter: blur(10px); }
        
        .loading-text { text-align: center; color: var(--text-sub); font-size: 14px; font-weight: 800; margin-top: 50px; width: 100%; }
    </style>
</head>
<body>

    <!-- 📱 5-BUTTON FLOATING BOTTOM NAVIGATION BAR -->

        <a href="ho.html" class="nav-item"><i class="fa-solid fa-house"></i><span data-i18n="nav_home">Home</span></a>
        <a href="tasks.html" class="nav-item"><i class="fa-solid fa-fire"></i><span data-i18n="nav_offerwall">Offerwall</span></a>

    <!-- 🔥 PURE FIREBASE REALTIME SCRIPT ENGINE -->
    <script>
        // 1. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDuLIk8A5X7w0zZVblZZlIuMwExDUW56zQ",
            authDomain: "dudo-dc7cd.firebaseapp.com",
            databaseURL: "https://dudo-dc7cd-default-rtdb.firebaseio.com",
            projectId: "dudo-dc7cd",
            storageBucket: "dudo-dc7cd.firebasestorage.app",
            messagingSenderId: "254085241041",
            appId: "1:254085241041:web:3a8f3d8490aa37ff454df0",
            measurementId: "G-8BKZSHYLF6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // 🌐 FULL 13+ LANGUAGES SUPPORT
        const langData = {
            "en": { "lb_title": "Leaderboard", "lb_you": "You (My Rank)", "nav_home": "Home", "nav_offerwall": "Offerwall", "nav_daily": "Daily", "nav_leaders": "Leaders", "nav_vault": "Vault", "mod_no_net": "No Internet", "mod_no_net_d": "Please enable Mobile Data or Wi-Fi to continue.", "mod_retry": "Retry Connection" },
            "hi": { "lb_title": "लीडरबोर्ड", "lb_you": "आप (मेरी रैंक)", "nav_home": "होम", "nav_offerwall": "ऑफरवॉल", "nav_daily": "दैनिक", "nav_leaders": "लीडर्स", "nav_vault": "वॉलेट", "mod_no_net": "इंटरनेट नहीं है", "mod_no_net_d": "कृपया मोबाइल डेटा या वाई-फाई चालू करें।", "mod_retry": "फिर से कोशिश करें" },
            "bn": { "lb_title": "লিডারবোর্ড", "lb_you": "আপনি (আমার র‍্যাঙ্ক)", "nav_home": "হোম", "nav_offerwall": "অফারওয়াল", "nav_daily": "দৈনিক", "nav_leaders": "লিডারস", "nav_vault": "ভল্ট" },
            "te": { "lb_title": "లీడర్‌బోర్డ్", "lb_you": "మీరు (నా ర్యాంక్)", "nav_home": "హోమ్", "nav_offerwall": "ఆఫర్‌వాల్", "nav_daily": "రోజువారీ", "nav_leaders": "లీడర్స్", "nav_vault": "వాలెట్" },
            "mr": { "lb_title": "लीडरबोर्ड", "lb_you": "तुम्ही (माझी रँक)", "nav_home": "होम", "nav_offerwall": "ऑफरवॉल", "nav_daily": "दैनिक", "nav_leaders": "लीडर्स", "nav_vault": "वॉलेट" },
            "ta": { "lb_title": "லீடர்போர்டு", "lb_you": "நீங்கள்", "nav_home": "முகப்பு", "nav_offerwall": "சலுகைகள்", "nav_daily": "தினசரி", "nav_leaders": "தலைவர்கள்", "nav_vault": "பணப்பை" },
            "ur": { "lb_title": "لیڈر بورڈ", "lb_you": "آپ (میری رینک)", "nav_home": "ہوم", "nav_offerwall": "آفر وال", "nav_daily": "روزانہ", "nav_leaders": "لیڈرز", "nav_vault": "والٹ" },
            "gu": { "lb_title": "લીડરબોર્ડ", "lb_you": "તમે (મારો રેન્ક)", "nav_home": "હોમ", "nav_offerwall": "ઓફરવોલ", "nav_daily": "દૈનિક", "nav_leaders": "લીડર્સ", "nav_vault": "વોલેટ" },
            "es": { "lb_title": "Clasificación", "lb_you": "Tú (Mi Rango)", "nav_home": "Inicio", "nav_offerwall": "Ofertas", "nav_daily": "Diario", "nav_leaders": "Líderes", "nav_vault": "Bóveda" },
            "fr": { "lb_title": "Classement", "lb_you": "Vous (Mon Rang)", "nav_home": "Accueil", "nav_offerwall": "Offres", "nav_daily": "Quotidien", "nav_leaders": "Leaders", "nav_vault": "Coffre" },
            "ar": { "lb_title": "المتصدرين", "lb_you": "أنت (ترتيبي)", "nav_home": "الرئيسية", "nav_offerwall": "عروض", "nav_daily": "يومي", "nav_leaders": "القادة", "nav_vault": "محفظة" },
            "pt": { "lb_title": "Classificação", "lb_you": "Você (Meu Rank)", "nav_home": "Início", "nav_offerwall": "Ofertas", "nav_daily": "Diário", "nav_leaders": "Líderes", "nav_vault": "Cofre" },
            "ru": { "lb_title": "Рейтинг", "lb_you": "Вы (Мой Ранг)", "nav_home": "Главная", "nav_offerwall": "Офферы", "nav_daily": "Ежедневно", "nav_leaders": "Лидеры", "nav_vault": "Кошелек" }
        };

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) elem.innerText = transObj[key];
            });
            document.getElementById("appLanguage").value = langCode;
        }

        // Script Injector for Admin Banners
        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        const uid = localStorage.getItem("userId");

        // Network Monitor
        window.addEventListener('online', () => { document.getElementById("globalOfflineWarningOverlay").style.display = "none"; });
        window.addEventListener('offline', () => { document.getElementById("globalOfflineWarningOverlay").style.display = "flex"; });

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.replace("index.html"); return; }
            if (!navigator.onLine) document.getElementById("globalOfflineWarningOverlay").style.display = "flex";
            
            // Sync Language
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            auth.onAuthStateChanged((user) => {
                if (user) {
                    
                    // 1. Fetch Dynamic Bottom Nav from Admin
                    db.ref('global_system_runtime_configurations/bottom_tabs').on('value', (snap) => {
                        const container = document.getElementById("bottomNavContainer");
                        if (snap.exists()) {
                            const t = snap.val();
                            container.innerHTML = `
                                <a href="ho.html" class="nav-item"><i class="fa-solid fa-house"></i><span data-i18n="nav_home">Home</span></a>
                                <a href="${t.t2_url || 'tasks.html'}" class="nav-item"><i class="${t.t2_icon || 'fa-solid fa-fire'}"></i><span data-i18n="nav_offerwall">${t.t2_name || 'Offerwall'}</span></a>
                                <a href="${t.t3_url || 'daily.html'}" class="nav-item"><i class="${t.t3_icon || 'fa-solid fa-gift'}"></i><span data-i18n="nav_daily">${t.t3_name || 'Daily'}</span></a>
                                <a href="${t.t4_url || 'leaderboard.html'}" class="nav-item active"><i class="${t.t4_icon || 'fa-solid fa-trophy'}"></i><span data-i18n="nav_leaders">${t.t4_name || 'Leaders'}</span></a>
                                <a href="${t.t5_url || 'my_point1.html'}" class="nav-item"><i class="${t.t5_icon || 'fa-solid fa-wallet'}"></i><span data-i18n="nav_vault">${t.t5_name || 'Vault'}</span></a>
                            `;
                        }
                        changeLanguage(localStorage.getItem("selectedLang") || "en");
                    });

                    // 2. Load Admin Banners
                    db.ref('global_system_runtime_configurations/leaderboard_configs').on('value', (snap) => {
                        if(snap.exists()) {
                            const adminData = snap.val();
                            let s1Code = (adminData.slot1 && adminData.slot1.code) ? adminData.slot1.code : adminData.slot1_code;
                            let s1Active = (adminData.slot1 && adminData.slot1.active !== undefined) ? adminData.slot1.active : adminData.active;
                            if (s1Code && s1Active !== false) {
                                document.getElementById("adminBannerSlot1").style.display = "flex";
                                setTimeout(() => setAdHTML(document.getElementById("adminBannerSlot1"), s1Code), 400);
                            } else { document.getElementById("adminBannerSlot1").style.display = "none"; }
                            
                            let s2Code = (adminData.slot2 && adminData.slot2.code) ? adminData.slot2.code : adminData.slot2_code;
                            let s2Active = (adminData.slot2 && adminData.slot2.active !== undefined) ? adminData.slot2.active : adminData.active;
                            if (s2Code && s2Active !== false) {
                                document.getElementById("adminBannerSlot2").style.display = "flex";
                                setTimeout(() => setAdHTML(document.getElementById("adminBannerSlot2"), s2Code), 800);
                            } else { document.getElementById("adminBannerSlot2").style.display = "none"; }
                            
                            let s3Code = (adminData.slot3 && adminData.slot3.code) ? adminData.slot3.code : adminData.slot3_code;
                            let s3Active = (adminData.slot3 && adminData.slot3.active !== undefined) ? adminData.slot3.active : adminData.active;
                            if (s3Code && s3Active !== false) {
                                document.getElementById("adminBannerSlot3").style.display = "flex";
                                setTimeout(() => setAdHTML(document.getElementById("adminBannerSlot3"), s3Code), 1200);
                            } else { document.getElementById("adminBannerSlot3").style.display = "none"; }
                        }
                    });

                    // 3. 🚀 FETCH USERS DATA FOR LEADERBOARD (Top 100 max for performance)
                    db.ref('users').orderByChild('coins').limitToLast(100).on('value', (snapshot) => {
                        document.getElementById("loadingData").style.display = "none";
                        const listContainer = document.getElementById("leaderboardList");
                        listContainer.innerHTML = "";
                        
                        let usersArray = [];
                        if (snapshot.exists()) {
                            snapshot.forEach(child => {
                                let u = child.val();
                                u.uidKey = child.key;
                                usersArray.push(u);
                            });
                        }

                        // Firebase returns ascending, so we reverse it to Descending (Highest First)
                        usersArray.reverse();

                        function getAvatarHtml(uObj) {
                            let uName = uObj.name || "Player";
                            let fallback = `https://api.dicebear.com/7.x/adventurer/svg?seed=${uName || uObj.uidKey}&backgroundColor=b6e3f4`;
                            let pic = uObj.profile_pic ? uObj.profile_pic : fallback;
                            
                            if (pic.startsWith("http") || pic.startsWith("data:")) {
                                return `<img src="${pic}">`;
                            } else {
                                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50%" y="54%" font-size="55" text-anchor="middle" dominant-baseline="middle">${pic}</text></svg>`;
                                return `<img src="data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}">`;
                            }
                        }

                        // Populate Podium (Top 3)
                        if(usersArray.length > 0) {
                            document.getElementById("podiumContainer").style.display = "flex";
                            
                            // Rank 1
                            if(usersArray[0]) {
                                document.getElementById("avatar1").innerHTML = getAvatarHtml(usersArray[0]);
                                document.getElementById("name1").innerText = usersArray[0].name ? usersArray[0].name.split(" ")[0] : "Player";
                                document.getElementById("score1").innerText = (usersArray[0].coins || 0) + " 🪙";
                            }
                            // Rank 2
                            if(usersArray[1]) {
                                document.getElementById("avatar2").innerHTML = getAvatarHtml(usersArray[1]);
                                document.getElementById("name2").innerText = usersArray[1].name ? usersArray[1].name.split(" ")[0] : "Player";
                                document.getElementById("score2").innerText = (usersArray[1].coins || 0) + " 🪙";
                            } else { document.getElementById("podiumRank2").style.visibility = "hidden"; }
                            // Rank 3
                            if(usersArray[2]) {
                                document.getElementById("avatar3").innerHTML = getAvatarHtml(usersArray[2]);
                                document.getElementById("name3").innerText = usersArray[2].name ? usersArray[2].name.split(" ")[0] : "Player";
                                document.getElementById("score3").innerText = (usersArray[2].coins || 0) + " 🪙";
                            } else { document.getElementById("podiumRank3").style.visibility = "hidden"; }
                        }

                        // Populate List (Rank 4 to 50)
                        let myRankFound = false;
                        
                        for (let i = 3; i < Math.min(usersArray.length, 50); i++) {
                            let u = usersArray[i];
                            let isMe = u.uidKey === uid;
                            if(isMe) myRankFound = true;
                            
                            let bgHighlight = isMe ? "background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2)); border-color: var(--accent-cyan);" : "";

                            listContainer.innerHTML += `
                                <div class="list-item" style="${bgHighlight}">
                                    <div class="list-rank">#${i + 1}</div>
                                    <div class="list-avatar">${getAvatarHtml(u)}</div>
                                    <div class="list-details">
                                        <div class="list-name">${u.name || "Player"}</div>
                                        <div class="list-score">🪙 ${u.coins || 0}</div>
                                    </div>
                                </div>
                            `;
                        }

                        // Update Current User Sticky Bar
                        let myIndex = usersArray.findIndex(u => u.uidKey === uid);
                        if(myIndex !== -1) {
                            let myObj = usersArray[myIndex];
                            document.getElementById("myRankNumber").innerText = "#" + (myIndex + 1);
                            document.getElementById("myAvatarIcon").innerHTML = getAvatarHtml(myObj);
                            document.getElementById("myScoreValue").innerText = myObj.coins || 0;
                            document.getElementById("myRankBar").style.display = "flex";
                        } else {
                            // User is not in top 100, fetch their individual score
                            db.ref('users/' + uid).once('value', (mySnap) => {
                                if(mySnap.exists()) {
                                    let myObj = mySnap.val();
                                    myObj.uidKey = uid;
                                    document.getElementById("myRankNumber").innerText = "100+";
                                    document.getElementById("myAvatarIcon").innerHTML = getAvatarHtml(myObj);
                                    document.getElementById("myScoreValue").innerText = myObj.coins || 0;
                                    document.getElementById("myRankBar").style.display = "flex";
                                }
                            });
                        }
                    });

                } else {
                    window.location.replace("index.html");
                }
            });
        });
    </script>
</body>
</html>
