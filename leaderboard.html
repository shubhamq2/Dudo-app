        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) { 
                    if (elem.tagName === "BUTTON") {
                        if(!elem.disabled) elem.innerHTML = `<i class="fa-solid fa-gift"></i> ${transObj[key]}`;
                    } else if (elem.tagName === "H4") {
                        elem.innerHTML = `<i class="fa-solid fa-shield-halved"></i> ${transObj[key]}`;
                    } else {
                        elem.innerText = transObj[key]; 
                    }
                }
            });
            document.getElementById("appLanguage").value = langCode;
            executeValidateHourlyTimerStatus(); 
        }

        // Script Injector for Admin Banners
        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        const uid = localStorage.getItem("userId");
        let activeAdminSmartlinkUrl = "https://www.profitablecpmrate.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js";

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.replace("index.html"); return; }
            
            // Sync Language from Home Page
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            auth.onAuthStateChanged((user) => {
                if (user) {
                    // 1. Live Balance & Smart Avatar Sync
                    db.ref('users/' + uid).on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.val();
                            document.getElementById("liveUserCoins").innerText = data.coins || 0;
                            
                            // Smart Avatar Sync (Matches ho.html)
                            let userName = data.name || "Player";
                            let finalAvatar = data.profile_pic ? data.profile_pic : `https://api.dicebear.com/7.x/adventurer/svg?seed=${userName || uid}&backgroundColor=b6e3f4`;
                            
                            function createEmojiURI(emoji) {
                                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50%" y="54%" font-size="55" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
                                return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
                            }

                            let avatarContainer = document.getElementById("headerProfileIcon");
                            if (finalAvatar.startsWith("http") || finalAvatar.startsWith("data:")) {
                                avatarContainer.innerHTML = `<img src="${finalAvatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            } else {
                                avatarContainer.innerHTML = `<img src="${createEmojiURI(finalAvatar)}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            }
                        }
                    });

                    // 2. Fetch Admin Configurations (Banners, Link & Amount from hourly_bonus node)
                    db.ref('global_system_runtime_configurations/hourly_bonus').on('value', (snap) => {
                        if(snap.exists()) {
                            const adminData = snap.val();
                            
                            // 🔥 GET ADMIN CONTROLLED TIME AND COINS
                            if (adminData.ad_timer) { globalAdTimerSeconds = parseInt(adminData.ad_timer); }
                            if (adminData.reward_amount) { hourlyRewardCoinsPool = parseInt(adminData.reward_amount); }

                            // Load Banners
                            if(adminData.slot1_code && adminData.active !== false) { document.getElementById("adminBannerSlot1").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot1"), adminData.slot1_code); } else { document.getElementById("adminBannerSlot1").style.display = "none"; }
                            if(adminData.slot2_code && adminData.active !== false) { document.getElementById("adminBannerSlot2").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot2"), adminData.slot2_code); } else { document.getElementById("adminBannerSlot2").style.display = "none"; }
                            if(adminData.slot3_code && adminData.active !== false) { document.getElementById("adminBannerSlot3").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot3"), adminData.slot3_code); } else { document.getElementById("adminBannerSlot3").style.display = "none"; }
                            if(adminData.slot4_code && adminData.active !== false) { document.getElementById("adminBannerSlot4").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot4"), adminData.slot4_code); } else { document.getElementById("adminBannerSlot4").style.display = "none"; }

                            // Link
                            if (adminData.task_ad_link) {
                                activeAdminSmartlinkUrl = adminData.task_ad_link;
                            }
                        } else {
                            // Fallback
                            db.ref('global_system_runtime_configurations/globalSmartlink').once('value').then(globalSnap => {
                                if(globalSnap.exists()) activeAdminSmartlinkUrl = globalSnap.val();
                            });
                        }
                    });

                    // 3. 🏆 FETCH REALTIME LEADERBOARD DIRECTLY FROM FIREBASE DB
                    executeLiveFirebaseLeaderboardSync();

                } else {
                    window.location.replace("index.html");
                }
            });

            executeValidateHourlyTimerStatus();
        });

        // 🏆 FIREBASE NATIVE LEADERBOARD ENGINE
        function executeLiveFirebaseLeaderboardSync() {
            const listContainer = document.getElementById("leaderboardListSlot");
            
            // Query Firebase 'users' node, sort by 'coins', get top 10
            db.ref('users').orderByChild('coins').limitToLast(10).on('value', (snapshot) => {
                if (snapshot.exists()) {
                    listContainer.innerHTML = "";
                    let usersArray = [];
                    
                    snapshot.forEach((childSnap) => {
                        let userData = childSnap.val();
                        if(userData.coins && userData.coins > 0) {
                            usersArray.push(userData);
                        }
                    });

                    // Reverse array because limitToLast returns ascending order
                    usersArray.reverse();

                    if(usersArray.length === 0) {
                        listContainer.innerHTML = `<p class="empty-txt">No active rank metrics loaded yet.</p>`;
                        return;
                    }

                    usersArray.forEach((user, index) => {
                        let currentRank = index + 1;
                        let cardClass = "rank-card";
                        if(currentRank === 1) cardClass += " rank-1-card";
                        else if(currentRank === 2) cardClass += " rank-2-card";
                        else if(currentRank === 3) cardClass += " rank-3-card";

                        let badgeEmoji = currentRank;
                        if(currentRank === 1) badgeEmoji = '<i class="fa-solid fa-crown"></i>';

                        let userName = user.name || "Player";
                        
                        // Use Dicebear if no profile pic exists
                        let avatarSrc = user.profile_pic ? user.profile_pic : `https://api.dicebear.com/7.x/adventurer/svg?seed=${userName}&backgroundColor=b6e3f4`;

                        let rankCard = document.createElement("div");
                        rankCard.className = cardClass;

                        rankCard.innerHTML = `
                            <div class="rank-left-section">
                                <div class="rank-badge">${badgeEmoji}</div>
                                <div class="rank-avatar"><img src="${avatarSrc}" alt="avatar"></div>
                                <div class="rank-info">
                                    <h4>${userName}</h4>
                                    <p>Global Earner</p>
                                </div>
                            </div>
                            <div class="rank-amount">
                                ${user.coins} 🪙
                            </div>
                        `;
                        listContainer.appendChild(rankCard);
                    });
                } else {
                    listContainer.innerHTML = `<p class="empty-txt">No active rank metrics loaded yet.</p>`;
                }
            }, (error) => {
                listContainer.innerHTML = `<p class="empty-txt">Could not connect to leaderboard server.</p>`;
            });
        }

        let isTimerActiveState = true;
        let clockInterval = null;
        let validationTimer = null;

        function showCustomAlert(msgKey, isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msg = langData[currentLang][msgKey] || langData["en"][msgKey];
            
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        function executeValidateHourlyTimerStatus() {
            const lastClaimTimestamp = parseInt(localStorage.getItem("lastHourlyClaimedTime") || "0");
            const currentTimestampNow = Date.now();
            
            if (clockInterval) { clearInterval(clockInterval); }

            if (lastClaimTimestamp === 0 || (currentTimestampNow - lastClaimTimestamp >= 3600000)) {
                isTimerActiveState = false;
                document.getElementById("resetTimer").style.display = "none";
                
                let currentLang = localStorage.getItem("selectedLang") || "en";
                document.getElementById("timerLabelTxt").innerText = "🎁 Status: Ready!";
                document.getElementById("timerLabelTxt").style.color = "var(--accent-green)";
                
                document.getElementById("claimDropBtn").style.display = "block";
                document.getElementById("claimDropBtn").disabled = false;
                document.getElementById("claimDropBtn").innerHTML = `<i class="fa-solid fa-gift"></i> ${langData[currentLang]["hb_claim"] || "Claim Hourly Bonus"}`;
            } else {
                isTimerActiveState = true;
                document.getElementById("resetTimer").style.display = "block";
                
                let currentLang = localStorage.getItem("selectedLang") || "en";
                document.getElementById("timerLabelTxt").innerText = langData[currentLang]["hb_next"] || "Next Hourly Bonus In";
                document.getElementById("timerLabelTxt").style.color = "var(--text-sub)";
                
                document.getElementById("claimDropBtn").style.display = "none";
                startCountdownEngine(lastClaimTimestamp);
            }
        }

        function startCountdownEngine(lastClaim) {
            function updateClock() {
                if (!isTimerActiveState) {
                    clearInterval(clockInterval);
                    return;
                }

                const timePassed = Date.now() - lastClaim;
                const timeRemaining = 3600000 - timePassed;

                if (timeRemaining <= 0) {
                    clearInterval(clockInterval);
                    executeValidateHourlyTimerStatus(); 
                } else {
                    let minutesLeft = Math.floor(timeRemaining / 60000);
                    let secondsLeft = Math.floor((timeRemaining % 60000) / 1000);
                    
                    let displayMin = minutesLeft < 10 ? "0" + minutesLeft : minutesLeft;
                    let displaySec = secondsLeft < 10 ? "0" + secondsLeft : secondsLeft;
                    
                    document.getElementById("resetTimer").innerText = `${displayMin}m ${displaySec}s`;
                }
            }
            
            updateClock();
            clockInterval = setInterval(updateClock, 1000);
        }

        // 🚀 SECURE SYSTEM SHIELD WITH IN-APP VIEWER
        function executeSystemValidationAndClaim() {
            const btn = document.getElementById("claimDropBtn");
            btn.style.display = "none";
            
            document.getElementById("validationCardBox").style.display = "block";
            
            let validationTimeInt = globalAdTimerSeconds;

            // Show In-App Viewer
            document.getElementById("inAppAdViewer").style.display = "flex";
            document.getElementById("adTimerDisplay").style.display = "flex";
            document.getElementById("adCloseBtn").style.display = "none";
            document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${validationTimeInt}s`;
            
            // Load Ad URL into iframe
            document.getElementById("adIframe").src = activeAdminSmartlinkUrl;

            if (validationTimer) clearInterval(validationTimer);

            validationTimer = setInterval(() => {
                validationTimeInt--;
                
                document.getElementById("validationClockTxt").innerText = `${validationTimeInt}s`;
                document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${validationTimeInt}s`;

                // 🛡️ ANTI-CHEAT FIX: Only triggers if the entire app is minimized
                if(document.hidden) {
                    clearInterval(validationTimer);
                    document.getElementById("inAppAdViewer").style.display = "none";
                    document.getElementById("adIframe").src = "";
                    executeResetValidationUI();
                    showCustomAlert("err_invalid");
                    return;
                }

                if(validationTimeInt <= 0) {
                    clearInterval(validationTimer);
                    document.getElementById("validationClockTxt").innerText = "0s";
                    document.getElementById("adTimerDisplay").style.display = "none";
                    document.getElementById("adCloseBtn").style.display = "block"; // Show X Button
                }
            }, 1000);
        }

        // 💰 REWARD ENGINE: Firebase Direct Sync, Syncs t7
        function closeInAppAdAndClaim() {
            document.getElementById("inAppAdViewer").style.display = "none";
            document.getElementById("adIframe").src = ""; // Stop video/ad

            // Add Coins securely via Transaction
            db.ref(`users/${uid}/coins`).transaction((current) => {
                return (current || 0) + hourlyRewardCoinsPool;
            }).then(() => {
                
                // Mark Daily Task 't7' as Complete
                db.ref(`users/${uid}/completed_daily_tasks`).once('value', (snap) => {
                    let tasks = snap.val() || [];
                    if (!tasks.includes("t7")) {
                        tasks.push("t7");
                        db.ref(`users/${uid}/completed_daily_tasks`).set(tasks);
                    }
                });

                localStorage.setItem("lastHourlyClaimedTime", Date.now().toString());
                executeResetValidationUI();
                executeValidateHourlyTimerStatus(); 
                showCustomAlert("err_success", true);
                
            }).catch(() => {
                executeResetValidationUI();
                alert("Task Verified but couldn't sync with server. Try again.");
            });
        }

        function executeResetValidationUI() {
            document.getElementById("validationCardBox").style.display = "none";
            document.getElementById("claimDropBtn").style.display = "block";
            let currentLang = localStorage.getItem("selectedLang") || "en";
            document.getElementById("claimDropBtn").innerHTML = `<i class="fa-solid fa-gift"></i> ${langData[currentLang]["hb_claim"] || "Claim Hourly Bonus"}`;
            document.getElementById("claimDropBtn").disabled = false;
            document.getElementById("validationClockTxt").innerText = `${globalAdTimerSeconds}s`;
        }
    </script>
