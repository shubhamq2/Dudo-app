<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; color: #fff; min-height: 100vh; padding-bottom: 30px; }
        
        /* Corporate Synchronized Header */
        .header { width: 100%; background: #1e293b; padding: 15px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #a855f7; }
        .back-btn { font-size: 20px; font-weight: bold; color: #a855f7; text-decoration: none; padding: 5px 10px; border-radius: 8px; background: rgba(168, 85, 247, 0.1); }
        .header h2 { margin: 0; font-size: 20px; color: #fff; font-weight: 800; flex-grow: 1; text-align: center; margin-right: 40px; }

        .main-container { width: 92%; max-width: 440px; margin: 20px auto; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; }

        /* 📢 AD INCOME SOURCE INTERACTION WINDOWS */
        .ad-banner-slot { width: 100%; min-height: 50px; background: #1e293b; border-radius: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 1px dashed #a855f7; margin: 5px 0; }

        /* 📊 Dynamic Metric Target Ring Indicator Ribbon */
        .user-metric-card { background: linear-gradient(135deg, #a855f7, #7c3aed); border-radius: 18px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 25px rgba(168, 85, 247, 0.25); }
        .metric-details { text-align: left; }
        .metric-details span { font-size: 11px; font-weight: 800; text-transform: uppercase; opacity: 0.9; letter-spacing: 0.5px; }
        .metric-details h3 { margin: 3px 0 0 0; font-size: 24px; font-weight: 900; color: #ffffff; }
        .coin-icon-pouch { font-size: 28px; }

        /* 🎟️ Premium Neon Sponsorship Cards Grids Layout */
        .milestone-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 5px; }
        .sponsor-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 18px; display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.15); box-sizing: border-box; }
        
        /* Visual Border Indicator Stripes for Different Tiers */
        .sponsor-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
        .card-bronze::before { background: #cd7f32; }
        .card-silver::before { background: #cbd5e1; }
        .card-gold::before { background: #facc15; }

        .sponsor-info-block { text-align: left; display: flex; flex-direction: column; gap: 3px; max-width: 65%; }
        .sponsor-info-block .card-title { font-size: 15px; font-weight: 800; color: #f8fafc; }
        .sponsor-info-block .card-desc { font-size: 12px; color: #94a3b8; font-weight: 500; line-height: 1.3; }
        
        /* Bar Indicator showing progress to goal */
        .progress-micro-bar { width: 100%; background: #0f172a; height: 5px; border-radius: 50px; margin-top: 6px; overflow: hidden; position: relative; }
        .progress-fill { background: #a855f7; height: 100%; width: 0%; transition: width 0.4s ease-in-out; }
        .card-bronze .progress-fill { background: #cd7f32; }
        .card-silver .progress-fill { background: #cbd5e1; }
        .card-gold .progress-fill { background: #facc15; }

        /* Interaction Status Buttons Styles layout */
        .milestone-action-btn { border: none; padding: 10px 18px; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; min-width: 90px; text-align: center; }
        .btn-locked { background: #334155; color: #64748b; cursor: not-allowed; }
        .btn-claimable { background: #10b981; color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); animation: pulseBtn 1.5s infinite alternate; }
        .btn-claimed { background: rgba(255,255,255,0.05); color: #475569; border: 1px solid rgba(255,255,255,0.05); cursor: not-allowed; }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
            100% { transform: scale(1.03); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5); }
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back-btn">←</a>
        <h2>Milestone Rewards</h2>
    </div>

    <div class="main-container">
        
        <!-- 📢 AD CONTEXT INTERACTION TOP REVENUE FIELD -->
        <div class="ad-banner-slot">
            <script type="text/javascript">atOptions={'key':'9d8e7e12df3875a6c3846d0cb748a04b','format':'iframe','height':50,'width':320,'params':{}};</script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js"></script>
        </div>

        <!-- Live Score Tracking Statistics Header -->
        <div class="user-metric-card">
            <div class="metric-details">
                <span>Your Current Total Score</span>
                <h3 id="masterScoreTxt">0 🪙</h3>
            </div>
            <div class="coin-icon-pouch">🏆</div>
        </div>

        <div class="milestone-grid" id="milestoneGridBox">
            
            <!-- Milestone 1: Bronze Level Card -->
            <div class="sponsor-card card-bronze" id="cardBox_bronze">
                <div class="sponsor-info-block">
                    <span class="card-title" id="title_bronze">Bronze Sponsor Bonus</span>
                    <span class="card-desc" id="desc_bronze">Reach coins target to activate.</span>
                    <div class="progress-micro-bar"><div class="progress-fill" id="barBronze"></div></div>
                </div>
                <button class="milestone-action-btn btn-locked" id="btnBronze">Locked</button>
            </div>

            <!-- Milestone 2: Silver Level Card -->
            <div class="sponsor-card card-silver" id="cardBox_silver">
                <div class="sponsor-info-block">
                    <span class="card-title" id="title_silver">Silver Premium Pass</span>
                    <span class="card-desc" id="desc_silver">Reach coins target to activate.</span>
                    <div class="progress-micro-bar"><div class="progress-fill" id="barSilver"></div></div>
                </div>
                <button class="milestone-action-btn btn-locked" id="btnSilver">Locked</button>
            </div>

            <!-- 📢 AD CONTEXT MID BANNER SLOT FOR HIGH IMPRESSION REVENUE -->
            <div class="ad-banner-slot" id="midAdSlot">
                <script type="text/javascript">atOptions={'key':'7c12f3875a6c3846d0cb748a04b9d8e','format':'iframe','height':50,'width':320,'params':{}};</script>
                <script type="text/javascript" src="https://www.highperformanceformat.com/7c12f3875a6c3846d0cb748a04b9d8e/invoke.js"></script>
            </div>

            <!-- Milestone 3: Gold Level Card -->
            <div class="sponsor-card card-gold" id="cardBox_gold">
                <div class="sponsor-info-block">
                    <span class="card-title" id="title_gold">Gold Ultimate Jackpot</span>
                    <span class="card-desc" id="desc_gold">Reach coins target to activate.</span>
                    <div class="progress-micro-bar"><div class="progress-fill" id="barGold"></div></div>
                </div>
                <button class="milestone-action-btn btn-locked" id="btnGold">Locked</button>
            </div>

        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkNc_eIIfqqxbTGqyZ1YWGE3W6lbNqUJQ",
            authDomain: "dudo-63594.firebaseapp.com",
            databaseURL: "https://dudo-63594-default-rtdb.firebaseio.com",
            projectId: "dudo-63594",
            storageBucket: "dudo-63594.firebasestorage.app",
            messagingSenderId: "732244407571",
            appId: "1:732244407571:web:d08486136dea6190de96e6",
            measurementId: "G-H6VVEXCD54"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const uid = localStorage.getItem("userId") || "GuestUser";

        let userMasterCoinsCounter = 0;

        document.addEventListener("DOMContentLoaded", () => {
            executeStartRealtimeMilestoneListener();
        });

        // 🧠 ANALYSIS CORE ENGINE: Watches scores and syncs dynamic multi-level transitions
        function executeStartRealtimeMilestoneListener() {
            database.ref('users/' + uid).on('value', (snapshot) => {
                if(snapshot.exists()) {
                    let d = snapshot.val();
                    userMasterCoinsCounter = d.coins || 0;
                    document.getElementById("masterScoreTxt").innerText = `${userMasterCoinsCounter} 🪙`;

                    let claimedLogs = d.claimed_milestones || {};

                    // 🔥 LEVEL 1 vs LEVEL 2 CONFIGURATIONS AUTOMATION ROUTER
                    
                    // 1. Bronze Processing (L1: 500, L2: 1500)
                    let bronzeGoal = (claimedLogs.bronze_l1 === true) ? 1500 : 500;
                    let bronzeReward = (bronzeGoal === 1500) ? 250 : 100;
                    let bronzeKey = (bronzeGoal === 1500) ? 'bronze_l2' : 'bronze_l1';
                    let bronzeTitle = (bronzeGoal === 1500) ? "Bronze Sponsor [LVL 2]" : "Bronze Sponsor Bonus";
                    setupDynamicCardModule(userMasterCoinsCounter, bronzeGoal, bronzeReward, bronzeKey, bronzeTitle, claimedLogs[bronzeKey], "barBronze", "btnBronze", "title_bronze", "desc_bronze", "cardBox_bronze");

                    // 2. Silver Processing (L1: 2000, L2: 4000)
                    let silverGoal = (claimedLogs.silver_l1 === true) ? 4000 : 2000;
                    let silverReward = (silverGoal === 4000) ? 600 : 300;
                    let silverKey = (silverGoal === 4000) ? 'silver_l2' : 'silver_l1';
                    let silverTitle = (silverGoal === 4000) ? "Silver Premium [LVL 2]" : "Silver Premium Pass";
                    setupDynamicCardModule(userMasterCoinsCounter, silverGoal, silverReward, silverKey, silverTitle, claimedLogs[silverKey], "barSilver", "btnSilver", "title_silver", "desc_silver", "cardBox_silver");

                    // 3. Gold Processing (L1: 500, L2: 10000)
                    let goldGoal = (claimedLogs.gold_l1 === true) ? 10000 : 5000;
                    let goldReward = (goldGoal === 10000) ? 2500 : 1000;
                    let goldKey = (goldGoal === 10000) ? 'gold_l2' : 'gold_l1';
                    let goldTitle = (goldGoal === 10000) ? "Gold Jackpot [LVL 2]" : "Gold Ultimate Jackpot";
                    setupDynamicCardModule(userMasterCoinsCounter, goldGoal, goldReward, goldKey, goldTitle, claimedLogs[goldKey], "barGold", "btnGold", "title_gold", "desc_gold", "cardBox_gold");
                }
            });
        }

        // 🛠️ LEVEL-UP RENDER PIPELINE: Transitions targets, updates titles, and hides ONLY after Level 2 Completion
        function setupDynamicCardModule(currentCoins, targetGoal, rewardCoins, stateDbKey, titleText, isAlreadyClaimed, barId, btnId, titleId, descId, boxId) {
            const bar = document.getElementById(barId);
            const btn = document.getElementById(btnId);
            const titleElem = document.getElementById(titleId);
            const descElem = document.getElementById(descId);
            const box = document.getElementById(boxId);

            if (isAlreadyClaimed === true) {
                box.style.display = "none"; // Hides permanently only after ultimate level completion
                return;
            }

            box.style.display = "flex";
            titleElem.innerText = titleText;
            descElem.innerText = `Target: Reach ${targetGoal} lifetime coins. Reward: +${rewardCoins} 🪙`;

            let percentage = (currentCoins / targetGoal) * 100;
            if(percentage > 100) percentage = 100;
            bar.style.width = percentage + "%";

            // Clean click router override assignment
            btn.onclick = () => executeClaimMilestoneCoins(stateDbKey, targetGoal, rewardCoins);

            if (currentCoins >= targetGoal) {
                btn.className = "milestone-action-btn btn-claimable";
                btn.innerText = "Claim 🎁";
                btn.disabled = false;
            } else {
                btn.className = "milestone-action-btn btn-locked";
                btn.innerText = "Locked 🔒";
                btn.disabled = true;
            }
        }

        // 💰 TRANSACTION DISPATCH ROUTER: Allocates rewards and unlocks sequential node targets
        function executeClaimMilestoneCoins(stateDbKey, goalLimitCheck, rewardBonusCoins) {
            if(userMasterCoinsCounter < goalLimitCheck) return;

            database.ref('users/' + uid).once('value').then((snapshot) => {
                if(snapshot.exists()) {
                    let oldCoins = snapshot.val().coins || 0;
                    
                    let updates = {};
                    updates['coins'] = oldCoins + rewardBonusCoins;
                    updates[`claimed_milestones/${stateDbKey}`] = true;

                    database.ref('users/' + uid).update(updates).then(() => {
                        alert(`🎉 Level-Up Bonus! +${rewardBonusCoins} Coins credited straight inside your wallet.`);
                    });
                }
            });
        }
    </script>
</body>
</html>
