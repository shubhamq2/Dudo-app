<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestone Rewards - Dudo</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-gold: #fbbf24;
            --accent-pink: #f43f5e;
            --accent-purple: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(circle at 50% 10%, rgba(168, 85, 247, 0.1) 0%, transparent 60%); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }
        
        /* Premium Sync Header */
        .header { width: 100%; background: rgba(15, 23, 42, 0.9); padding: 15px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--accent-purple); backdrop-filter: blur(10px); }
        .back-btn { font-size: 20px; font-weight: bold; color: var(--accent-purple); text-decoration: none; padding: 5px 12px; border-radius: 8px; background: rgba(168, 85, 247, 0.15); transition: 0.2s; border: 1px solid rgba(168, 85, 247, 0.3); }
        .back-btn:active { transform: scale(0.9); }
        .header h2 { margin: 0; font-size: 19px; color: #fff; font-weight: 800; flex-grow: 1; text-align: center; margin-right: 40px; letter-spacing: 0.5px; }

        .main-container { width: 92%; max-width: 440px; margin: 20px auto; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; }

        /* 📢 AD INCOME SOURCE SLOTS */
        .ad-banner-slot { width: 100%; min-height: 52px; background: rgba(255,255,255,0.03); border-radius: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 1px dashed rgba(168, 85, 247, 0.4); margin: 5px 0; box-sizing: border-box; }

        /* 📊 Dynamic Metric Target Ring Indicator Ribbon */
        .user-metric-card { background: linear-gradient(135deg, rgba(168, 85, 247, 0.9), rgba(124, 58, 237, 0.9)); border-radius: 20px; padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .metric-details { text-align: left; }
        .metric-details span { font-size: 12.5px; font-weight: 800; text-transform: uppercase; color: #e9d5ff; letter-spacing: 1px; }
        .metric-details h3 { margin: 5px 0 0 0; font-size: 28px; font-weight: 900; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .coin-icon-pouch { font-size: 40px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4)); animation: floatCoin 2s infinite alternate; }
        @keyframes floatCoin { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

        /* 🎟️ Premium Neon Sponsorship Cards Grids Layout */
        .milestone-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 5px; }
        .sponsor-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px; display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.4); box-sizing: border-box; backdrop-filter: blur(10px); }
        
        /* Visual Border Indicator Stripes for Different Tiers */
        .sponsor-card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; }
        .card-bronze::before { background: linear-gradient(to bottom, #d97706, #b45309); }
        .card-silver::before { background: linear-gradient(to bottom, #cbd5e1, #94a3b8); }
        .card-gold::before { background: linear-gradient(to bottom, #facc15, #ca8a04); }

        .sponsor-info-block { text-align: left; display: flex; flex-direction: column; gap: 5px; max-width: 65%; }
        .sponsor-info-block .card-title { font-size: 15px; font-weight: 900; color: #fff; letter-spacing: 0.5px; }
        .sponsor-info-block .card-desc { font-size: 12px; color: var(--text-sub); font-weight: 600; line-height: 1.4; }
        
        /* Bar Indicator showing progress to goal */
        .progress-micro-bar { width: 100%; background: rgba(0,0,0,0.5); height: 8px; border-radius: 50px; margin-top: 8px; overflow: hidden; position: relative; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
        .progress-fill { height: 100%; width: 0%; transition: width 0.5s ease-in-out; border-radius: 50px; }
        .card-bronze .progress-fill { background: linear-gradient(90deg, #d97706, #f59e0b); box-shadow: 0 0 10px #d97706; }
        .card-silver .progress-fill { background: linear-gradient(90deg, #94a3b8, #cbd5e1); box-shadow: 0 0 10px #cbd5e1; }
        .card-gold .progress-fill { background: linear-gradient(90deg, #ca8a04, #fde047); box-shadow: 0 0 10px #facc15; }

        /* Interaction Status Buttons Styles */
        .milestone-action-btn { border: none; padding: 12px 18px; border-radius: 12px; font-size: 13px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; min-width: 100px; text-align: center; letter-spacing: 1px; }
        .btn-locked { background: #334155; color: #94a3b8; cursor: not-allowed; }
        .btn-claimable { background: linear-gradient(135deg, var(--accent-green), #059669); color: #fff; box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4); animation: pulseBtn 1.5s infinite alternate; }
        .btn-claimable:active { transform: scale(0.95); }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
            100% { transform: scale(1.05); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.6); }
        }

        /* Custom Alert Popup */
        .custom-alert { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); border: 2px solid var(--accent-pink); padding: 25px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 1000; width: 85%; max-width: 350px; text-align: center; backdrop-filter: blur(10px); }
        .custom-alert.success-border { border-color: var(--accent-green); box-shadow: 0 15px 40px rgba(16, 185, 129, 0.2); }
        .custom-alert p { margin: 0 0 20px 0; font-size: 14.5px; color: #fff; font-weight: 700; line-height: 1.5; }
        .custom-alert button { background: var(--primary-blue); border: none; color: white; padding: 12px 35px; border-radius: 50px; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); text-transform: uppercase; transition: 0.2s; }
        .custom-alert button:active { transform: scale(0.95); }
        .custom-alert.success-border button { background: var(--accent-green); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.85); z-index: 999; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <div class="overlay" id="alertOverlay"></div>
    <div class="custom-alert" id="customAlertBox">
        <p id="alertMessage">Message</p>
        <button onclick="closeCustomAlert()">OK</button>
    </div>

    <div class="header">
        <a href="ho.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>Milestone Rewards</h2>
    </div>

    <div class="main-container">
        
        <!-- 📢 AD CONTEXT INTERACTION TOP REVENUE FIELD -->
        <div class="ad-banner-slot" id="adminBannerSlot1"></div>

        <!-- Live Score Tracking Statistics Header -->
        <div class="user-metric-card">
            <div class="metric-details">
                <span>Total Lifetime Score</span>
                <h3 id="masterScoreTxt"><i class="fa-solid fa-spinner fa-spin"></i></h3>
            </div>
            <div class="coin-icon-pouch">🏆</div>
        </div>

        <div class="milestone-grid" id="milestoneGridBox">
            
            <!-- Milestone 1: Bronze Level Card -->
            <div class="sponsor-card card-bronze" id="cardBox_bronze">
                <div class="sponsor-info-block">
                    <span class="card-title" id="title_bronze">Bronze Rank Bonus</span>
                    <span class="card-desc" id="desc_bronze">Reach target to activate.</span>
                    <div class="progress-micro-bar"><div class="progress-fill" id="barBronze"></div></div>
                </div>
                <button class="milestone-action-btn btn-locked" id="btnBronze">Locked <i class="fa-solid fa-lock"></i></button>
            </div>

            <!-- Milestone 2: Silver Level Card -->
            <div class="sponsor-card card-silver" id="cardBox_silver">
                <div class="sponsor-info-block">
                    <span class="card-title" id="title_silver">Silver Elite Pass</span>
                    <span class="card-desc" id="desc_silver">Reach target to activate.</span>
                    <div class="progress-micro-bar"><div class="progress-fill" id="barSilver"></div></div>
                </div>
                <button class="milestone-action-btn btn-locked" id="btnSilver">Locked <i class="fa-solid fa-lock"></i></button>
            </div>

            <!-- 📢 AD CONTEXT MID BANNER SLOT FOR HIGH IMPRESSION REVENUE -->
            <div class="ad-banner-slot" id="adminBannerSlot2"></div>

            <!-- Milestone 3: Gold Level Card -->
            <div class="sponsor-card card-gold" id="cardBox_gold">
                <div class="sponsor-info-block">
                    <span class="card-title" id="title_gold">Gold Master Jackpot</span>
                    <span class="card-desc" id="desc_gold">Reach target to activate.</span>
                    <div class="progress-micro-bar"><div class="progress-fill" id="barGold"></div></div>
                </div>
                <button class="milestone-action-btn btn-locked" id="btnGold">Locked <i class="fa-solid fa-lock"></i></button>
            </div>

        </div>
        
        <div class="ad-banner-slot" id="adminBannerSlot3"></div>

    </div>

    <!-- PURE NODE.JS API SERVER SCRIPT (NO FIREBASE) -->
    <script>
        const DEFAULT_API_BASE = "https://dudo-app.onrender.com/api";
        const API_BASE_URL = localStorage.getItem("customServerUrl") || DEFAULT_API_BASE;

        const uid = localStorage.getItem("userId");
        const token = localStorage.getItem("userToken");

        let userMasterCoinsCounter = 0;

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid || !token) { window.location.href = "index.html"; return; }
            fetchDataFromAdminServer();
        });

        // 📡 FETCH USER METRICS & ADMIN BANNERS
        async function fetchDataFromAdminServer() {
            try {
                // 1. Fetch User Data (Coins and Milestones logic)
                const userRes = await fetch(`${API_BASE_URL}/user/${uid}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const userData = await userRes.json();
                
                if (userData.success && userData.user) {
                    let d = userData.user;
                    userMasterCoinsCounter = d.coins || 0;
                    document.getElementById("masterScoreTxt").innerText = `${userMasterCoinsCounter} 🪙`;

                    let claimedLogs = d.claimed_milestones || {};

                    // 🔥 LEVEL 1 vs LEVEL 2 CONFIGURATIONS AUTOMATION ROUTER
                    
                    // 1. Bronze Processing (L1: 500, L2: 1500)
                    let bronzeGoal = (claimedLogs.bronze_l1 === true) ? 1500 : 500;
                    let bronzeReward = (bronzeGoal === 1500) ? 250 : 100;
                    let bronzeKey = (bronzeGoal === 1500) ? 'bronze_l2' : 'bronze_l1';
                    let bronzeTitle = (bronzeGoal === 1500) ? "Bronze Champion [LVL 2]" : "Bronze Rank Bonus";
                    setupDynamicCardModule(userMasterCoinsCounter, bronzeGoal, bronzeReward, bronzeKey, bronzeTitle, claimedLogs[bronzeKey], "barBronze", "btnBronze", "title_bronze", "desc_bronze", "cardBox_bronze");

                    // 2. Silver Processing (L1: 2000, L2: 4000)
                    let silverGoal = (claimedLogs.silver_l1 === true) ? 4000 : 2000;
                    let silverReward = (silverGoal === 4000) ? 600 : 300;
                    let silverKey = (silverGoal === 4000) ? 'silver_l2' : 'silver_l1';
                    let silverTitle = (silverGoal === 4000) ? "Silver Legend [LVL 2]" : "Silver Elite Pass";
                    setupDynamicCardModule(userMasterCoinsCounter, silverGoal, silverReward, silverKey, silverTitle, claimedLogs[silverKey], "barSilver", "btnSilver", "title_silver", "desc_silver", "cardBox_silver");

                    // 3. Gold Processing (L1: 5000, L2: 10000)
                    let goldGoal = (claimedLogs.gold_l1 === true) ? 10000 : 5000;
                    let goldReward = (goldGoal === 10000) ? 2500 : 1000;
                    let goldKey = (goldGoal === 10000) ? 'gold_l2' : 'gold_l1';
                    let goldTitle = (goldGoal === 10000) ? "Gold God Tier [LVL 2]" : "Gold Master Jackpot";
                    setupDynamicCardModule(userMasterCoinsCounter, goldGoal, goldReward, goldKey, goldTitle, claimedLogs[goldKey], "barGold", "btnGold", "title_gold", "desc_gold", "cardBox_gold");
                }

                // 2. Fetch Admin Banners
                const confRes = await fetch(`${API_BASE_URL}/app-config/banners`);
                const confData = await confRes.json();
                
                if (confData.success && confData.banners) {
                    if(confData.banners[0]) document.getElementById("adminBannerSlot1").innerHTML = confData.banners[0];
                    if(confData.banners[1]) document.getElementById("adminBannerSlot2").innerHTML = confData.banners[1];
                    if(confData.banners[2]) document.getElementById("adminBannerSlot3").innerHTML = confData.banners[2];
                }
            } catch (err) {
                document.getElementById("masterScoreTxt").innerText = "Error Loading";
            }
        }

        // 🛠️ LEVEL-UP RENDER PIPELINE
        function setupDynamicCardModule(currentCoins, targetGoal, rewardCoins, stateDbKey, titleText, isAlreadyClaimed, barId, btnId, titleId, descId, boxId) {
            const bar = document.getElementById(barId);
            const btn = document.getElementById(btnId);
            const titleElem = document.getElementById(titleId);
            const descElem = document.getElementById(descId);
            const box = document.getElementById(boxId);

            if (isAlreadyClaimed === true) {
                box.style.display = "none"; // Hides permanently only after ultimate level completion
                return;
            }

            box.style.display = "flex";
            titleElem.innerText = titleText;
            descElem.innerText = `Target: Reach ${targetGoal} lifetime coins. Reward: +${rewardCoins} 🪙`;

            let percentage = (currentCoins / targetGoal) * 100;
            if(percentage > 100) percentage = 100;
            bar.style.width = percentage + "%";

            // Clean click router override assignment
            btn.onclick = () => executeClaimMilestoneCoins(stateDbKey, targetGoal, rewardCoins, btn);

            if (currentCoins >= targetGoal) {
                btn.className = "milestone-action-btn btn-claimable";
                btn.innerHTML = 'Claim <i class="fa-solid fa-gift"></i>';
                btn.disabled = false;
            } else {
                btn.className = "milestone-action-btn btn-locked";
                btn.innerHTML = 'Locked <i class="fa-solid fa-lock"></i>';
                btn.disabled = true;
            }
        }

        // 💰 TRANSACTION DISPATCH ROUTER: Allocates rewards and unlocks sequential node targets
        async function executeClaimMilestoneCoins(stateDbKey, goalLimitCheck, rewardBonusCoins, btnObj) {
            if(userMasterCoinsCounter < goalLimitCheck) return;

            btnObj.disabled = true;
            btnObj.innerText = "PROCESSING...";
            btnObj.className = "milestone-action-btn btn-locked";

            try {
                // Securely call the backend to process this milestone claim
                const res = await fetch(`${API_BASE_URL}/user/claim-milestone`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ 
                        userId: uid, 
                        milestoneKey: stateDbKey,
                        pointsToAdd: rewardBonusCoins
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    showCustomAlert(`🎉 Level-Up Bonus! +${rewardBonusCoins} Points credited straight inside your wallet.`, true);
                    fetchDataFromAdminServer(); // Refresh entire logic to load Level 2 or Hide the card
                } else {
                    showCustomAlert("❌ Failed to claim milestone. Please try again or check connection.");
                    btnObj.disabled = false;
                    btnObj.innerHTML = 'Claim <i class="fa-solid fa-gift"></i>';
                    btnObj.className = "milestone-action-btn btn-claimable";
                }
            } catch (err) {
                showCustomAlert("⚠️ Server error while claiming reward.");
            }
        }

        // Custom Modern Alert Popup
        function showCustomAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }
    </script>
</body>
</html>
