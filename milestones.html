        .profile-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary-blue), var(--accent-purple)); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; cursor: pointer; text-decoration: none; border: 1px solid rgba(255,255,255,0.2); overflow: hidden; transition: 0.3s; }

        .metric-details h3 { margin: 5px 0 0 0; font-size: 28px; font-weight: 900; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .coin-icon-pouch { font-size: 40px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4)); animation: floatCoin 2s infinite alternate; }
        @keyframes floatCoin { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }

        /* 🎟️ Premium Neon Sponsorship Cards Grids Layout */
        .milestone-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 5px; }
        .sponsor-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px; display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.4); box-sizing: border-box; backdrop-filter: blur(10px); display: none; /* Hidden by default until loaded */ }

        /* Visual Border Indicator Stripes for Different Tiers */
        .sponsor-card::before { content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%; }
        .card-bronze::before { background: linear-gradient(to bottom, #d97706, #b45309); }

        /* Interaction Status Buttons Styles */
        .milestone-action-btn { border: none; padding: 12px 18px; border-radius: 12px; font-size: 13px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; min-width: 100px; text-align: center; letter-spacing: 1px; }

        @keyframes pulseBtn {

            100% { transform: scale(1.05); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.6); }

        .custom-alert { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); border: 2px solid var(--accent-pink); padding: 25px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 1000; width: 85%; max-width: 350px; text-align: center; backdrop-filter: blur(10px); }
        .custom-alert.success-border { border-color: var(--accent-green); box-shadow: 0 15px 40px rgba(16, 185, 129, 0.2); }
        .custom-alert p { margin: 0 0 20px 0; font-size: 14.5px; color: #fff; font-weight: 700; line-height: 1.5; }
        .custom-alert button { background: var(--primary-blue); border: none; color: white; padding: 12px 35px; border-radius: 50px; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); text-transform: uppercase; transition: 0.2s; }

        .custom-alert.success-border button { background: var(--accent-green); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4); }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.85); z-index: 999; backdrop-filter: blur(5px); }

            "bn": { "ms_title": "মাইলস্টোন পুরস্কার", "ms_lifetime": "মোট লাইফটাইম স্কোর", "ms_locked": "লকড", "ms_claim": "দাবি করুন", "ms_target": "লক্ষ্য:", "ms_reward": "পুরস্কার:", "err_success": "লেভেল-আপ বোনাস! ওয়ালেটে পয়েন্ট যোগ হয়েছে।", "err_server": "সার্ভার ত্রুটি।" },
            "te": { "ms_title": "మైల్‌స్టోన్ రివార్డ్స్", "ms_lifetime": "మొత్తం స్కోర్", "ms_locked": "లాక్ చేయబడింది", "ms_claim": "క్లెయిమ్ చేయండి", "ms_target": "లక్ష్యం:", "ms_reward": "రివార్డ్:", "err_success": "లెవెల్-అప్ బోనస్! పాయింట్లు జోడించబడ్డాయి.", "err_server": "సర్వర్ లోపం." },
            "mr": { "ms_title": "माईलस्टोन बक्षिसे", "ms_lifetime": "एकूण लाइफटाइम स्कोअर", "ms_locked": "लॉक केलेले", "ms_claim": "मिळवा", "ms_target": "लक्ष्य:", "ms_reward": "बक्षीस:", "err_success": "लेव्हल-अप बोनस! पॉइंट्स जमा झाले.", "err_server": "सर्व्हर त्रुटी." },
            "ta": { "ms_title": "மைல்ஸ்டோன் பரிசுகள்", "ms_lifetime": "மொத்த மதிப்பெண்", "ms_locked": "பூட்டப்பட்டது", "ms_claim": "பெறு", "ms_target": "இலக்கு:", "ms_reward": "பரிசு:", "err_success": "லெவல்-அப் போனஸ்! புள்ளிகள் சேர்க்கப்பட்டன.", "err_server": "சர்வர் பிழை." },
            "ur": { "ms_title": "مائل اسٹون انعام", "ms_lifetime": "کل لائف ٹائم سکور", "ms_locked": "مقفل", "ms_claim": "حاصل کریں", "ms_target": "ہدف:", "ms_reward": "انعام:", "err_success": "لیول اپ بونس! پوائنٹس والیٹ میں شامل کر دیے گئے۔", "err_server": "سرور کا مسئلہ۔" },
            "gu": { "ms_title": "માઇલસ્ટોન ઇનામ", "ms_lifetime": "કુલ લાઇફટાઇમ સ્કોર", "ms_locked": "લોક કરેલ", "ms_claim": "મેળવો", "ms_target": "લક્ષ્ય:", "ms_reward": "ઇનામ:", "err_success": "લેવલ-અપ બોનસ! પોઇન્ટ્સ ઉમેરવામાં આવ્યા છે.", "err_server": "સર્વર સમસ્યા." },
            "es": { "ms_title": "Recompensas por Hitos", "ms_lifetime": "Puntuación Total", "ms_locked": "Bloqueado", "ms_claim": "Reclamar", "ms_target": "Objetivo:", "ms_reward": "Premio:", "err_success": "¡Bono de nivel! Puntos añadidos.", "err_server": "Error de servidor." },
            "fr": { "ms_title": "Récompenses Étapes", "ms_lifetime": "Score Total à Vie", "ms_locked": "Verrouillé", "ms_claim": "Réclamer", "ms_target": "Cible :", "ms_reward": "Prix :", "err_success": "Bonus de niveau ! Points ajoutés.", "err_server": "Erreur serveur." },
            "ar": { "ms_title": "مكافآت المراحل", "ms_lifetime": "إجمالي النقاط", "ms_locked": "مغلق", "ms_claim": "المطالبة", "ms_target": "الهدف:", "ms_reward": "مكافأة:", "err_success": "مكافأة مستوى جديد! أضيفت النقاط.", "err_server": "خطأ في الخادم." },
            "pt": { "ms_title": "Recompensas de Marcos", "ms_lifetime": "Pontuação Total", "ms_locked": "Bloqueado", "ms_claim": "Reivindicar", "ms_target": "Alvo:", "ms_reward": "Prêmio:", "err_success": "Bônus de nível! Pontos adicionados.", "err_server": "Erro de servidor." },
            "ru": { "ms_title": "Награды за этапы", "ms_lifetime": "Общий счет", "ms_locked": "Закрыто", "ms_claim": "Получить", "ms_target": "Цель:", "ms_reward": "Награда:", "err_success": "Бонус за уровень! Очки зачислены.", "err_server": "Ошибка сервера." }
        };

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) elem.innerText = transObj[key];
            });
            document.getElementById("appLanguage").value = langCode;
            // Force redraw of cards to update translations inside dynamic JS
            if(userMasterCoinsCounter !== null && lastKnownClaimedLogs !== null && globalMilestoneGoals !== null) {
                renderAllMilestoneCards(userMasterCoinsCounter, lastKnownClaimedLogs, globalMilestoneGoals);
            }
        }

        // Script Injector for Admin Banners
        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        const uid = localStorage.getItem("userId");
        let userMasterCoinsCounter = null;
        let lastKnownClaimedLogs = null;
        let globalMilestoneGoals = null; 

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.replace("index.html"); return; }
            
            // Sync Language from Home Page
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            auth.onAuthStateChanged((user) => {
                if (user) {
                    
                    // 1. Fetch Admin Banners and Milestone Goals Configuration
                    db.ref('global_system_runtime_configurations/milestone_configs').on('value', (snap) => {
                        if(snap.exists()) {
                            const adminData = snap.val();
                            globalMilestoneGoals = adminData;
                            
                            // Load Banners
                            if(adminData.slot1_code && adminData.active !== false) { document.getElementById("adminBannerSlot1").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot1"), adminData.slot1_code); } else { document.getElementById("adminBannerSlot1").style.display = "none"; }
                            if(adminData.slot2_code && adminData.active !== false) { document.getElementById("adminBannerSlot2").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot2"), adminData.slot2_code); } else { document.getElementById("adminBannerSlot2").style.display = "none"; }
                            if(adminData.slot3_code && adminData.active !== false) { document.getElementById("adminBannerSlot3").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot3"), adminData.slot3_code); } else { document.getElementById("adminBannerSlot3").style.display = "none"; }
                            
                            // Re-render cards if user data is already loaded
                            if(userMasterCoinsCounter !== null && lastKnownClaimedLogs !== null) {
                                renderAllMilestoneCards(userMasterCoinsCounter, lastKnownClaimedLogs, globalMilestoneGoals);
                            }
                        }
                    });

                    // 2. Live User Data (Coins and Milestones logic) & Smart Avatar
                    db.ref('users/' + uid).on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const d = snapshot.val();
                            userMasterCoinsCounter = d.coins || 0;
                            document.getElementById("masterScoreTxt").innerText = `${userMasterCoinsCounter} 🪙`;

                            lastKnownClaimedLogs = d.claimed_milestones || {};
                            
                            if(globalMilestoneGoals !== null) {
                                renderAllMilestoneCards(userMasterCoinsCounter, lastKnownClaimedLogs, globalMilestoneGoals);
                            }

                            // Smart Avatar Sync
                            let userName = d.name || "Player";
                            let finalAvatar = d.profile_pic ? d.profile_pic : `https://api.dicebear.com/7.x/adventurer/svg?seed=${userName || uid}&backgroundColor=b6e3f4`;
                            document.getElementById("headerProfileIcon").innerHTML = `<img src="${finalAvatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                        }
                    });

                } else {
                    window.location.replace("index.html");
                }
            });
        });

        // 🔥 LEVEL 1 vs LEVEL 2 CONFIGURATIONS AUTOMATION ROUTER (Now Admin Controlled)
        function renderAllMilestoneCards(coins, logs, adminConfig) {
            
            // 1. Bronze Processing
            let b_l1_goal = parseInt(adminConfig.bronze_l1_goal) || 500;
            let b_l1_reward = parseInt(adminConfig.bronze_l1_reward) || 100;
            let b_l2_goal = b_l1_goal * 3;
            let b_l2_reward = b_l1_reward * 2.5;

            let bronzeGoal = (logs.bronze_l1 === true) ? b_l2_goal : b_l1_goal;
            let bronzeReward = (bronzeGoal === b_l2_goal) ? b_l2_reward : b_l1_reward;
            let bronzeKey = (bronzeGoal === b_l2_goal) ? 'bronze_l2' : 'bronze_l1';
            let bronzeTitle = (bronzeGoal === b_l2_goal) ? "Bronze Champion [LVL 2]" : "Bronze Rank Bonus";
            
            setupDynamicCardModule(coins, bronzeGoal, bronzeReward, bronzeKey, bronzeTitle, logs[bronzeKey], "barBronze", "btnBronze", "title_bronze", "desc_bronze", "cardBox_bronze");

            // 2. Silver Processing
            let s_l1_goal = parseInt(adminConfig.silver_l1_goal) || 2000;
            let s_l1_reward = parseInt(adminConfig.silver_l1_reward) || 300;
            let s_l2_goal = s_l1_goal * 2;
            let s_l2_reward = s_l1_reward * 2;

            let silverGoal = (logs.silver_l1 === true) ? s_l2_goal : s_l1_goal;
            let silverReward = (silverGoal === s_l2_goal) ? s_l2_reward : s_l1_reward;
            let silverKey = (silverGoal === s_l2_goal) ? 'silver_l2' : 'silver_l1';
            let silverTitle = (silverGoal === s_l2_goal) ? "Silver Legend [LVL 2]" : "Silver Elite Pass";
            
            setupDynamicCardModule(coins, silverGoal, silverReward, silverKey, silverTitle, logs[silverKey], "barSilver", "btnSilver", "title_silver", "desc_silver", "cardBox_silver");

            // 3. Gold Processing
            let g_l1_goal = parseInt(adminConfig.gold_l1_goal) || 5000;
            let g_l1_reward = parseInt(adminConfig.gold_l1_reward) || 1000;
            let g_l2_goal = g_l1_goal * 2;
            let g_l2_reward = g_l1_reward * 2.5;

            let goldGoal = (logs.gold_l1 === true) ? g_l2_goal : g_l1_goal;
            let goldReward = (goldGoal === g_l2_goal) ? g_l2_reward : g_l1_reward;
            let goldKey = (goldGoal === g_l2_goal) ? 'gold_l2' : 'gold_l1';
            let goldTitle = (goldGoal === g_l2_goal) ? "Gold God Tier [LVL 2]" : "Gold Master Jackpot";
            
            setupDynamicCardModule(coins, goldGoal, goldReward, goldKey, goldTitle, logs[goldKey], "barGold", "btnGold", "title_gold", "desc_gold", "cardBox_gold");
        }

        // 🛠️ LEVEL-UP RENDER PIPELINE
        function setupDynamicCardModule(currentCoins, targetGoal, rewardCoins, stateDbKey, titleText, isAlreadyClaimed, barId, btnId, titleId, descId, boxId) {
            const bar = document.getElementById(barId);
            const btn = document.getElementById(btnId);
            const titleElem = document.getElementById(titleId);
            const descElem = document.getElementById(descId);
            const box = document.getElementById(boxId);
            
            let currentLang = localStorage.getItem("selectedLang") || "en";

            if (isAlreadyClaimed === true) {
                box.style.display = "none"; // Hides permanently only after ultimate level completion
                return;
            }

            box.style.display = "flex";
            titleElem.innerText = titleText;
            
            let targetTxt = langData[currentLang]["ms_target"] || "Reach target:";
            let rewardTxt = langData[currentLang]["ms_reward"] || "Reward:";
            descElem.innerText = `${targetTxt} ${targetGoal}. ${rewardTxt} +${rewardCoins} 🪙`;

            let percentage = (currentCoins / targetGoal) * 100;
            if(percentage > 100) percentage = 100;
            bar.style.width = percentage + "%";

            // Clean click router override assignment
            btn.onclick = () => executeClaimMilestoneCoins(stateDbKey, targetGoal, rewardCoins, btn);

            if (currentCoins >= targetGoal) {
                btn.className = "milestone-action-btn btn-claimable";
                btn.innerHTML = `${langData[currentLang]["ms_claim"] || "Claim"} <i class="fa-solid fa-gift"></i>`;
                btn.disabled = false;
            } else {
                btn.className = "milestone-action-btn btn-locked";
                btn.innerHTML = `${langData[currentLang]["ms_locked"] || "Locked"} <i class="fa-solid fa-lock"></i>`;
                btn.disabled = true;
            }
        }

        // 💰 TRANSACTION DISPATCH ROUTER: Pure Firebase Updates
        function executeClaimMilestoneCoins(stateDbKey, goalLimitCheck, rewardBonusCoins, btnObj) {
            if(userMasterCoinsCounter < goalLimitCheck) return;

            btnObj.disabled = true;
            btnObj.innerText = "PROCESSING...";
            btnObj.className = "milestone-action-btn btn-locked";

            let currentLang = localStorage.getItem("selectedLang") || "en";

            // 1. Add Coins securely via Transaction
            db.ref(`users/${uid}/coins`).transaction((current) => {
                return (current || 0) + rewardBonusCoins;
            }).then(() => {
                
                // 2. Mark this specific milestone key as claimed
                return db.ref(`users/${uid}/claimed_milestones/${stateDbKey}`).set(true);

            }).then(() => {
                let successMsg = langData[currentLang]["err_success"] || "Level-Up Bonus! Points credited straight inside your wallet.";
                showCustomAlert(`🎉 ${successMsg} (+${rewardBonusCoins} 🪙)`, true);
                
                // Note: The renderAllMilestoneCards will automatically trigger via the .on('value') listener above!
            }).catch((error) => {
                let errMsg = langData[currentLang]["err_server"] || "Server error while claiming reward.";
                showCustomAlert(`⚠️ ${errMsg}`);
                
                // Re-enable button manually on failure
                btnObj.disabled = false;
                btnObj.innerHTML = `${langData[currentLang]["ms_claim"] || "Claim"} <i class="fa-solid fa-gift"></i>`;
                btnObj.className = "milestone-action-btn btn-claimable";
            });
        }

        // Custom Modern Alert Popup
        function showCustomAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }
    </script>
</body>
</html>
