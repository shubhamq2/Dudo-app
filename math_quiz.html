        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) elem.innerText = transObj[key];
            });
            document.getElementById("appLanguage").value = langCode;
        }

        // Script Injector for Admin Banners
        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        const uid = localStorage.getItem("userId");
        let computedCorrectAnswer = 0;
        let consecutiveCorrectAnswersCount = 0;
        let currentPayoutCoins = 10; // Base Reward
        let activeAdminSmartlinkUrl = "https://www.profitablecpmrate.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js"; // Fallback URL

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.replace("index.html"); return; }
            
            // Sync Language from Home Page
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            auth.onAuthStateChanged((user) => {
                if (user) {
                    // 1. Live Balance & Avatar Sync
                    db.ref('users/' + uid).on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.val();
                            document.getElementById("liveUserCoins").innerText = data.coins || 0;
                            
                            // Smart Avatar Sync
                            let userName = data.name || "Player";
                            let finalAvatar = data.profile_pic ? data.profile_pic : `https://api.dicebear.com/7.x/adventurer/svg?seed=${userName || uid}&backgroundColor=b6e3f4`;
                            
                            function createEmojiURI(emoji) {
                                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50%" y="54%" font-size="55" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
                                return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
                            }

                            let avatarContainer = document.getElementById("headerProfileIcon");
                            if (finalAvatar.startsWith("http") || finalAvatar.startsWith("data:")) {
                                avatarContainer.innerHTML = `<img src="${finalAvatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            } else {
                                avatarContainer.innerHTML = `<img src="${createEmojiURI(finalAvatar)}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            }
                        }
                    });

                    // 2. Fetch Admin Configurations (Banners & Link & Time)
                    db.ref('global_system_runtime_configurations/math_quiz_configs').on('value', (snap) => {
                        if(snap.exists()) {
                            const adminData = snap.val();
                            
                            // 🔥 GET ADMIN CONTROLLED TIME
                            if (adminData.ad_timer) { globalAdTimerSeconds = parseInt(adminData.ad_timer); }
                            
                            // Load Banners
                            if(adminData.slot1_code && adminData.active !== false) { document.getElementById("adminBannerSlot1").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot1"), adminData.slot1_code); } else { document.getElementById("adminBannerSlot1").style.display = "none"; }
                            if(adminData.slot2_code && adminData.active !== false) { document.getElementById("adminBannerSlot2").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot2"), adminData.slot2_code); } else { document.getElementById("adminBannerSlot2").style.display = "none"; }
                            if(adminData.slot3_code && adminData.active !== false) { document.getElementById("adminBannerSlot3").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot3"), adminData.slot3_code); } else { document.getElementById("adminBannerSlot3").style.display = "none"; }
                            if(adminData.slot4_code && adminData.active !== false) { document.getElementById("adminBannerSlot4").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot4"), adminData.slot4_code); } else { document.getElementById("adminBannerSlot4").style.display = "none"; }

                            // Setup Game Link
                            if (adminData.math_task_link) {
                                activeAdminSmartlinkUrl = adminData.math_task_link;
                            }
                        } else {
                            // Fallback to Global Smartlink
                            db.ref('global_system_runtime_configurations/globalSmartlink').once('value').then(globalSnap => {
                                if(globalSnap.exists()) activeAdminSmartlinkUrl = globalSnap.val();
                            });
                        }
                    });

                } else {
                    window.location.replace("index.html");
                }
            });

            generateHardMathQuestion(); 
        });

        // 🔥 DYNAMIC 5-LEVEL HARD MATH LOGIC ENGINE
        function generateHardMathQuestion() {
            document.getElementById("quizAnswerInput").value = "";
            let qStr = "";
            let ans = 0;

            if (consecutiveCorrectAnswersCount < 3) {
                // LEVEL 1: (A + B) - C
                let a = Math.floor(Math.random() * 50) + 20;
                let b = Math.floor(Math.random() * 30) + 10;
                let c = Math.floor(Math.random() * 20) + 5;
                ans = (a + b) - c;
                qStr = `(${a} + ${b}) - ${c}`;
            } else if (consecutiveCorrectAnswersCount >= 3 && consecutiveCorrectAnswersCount < 6) {
                // LEVEL 2: A × B + C
                let a = Math.floor(Math.random() * 15) + 5;
                let b = Math.floor(Math.random() * 12) + 3;
                let c = Math.floor(Math.random() * 40) + 10;
                ans = (a * b) + c;
                qStr = `${a} × ${b} + ${c}`;
            } else if (consecutiveCorrectAnswersCount >= 6 && consecutiveCorrectAnswersCount < 10) {
                // LEVEL 3: Squares & Subtraction -> A² - B
                let a = Math.floor(Math.random() * 10) + 5; 
                let b = Math.floor(Math.random() * 30) + 10;
                ans = (a * a) - b;
                qStr = `${a}² - ${b}`;
            } else if (consecutiveCorrectAnswersCount >= 10 && consecutiveCorrectAnswersCount < 15) {
                // LEVEL 4: Percentages -> X% of Y + Z
                let percentagesList = [10, 20, 25, 50];
                let per = percentagesList[Math.floor(Math.random() * percentagesList.length)];
                let base = Math.floor(Math.random() * 20 + 5) * 10; 
                let y = Math.floor(Math.random() * 50) + 10;
                ans = (per / 100 * base) + y;
                qStr = `${per}% of ${base} + ${y}`;
            } else {
                // LEVEL 5 (MAX): Complex BODMAS -> (A × B) - (C ÷ D)
                let a = Math.floor(Math.random() * 12) + 6;
                let b = Math.floor(Math.random() * 10) + 4;
                let d = Math.floor(Math.random() * 5) + 2;
                let c = d * (Math.floor(Math.random() * 10) + 2); 
                ans = (a * b) - (c / d);
                qStr = `(${a} × ${b}) - (${c} ÷ ${d})`;
            }

            computedCorrectAnswer = ans;
            document.getElementById("mathQuestionString").innerText = qStr;
        }

        function showCustomAlert(msgKey, isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msg = langData[currentLang][msgKey] || langData["en"][msgKey];
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        let platformTimer = null;
        let isValidationActive = false;

        // 🚀 PLAY STORE SAFE ANTI-CHEATING LOGIC (WITH IN-APP VIEWER)
        function verifyQuizAnswerSubmit() {
            if (isValidationActive) return;

            const userInput = parseFloat(document.getElementById("quizAnswerInput").value.trim());
            const btn = document.getElementById("quizSubmitBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";

            if (isNaN(userInput)) return;

            // Incorrect Answer Handling -> Resets Hard Mode
            if (userInput !== computedCorrectAnswer) {
                consecutiveCorrectAnswersCount = 0;
                executeUpdateStreakVisualInterface();
                showCustomAlert("err_wrong");
                generateHardMathQuestion();
                return;
            }

            // Trigger Secure View Phase (In-App)
            isValidationActive = true;
            let countdownTime = globalAdTimerSeconds;
            btn.disabled = true;

            let baseWaitTxt = langData[currentLang]["wait_txt"] || "Verifying... ";
            btn.innerText = baseWaitTxt;

            // Show In-App Viewer
            document.getElementById("inAppAdViewer").style.display = "flex";
            document.getElementById("adTimerDisplay").style.display = "flex";
            document.getElementById("adCloseBtn").style.display = "none";
            document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${countdownTime}s`;
            
            // Load Ad URL into iframe
            document.getElementById("adIframe").src = activeAdminSmartlinkUrl;

            if (platformTimer) clearInterval(platformTimer);

            platformTimer = setInterval(() => {
                countdownTime--;
                document.getElementById("adTimerDisplay").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Wait: ${countdownTime}s`;

                // 🛡️ ANTI-CHEAT FIX: Only triggers if the entire app is minimized
                if (document.hidden) { 
                    clearInterval(platformTimer);
                    document.getElementById("inAppAdViewer").style.display = "none";
                    document.getElementById("adIframe").src = "";
                    resetQuizSubmitButton();
                    showCustomAlert("err_invalid");
                    return;
                }

                if (countdownTime <= 0) {
                    clearInterval(platformTimer);
                    document.getElementById("adTimerDisplay").style.display = "none";
                    document.getElementById("adCloseBtn").style.display = "block"; // Show X Button
                }
            }, 1000);
        }

        // 💰 REWARD SYNC API & DAILY CHECKLIST INTEGRATION
        function closeInAppAdAndClaim() {
            document.getElementById("inAppAdViewer").style.display = "none";
            document.getElementById("adIframe").src = ""; // Stop video/ad

            consecutiveCorrectAnswersCount++;
            
            // Dynamic Reward Calculation based on difficulty
            if (consecutiveCorrectAnswersCount < 3) currentPayoutCoins = 10;
            else if (consecutiveCorrectAnswersCount >= 3 && consecutiveCorrectAnswersCount < 6) currentPayoutCoins = 15;
            else if (consecutiveCorrectAnswersCount >= 6 && consecutiveCorrectAnswersCount < 10) currentPayoutCoins = 20;
            else if (consecutiveCorrectAnswersCount >= 10 && consecutiveCorrectAnswersCount < 15) currentPayoutCoins = 30;
            else if (consecutiveCorrectAnswersCount >= 15) currentPayoutCoins = 50; 
            
            evaluateQuizRewardViaFirebase(currentPayoutCoins);
        }

        function evaluateQuizRewardViaFirebase(rewardAmount) {
            
            // 1. Add Coins securely via Transaction
            db.ref(`users/${uid}/coins`).transaction((current) => {
                return (current || 0) + rewardAmount;
            }).then(() => {
                
                // 2. Mark Daily Task 't10' as Complete
                db.ref(`users/${uid}/completed_daily_tasks`).once('value', (snap) => {
                    let tasks = snap.val() || [];
                    if (!tasks.includes("t10")) {
                        tasks.push("t10");
                        db.ref(`users/${uid}/completed_daily_tasks`).set(tasks);
                    }
                });

                resetQuizSubmitButton();
                executeUpdateStreakVisualInterface();
                generateHardMathQuestion();
                showCustomAlert("err_success", true);
                
            }).catch(() => {
                resetQuizSubmitButton();
                alert("Task Verified but couldn't sync with server. Try again.");
            });
        }

        function executeUpdateStreakVisualInterface() {
            let level = 1;
            let multiplier = "10 COINS";
            let badgeColor = "var(--accent-gold)";
            let textColor = "#000";
            let borderColor = "var(--accent-gold)";
            let ribbonBg = "rgba(251, 191, 36, 0.1)";

            if (consecutiveCorrectAnswersCount >= 3 && consecutiveCorrectAnswersCount < 6) { 
                level = 2; multiplier = "15 COINS"; badgeColor = "#f97316"; borderColor = "#f97316"; ribbonBg = "rgba(249, 115, 22, 0.1)";
            }
            else if (consecutiveCorrectAnswersCount >= 6 && consecutiveCorrectAnswersCount < 10) { 
                level = 3; multiplier = "20 COINS"; badgeColor = "var(--accent-green)"; textColor = "#fff"; borderColor = "var(--accent-green)"; ribbonBg = "rgba(16, 185, 129, 0.1)";
            }
            else if (consecutiveCorrectAnswersCount >= 10 && consecutiveCorrectAnswersCount < 15) { 
                level = 4; multiplier = "30 COINS"; badgeColor = "var(--primary-blue)"; textColor = "#fff"; borderColor = "var(--primary-blue)"; ribbonBg = "rgba(59, 130, 246, 0.1)";
            }
            else if (consecutiveCorrectAnswersCount >= 15) { 
                level = "MAX"; multiplier = "50 COINS (EXTREME)"; badgeColor = "var(--accent-pink)"; textColor = "#fff"; borderColor = "var(--accent-pink)"; ribbonBg = "rgba(244, 63, 94, 0.1)";
            }

            document.getElementById("quizStreakCountDisplay").innerHTML = `<i class="fa-solid fa-fire"></i> LEVEL: ${level}`;
            
            const badge = document.getElementById("quizBonusLabelDisplay");
            badge.innerText = multiplier;
            badge.style.background = badgeColor;
            badge.style.color = textColor;
            
            const ribbon = document.getElementById("streakRibbonBox");
            ribbon.style.borderColor = borderColor;
            ribbon.style.background = ribbonBg;
            ribbon.style.color = badgeColor;
        }

        function resetQuizSubmitButton() {
            const btn = document.getElementById("quizSubmitBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            btn.disabled = false;
            btn.innerText = langData[currentLang]["mq_btn"] || "SUBMIT ANSWER";
            isValidationActive = false;
        }
    </script>
