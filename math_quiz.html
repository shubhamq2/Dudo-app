        };

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) elem.innerText = transObj[key];
            });
            document.getElementById("appLanguage").value = langCode;
        }

        const uid = localStorage.getItem("userId");
        const token = localStorage.getItem("userToken");

        let computedCorrectAnswer = 0;
        let consecutiveCorrectAnswersCount = 0;
        let activeAdminSmartlinkUrl = "https://www.profitablecpmrate.com/9d8e7e12df3875a6c3846d0cb748a04b/invoke.js"; // Fallback URL

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid || !token) { window.location.href = "index.html"; return; }
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            fetchDataFromAdminServer();
            generateHardMathQuestion(); // Initialize Hard Logic
        });

        // 📡 FETCH DATA FROM NODE.JS ADMIN SERVER
        async function fetchDataFromAdminServer() {
            try {
                // 1. Fetch Profile Balance
                const userRes = await fetch(`${API_BASE_URL}/user/${uid}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const userData = await userRes.json();
                if (userData.success && userData.user) {
                    document.getElementById("liveUserCoins").innerText = userData.user.coins || 0;
                    document.getElementById("liveUserBalance").innerText = "₹" + (userData.user.balance || 0).toFixed(2);
                }

                // 2. Fetch Admin Banners and Smartlink
                const confRes = await fetch(`${API_BASE_URL}/app-config/banners`);
                const confData = await confRes.json();
                
                if (confData.success) {
                    if (confData.banners) {
                        if(confData.banners[0]) document.getElementById("adminBannerSlot1").innerHTML = confData.banners[0];
                        if(confData.banners[1]) document.getElementById("adminBannerSlot2").innerHTML = confData.banners[1];
                        if(confData.banners[2]) document.getElementById("adminBannerSlot3").innerHTML = confData.banners[2];
                        if(confData.banners[3]) document.getElementById("adminBannerSlot4").innerHTML = confData.banners[3];
                    }
                    if (confData.globalSmartlink) {
                        activeAdminSmartlinkUrl = confData.globalSmartlink;
                    }
                }
            } catch (err) {
                console.log("Using cached configuration.");
            }
        }

        // 🔥 HARD MATH LOGIC ENGINE
        function generateHardMathQuestion() {
            document.getElementById("quizAnswerInput").value = "";
            let num1, num2, num3;
            let questionString = "";

            // Difficulty scales with streak
            if (consecutiveCorrectAnswersCount < 3) {
                // LEVEL 1: Basic Addition / Subtraction (Bigger numbers)
                num1 = Math.floor(Math.random() * 50) + 20; 
                num2 = Math.floor(Math.random() * 50) + 10;
                let op = Math.random() > 0.5 ? '+' : '-';
                
                if (op === '-') {
                    if (num1 < num2) [num1, num2] = [num2, num1]; // Prevent negative answers
                    computedCorrectAnswer = num1 - num2;
                } else {
                    computedCorrectAnswer = num1 + num2;
                }
                questionString = `${num1} ${op} ${num2}`;

            } else if (consecutiveCorrectAnswersCount >= 3 && consecutiveCorrectAnswersCount < 6) {
                // LEVEL 2: Multiplication
                num1 = Math.floor(Math.random() * 15) + 5; 
                num2 = Math.floor(Math.random() * 10) + 2;
                computedCorrectAnswer = num1 * num2;
                questionString = `${num1} × ${num2}`;

            } else if (consecutiveCorrectAnswersCount >= 6 && consecutiveCorrectAnswersCount < 10) {
                // LEVEL 3: Division (Perfect multiples)
                num2 = Math.floor(Math.random() * 12) + 3;
                computedCorrectAnswer = Math.floor(Math.random() * 15) + 5; // Result
                num1 = computedCorrectAnswer * num2; // Dividend
                questionString = `${num1} ÷ ${num2}`;

            } else {
                // LEVEL 4 (EXTREME): BODMAS (A + B * C)
                num1 = Math.floor(Math.random() * 20) + 10;
                num2 = Math.floor(Math.random() * 10) + 2;
                num3 = Math.floor(Math.random() * 5) + 2;
                computedCorrectAnswer = num1 + (num2 * num3);
                questionString = `${num1} + ${num2} × ${num3}`;
            }

            document.getElementById("mathQuestionString").innerText = questionString;
        }

        function showCustomAlert(msgKey, isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msg = langData[currentLang][msgKey] || langData["en"][msgKey];
            const alertBox = document.getElementById("customAlertBox");
            if(isSuccess) alertBox.classList.add("success-border");
            else alertBox.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg;
            document.getElementById("alertOverlay").style.display = "block";
            alertBox.style.display = "block";
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        let platformTimer = null;
        let countdownTime = 25;
        let targetWindow = null;
        let totalSecondsOpen = 0;
        let isValidationActive = false;

        // 🔥 ADDED TAB TRACKER 
        window.hasMainTabHidden = false;
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) { window.hasMainTabHidden = true; }
        });

        // 🚀 PLAY STORE SAFE ANTI-CHEATING LOGIC (25 SECONDS)
        function verifyQuizAnswerSubmit() {
            if (isValidationActive) return;

            const userAnswer = parseInt(document.getElementById("quizAnswerInput").value.trim());
            const btn = document.getElementById("quizSubmitBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";

            if (isNaN(userAnswer)) return;

            // Incorrect Answer Handling -> Resets Hard Mode Progress
            if (userAnswer !== computedCorrectAnswer) {
                consecutiveCorrectAnswersCount = 0;
                executeUpdateStreakVisualInterface();
                showCustomAlert("err_wrong");
                generateHardMathQuestion();
                return;
            }

            // Trigger Secure 25-second View Phase
            isValidationActive = true;
            countdownTime = 25;
            totalSecondsOpen = 0;
            window.hasMainTabHidden = false; // Reset tracker
            btn.disabled = true;

            let baseWaitTxt = langData[currentLang]["wait_txt"] || "Verifying... ";
            btn.innerText = baseWaitTxt + `(${countdownTime}s)`;

            targetWindow = window.open(activeAdminSmartlinkUrl, '_blank', 'noopener,noreferrer');

            if (platformTimer) clearInterval(platformTimer);

            platformTimer = setInterval(() => {
                countdownTime--;
                btn.innerText = baseWaitTxt + `(${countdownTime}s)`;

                // Validation 1: Tab closed early
                if (targetWindow && targetWindow.closed) {
                    clearInterval(platformTimer);
                    resetQuizSubmitButton();
                    showCustomAlert("err_early");
                    return;
                }

                // Validation 2: Invalid app switching
                if (!document.hidden && window.hasMainTabHidden) {
                    if (totalSecondsOpen < 24) {
                        clearInterval(platformTimer);
                        resetQuizSubmitButton();
                        showCustomAlert("err_invalid");
                        return;
                    }
                }

                totalSecondsOpen++;

                if (countdownTime <= 0) {
                    clearInterval(platformTimer);
                    btn.innerText = "SAVING...";

                    consecutiveCorrectAnswersCount++;
                    
                    // Dynamic Reward Calculation based on difficulty
                    let currentPayoutCoins = 10;
                    if (consecutiveCorrectAnswersCount >= 3 && consecutiveCorrectAnswersCount < 6) currentPayoutCoins = 15;
                    else if (consecutiveCorrectAnswersCount >= 6 && consecutiveCorrectAnswersCount < 10) currentPayoutCoins = 20;
                    else if (consecutiveCorrectAnswersCount >= 10) currentPayoutCoins = 30; // Extreme level reward
                    
                    evaluateQuizRewardViaNodeServer(currentPayoutCoins);
                }
            }, 1000);
        }

        // 💰 REWARD SYNC API & DAILY CHECKLIST INTEGRATION
        async function evaluateQuizRewardViaNodeServer(rewardAmount) {
            try {
                // Call API to add points and Sync Daily Task 't8'
                const res = await fetch(`${API_BASE_URL}/user/update-balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ 
                        userId: uid, 
                        pointsToAdd: rewardAmount, 
                        action: "math_quiz_solve",
                        syncTask: "t8" // Tells backend to complete task 't8'
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    document.getElementById("liveUserCoins").innerText = data.newCoins;
                    document.getElementById("liveUserBalance").innerText = "₹" + data.newBalance.toFixed(2);
                    
                    resetQuizSubmitButton();
                    executeUpdateStreakVisualInterface();
                    generateHardMathQuestion();
                    showCustomAlert("err_success", true);
                }
            } catch (err) {
                resetQuizSubmitButton();
                alert("Task Verified but couldn't sync with server. Try again.");
            }
        }

        function executeUpdateStreakVisualInterface() {
            let level = 1;
            let multiplier = "1X REWARD";
            let badgeColor = "var(--accent-gold)";
            let textColor = "#000";

            if (consecutiveCorrectAnswersCount >= 3 && consecutiveCorrectAnswersCount < 6) { level = 2; multiplier = "1.5X REWARD"; }
            else if (consecutiveCorrectAnswersCount >= 6 && consecutiveCorrectAnswersCount < 10) { level = 3; multiplier = "2X REWARD"; badgeColor = "var(--accent-green)"; textColor = "#fff"; }
            else if (consecutiveCorrectAnswersCount >= 10) { level = "MAX"; multiplier = "3X REWARD (EXTREME)"; badgeColor = "var(--accent-pink)"; textColor = "#fff"; }

            document.getElementById("quizStreakCountDisplay").innerHTML = `<i class="fa-solid fa-fire"></i> LEVEL: ${level}`;
            
            const badge = document.getElementById("quizBonusLabelDisplay");
            badge.innerText = multiplier;
            badge.style.background = badgeColor;
            badge.style.color = textColor;
        }

        function resetQuizSubmitButton() {
            const btn = document.getElementById("quizSubmitBtn");
            let currentLang = localStorage.getItem("selectedLang") || "en";
            btn.disabled = false;
            btn.innerText = langData[currentLang]["mq_btn"] || "SUBMIT ANSWER";
            isValidationActive = false;
        }
    </script>
