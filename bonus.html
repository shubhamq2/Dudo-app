        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) elem.innerText = transObj[key];
            });
            document.getElementById("appLanguage").value = langCode;
        }

            }

        function runScripts(container) {
            let scripts = container.getElementsByTagName("script");
            for (let i = 0; i < scripts.length; i++) {
                let sNode = document.createElement("script");
                if (scripts[i].src) sNode.src = scripts[i].src;
                else sNode.text = scripts[i].text;
                scripts[i].parentNode.replaceChild(sNode, scripts[i]);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            // Fetch live sync parameters
            database.ref('users/' + uid).on('value', (snap) => {
                if(snap.exists()) {
                    let d = snap.val();
                    document.getElementById("liveUserCoins").innerText = d.coins || 0;
                    document.getElementById("liveUserBalance").innerText = "₹" + (d.balance || 0).toFixed(2);
                }
            });

        function showCustomAlert(msgKey, isSuccess = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msg = langData[currentLang][msgKey] || langData["en"][msgKey];
            
            const box = document.getElementById("customAlertBox");
            if(isSuccess) box.classList.add("success-border");
            else box.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msg;

       // 🚀 SMART PROMO CODE SYSTEM (WILL TELL EXACT ERROR)
function applyAdminPromoCode() {
    const inputField = document.getElementById("promoCodeInput");
    const code = inputField.value.trim().toUpperCase();
    
    if (!code) {
        alert("❌ Please enter a promo code first!");
        return;
    }
    
    // Step 1: Check if code exists in Admin Database
    database.ref('app_active_promo_vouchers_directory/' + code).once('value').then((snapshot) => {
        if (snapshot.exists()) {
            let promoData = snapshot.val();
            let coinValue = parseInt(promoData.allocated_reward_coins_sum || 0);
            let maxClaims = parseInt(promoData.total_max_allowed_claims_cap || 0);
            let currentClaims = parseInt(promoData.current_active_claims_counter_index || 0);
            
            // Step 2: Check if Limit is Reached
            if (currentClaims >= maxClaims) {
                alert(`❌ This Promo Code limit is over! Maximum ${maxClaims} users have already claimed it.`);
                return;
            }
            
            // Step 3: Check if THIS USER has already claimed it
            database.ref('users/' + uid + '/used_promos/' + code).once('value').then((usedSnap) => {
                if (!usedSnap.exists()) {
                    
                    // ALL CHECKS PASSED - ADD COINS
                    database.ref('users/' + uid).once('value').then((userSnap) => {
                        if (userSnap.exists()) {
                            let oldCoins = userSnap.val().coins || 0;
                            let oldBalance = userSnap.val().balance || 0;
                            let monetaryTranslation = coinValue / 100; // 100 Coins = ₹1 Ratio
                            
                            database.ref('users/' + uid).update({
                                coins: oldCoins + coinValue,
                                balance: oldBalance + monetaryTranslation
                            }).then(() => {
                                // Block future claims for this user
                                database.ref('users/' + uid + '/used_promos/' + code).set(true);
                                
                                // Increase Global Claim Counter
                                database.ref('app_active_promo_vouchers_directory/' + code).update({
                                    current_active_claims_counter_index: currentClaims + 1
                                });
                                
                                // Save History
                                database.ref('users/' + uid + '/earning_history').push({
                                    activity: `Promo Code Claimed: ${code}`,
                                    coins_credited: coinValue,
                                    timestamp: Date.now()
                                });
                                
                                inputField.value = "";
                                showCustomAlert("code_success", true);
                            });
                        }
                    });
                } else {
                    // USER ALREADY USED IT
                    alert("❌ You have already claimed this Promo Code once! You cannot use the same code again.");
                }
            });
        } else {
            // CODE DOES NOT EXIST
            alert("❌ This Promo Code does not exist in the Database! (Check spelling)");
        }
    });
}
