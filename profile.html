    <!-- ⚡⚡ ANTI-FLICKER SCRIPT: PREVENTS BUTTON BLINKING COMPLETELY ⚡⚡ -->
    <script>
        let cToggles = localStorage.getItem("d_toggles");
        if(cToggles) {
            let toggles = JSON.parse(cToggles);
            let style = document.createElement('style');
            let cssRules = "";
            for(let key in toggles) {
                if(toggles[key] === false) {
                    cssRules += "#" + key + " { display: none !important; } ";
                }
            }
            style.innerHTML = cssRules;
            document.head.appendChild(style);
        }
    </script>

    <script>
        function createEmojiURICache(emoji) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50%" y="54%" font-size="55" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
        }

        let cPhone = localStorage.getItem("d_phone");
        let cUid = localStorage.getItem("d_uid");
        let cImg = localStorage.getItem("d_img");
        
        if(cCoins) document.getElementById("statCoins").innerText = cCoins;
        if(cName) document.getElementById("userName").innerText = cName;
        if(cPhone) document.getElementById("userPhone").innerText = cPhone;
        if(cUid) {
            let shortUID = cUid.substring(cUid.length - 8).toUpperCase();
            document.getElementById("userUIDText").innerText = shortUID;
        }
        if(cImg) {
            let avatarContainer = document.getElementById("profilePageAvatar");
            if (cImg.startsWith("http") || cImg.startsWith("data:")) {
                avatarContainer.innerHTML = `<img src="${cImg}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;

                avatarContainer.innerHTML = `<img src="${createEmojiURICache(cImg)}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
            }
        }

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) { elem.innerText = transObj[key]; }
            });
            document.getElementById("appLanguage").value = langCode;
        }

        // Check Network Status
        window.addEventListener('online', () => { document.getElementById("globalOfflineWarningOverlay").style.display = "none"; });
        window.addEventListener('offline', () => { document.getElementById("globalOfflineWarningOverlay").style.display = "flex"; });

        function createEmojiURI(emoji) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50%" y="54%" font-size="55" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
            return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
        }

        const uid = localStorage.getItem("userId");
        let currentUID = ""; 

        document.addEventListener("DOMContentLoaded", () => {
            if (!navigator.onLine) document.getElementById("globalOfflineWarningOverlay").style.display = "flex";
            if (!uid) { window.location.href = "index.html"; return; }

            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            currentUID = uid;
            let shortUID = currentUID.substring(currentUID.length - 8).toUpperCase();
            document.getElementById("userUIDText").innerText = shortUID;

            auth.onAuthStateChanged((user) => {
                if (user) {

                    // 1. Fetch Live User Data & Avatar Sync
                    db.ref('users/' + uid).on('value', (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.val();

                            let fName = data.name || "Player";
                            let fPhone = data.email || user.email || "Not Set";
                            let fCoins = data.coins || 0;
                            
                            document.getElementById("userName").innerText = fName;
                            document.getElementById("userPhone").innerText = fPhone;
                            document.getElementById("statCoins").innerText = fCoins;

                            let finalAvatar = data.profile_pic ? data.profile_pic : `https://api.dicebear.com/7.x/adventurer/svg?seed=${fName || uid}&backgroundColor=b6e3f4`;

                            let avatarContainer = document.getElementById("profilePageAvatar");
                            if (finalAvatar.startsWith("http") || finalAvatar.startsWith("data:")) {
                                avatarContainer.innerHTML = `<img src="${finalAvatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            } else {
                                // Convert raw emojis into safe image
                                avatarContainer.innerHTML = `<img src="${createEmojiURI(finalAvatar)}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                            }
                            
                            // Save to Cache for next reload
                            localStorage.setItem("d_coins", fCoins);
                            localStorage.setItem("d_name", fName);
                            localStorage.setItem("d_phone", fPhone);
                            localStorage.setItem("d_uid", currentUID);
                            localStorage.setItem("d_img", finalAvatar);
                        }
                    });

                    // 2. Admin Module Toggles Connect
                    db.ref('global_system_runtime_configurations/module_toggles').on('value', (snap) => {
                        if(snap.exists()) {
                            const toggles = snap.val();
                            localStorage.setItem("d_toggles", JSON.stringify(toggles));
                            for (let modId in toggles) {
                                let el = document.getElementById(modId);
                                if (el) {
                                    el.style.display = toggles[modId] ? 'flex' : 'none';
                                }
                            }
                        }
                    });

                    // 3. Admin Ad Banners (Profile Page Configs)
                    db.ref('global_system_runtime_configurations/profile_page_configs').on('value', (snap) => {
                        if(snap.exists()) {
                            let adminData = snap.val();
                            
                            if(adminData.slot1_code) {
                                document.getElementById("adminBannerSlot1").style.display = "flex";
                                setAdHTML(document.getElementById("adminBannerSlot1"), adminData.slot1_code);
                            } else {
                                document.getElementById("adminBannerSlot1").style.display = "none";
                            }

                            if(adminData.slot2_code) {
                                document.getElementById("adminBannerSlot2").style.display = "flex";
                                setAdHTML(document.getElementById("adminBannerSlot2"), adminData.slot2_code);
                            } else {
                                document.getElementById("adminBannerSlot2").style.display = "none";
                            }
                        }
                    });

                } else {
                    window.location.replace("index.html");
                }
            });
        });

        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        // 📋 COPY UID
        function copyUID() {
            navigator.clipboard.writeText(currentUID).then(() => {
                let currentLang = localStorage.getItem("selectedLang") || "en";
                let msg = langData[currentLang]["uid_copied"] || "UID Copied!";
                alert("📋 " + msg + "\n\nYour Unique ID: " + currentUID);
            });
        }

        // 🚪 LOGOUT (Safe Clear)
        function logoutUser() {
            if(confirm("Are you sure you want to Logout?")) {
                auth.signOut().then(() => {
                    localStorage.clear();
                    window.location.replace("index.html");
                });
            }
        }

        // 🛑 PLAY STORE MANDATORY: PURE FIREBASE DELETE ACCOUNT
        function deleteUserAccount() {
            if(confirm("⚠️ WARNING: Are you sure you want to PERMANENTLY delete your account? All your points and data will be lost. This cannot be undone.")) {

                let doubleCheck = prompt("Type 'DELETE' to confirm account deletion:");
                if(doubleCheck !== "DELETE") {
                    alert("Account deletion cancelled.");
                    return;
                }

                let user = auth.currentUser;
                if(user) {
                    // 1. Erase Data from Realtime Database
                    db.ref('users/' + uid).remove()
                    .then(() => {
                        // 2. Delete user from Firebase Authentication
                        return user.delete();
                    })
                    .then(() => {
                        alert("Your account has been deleted permanently.");
                        localStorage.clear();
                        window.location.replace("index.html");
                    })
                    .catch((error) => {
                        alert("Error deleting account: " + error.message + "\n\nPlease Re-login and try again for security reasons.");
                    });
                } else {
                    alert("No active session found.");
                }
            }
        }
    </script>
