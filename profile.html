        /* Corporate UID Badge */

            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkNc_eIIfqqxbTGqyZ1YWGE3W6lbNqUJQ",
            authDomain: "dudo-63594.firebaseapp.com",
            databaseURL: "https://dudo-63594-default-rtdb.firebaseio.com",
            projectId: "dudo-63594",
            storageBucket: "dudo-63594.firebasestorage.app",
            messagingSenderId: "732244407571",
            appId: "1:732244407571:web:d08486136dea6190de96e6",
            measurementId: "G-H6VVEXCD54"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const uid = localStorage.getItem("userId");

        let currentUID = ""; 

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.href = "index.html"; return; }

            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            // 🛑 GLOBAL DYNAMIC TOGGLE ENGINE (PLAY STORE SAFE) 🛑
            database.ref('global_system_runtime_configurations/module_toggles').on('value', (snap) => {
                let toggles = snap.val() || {};
                const allModules = ['add_points', 'my_points', 'history'];
                
                // Controlled buttons default to HIDDEN.
                const controlledModules = ['add_points'];

                allModules.forEach(mod => {
                    let el = document.getElementById('mod_' + mod);
                    if(el) {
                        if (controlledModules.includes(mod)) {
                            el.style.display = (toggles[mod] === true) ? '' : 'none';
                        } else {
                            el.style.display = (toggles[mod] === false) ? 'none' : '';
                        }
                    }
                });
            });

            database.ref('users/' + uid).on('value', (snap) => {
                if (snap.exists()) {
                    let data = snap.val();
                    let fName = data.name || "Super User";
                    
                    document.getElementById("userName").innerText = fName;
                    document.getElementById("userPhone").innerText = data.phone || data.email || "+91-XXXXXXXXXX";
                    
                    // 🔥 AVATAR SYNC LOGIC
                    if (data.profile_pic) {
                        document.getElementById("profilePageAvatar").src = data.profile_pic;
                    } else {
                        document.getElementById("profilePageAvatar").src = `https://ui-avatars.com/api/?name=${encodeURIComponent(fName)}&background=1e293b&color=fff`;
                    }
                    
                    currentUID = uid;
                    let shortUID = currentUID.substring(currentUID.length - 8).toUpperCase();
                    document.getElementById("userUIDText").innerText = shortUID;

                    document.getElementById("statBal").innerText = "₹ " + (data.balance || 0).toFixed(2);
                    document.getElementById("statCoins").innerText = data.coins || 0;
                }
            });
        });

        function copyUID() {
            navigator.clipboard.writeText(currentUID).then(() => {
                let currentLang = localStorage.getItem("selectedLang") || "en";
                let msg = langData[currentLang]["uid_copied"] || "UID Copied!";
                alert("📋 " + msg + "\n\nYour Unique ID: " + currentUID);
            });
        }

        function logoutUser() {
            let confirmLogout = confirm("Are you sure you want to Logout?");
            if(confirmLogout) {
                localStorage.removeItem("userId");
                window.location.replace("index.html");
            }
        }
    </script>
