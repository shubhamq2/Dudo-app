        .header h2 { margin: 0; font-size: 19px; color: #fff; font-weight: 800; flex-grow: 1; text-align: center; letter-spacing: 0.5px; }

        .user-name { margin: 0; font-size: 22px; font-weight: 900; color: #ffffff; letter-spacing: 0.5px; }
        .user-phone { margin: 5px 0 15px 0; font-size: 13px; color: var(--accent-gold); font-weight: 600; }
        
        /* Corporate UID Badge */

        .bal-item p { margin: 4px 0 0 0; font-size: 11px; color: var(--text-sub); font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .action-buttons { display: flex; justify-content: space-between; gap: 12px; }

        .menu-text { flex-grow: 1; font-size: 14.5px; font-weight: 700; }
        .menu-arrow { color: var(--text-sub); font-weight: bold; font-size: 12px; }

        .logout-btn { flex: 1; background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: uppercase; }

        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) { elem.innerText = transObj[key]; }
            });
            document.getElementById("appLanguage").value = langCode;
        }

        // Check Network Status
        window.addEventListener('online', () => { document.getElementById("globalOfflineWarningOverlay").style.display = "none"; });
        window.addEventListener('offline', () => { document.getElementById("globalOfflineWarningOverlay").style.display = "flex"; });

        const uid = localStorage.getItem("userId");
        const token = localStorage.getItem("userToken");
        let currentUID = ""; 

        document.addEventListener("DOMContentLoaded", () => {
            if (!navigator.onLine) document.getElementById("globalOfflineWarningOverlay").style.display = "flex";
            if (!uid || !token) { window.location.href = "index.html"; return; }

            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            currentUID = uid;
            let shortUID = currentUID.substring(currentUID.length - 8).toUpperCase();
            document.getElementById("userUIDText").innerText = shortUID;

            fetchUserProfileData();
            fetchAdminConfigs();
        });

        // 📡 FETCH DATA FROM NODE.JS ADMIN PANEL
        async function fetchUserProfileData() {
            try {
                const res = await fetch(`${API_BASE_URL}/user/${uid}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.success && data.user) {
                    let fName = data.user.name || "Player";
                    
                    document.getElementById("userName").innerText = fName;
                    document.getElementById("userPhone").innerText = data.user.email || "Not Set";
                    
                    // Avatar Sync Logic
                    if (data.user.profile_pic) {
                        document.getElementById("profilePageAvatar").src = data.user.profile_pic;
                    } else {
                        document.getElementById("profilePageAvatar").src = `https://ui-avatars.com/api/?name=${encodeURIComponent(fName)}&background=1e293b&color=fff`;
                    }

                    document.getElementById("statBal").innerText = "₹ " + (data.user.balance || 0).toFixed(2);
                    document.getElementById("statCoins").innerText = data.user.coins || 0;
                }
            } catch (err) {
                console.error("Error loading profile data");
            }
        }

        // 📡 FETCH ADMIN BANNERS & TOGGLES
        async function fetchAdminConfigs() {
            try {
                // Fetch Ads
                const confRes = await fetch(`${API_BASE_URL}/app-config/banners`);
                const confData = await confRes.json();
                if (confData.success && confData.banners) {
                    if(confData.banners[0]) document.getElementById("adminBannerSlot1").innerHTML = confData.banners[0];
                    if(confData.banners[1]) document.getElementById("adminBannerSlot2").innerHTML = confData.banners[1];
                }

                // Simulate Toggles (If Admin sets Add Points to visible via Nav Config API)
                const navRes = await fetch(`${API_BASE_URL}/app-config/nav-buttons`);
                const navData = await navRes.json();
                if(navData.success) {
                    // Logic: If Admin adds 'add_points' in nav setup, make it visible here too
                    let showAddPoints = navData.navButtons.some(btn => btn.targetUrl.includes('add_points'));
                    if(showAddPoints) document.getElementById('mod_add_points').style.display = 'flex';
                }
            } catch (e) { console.log("Config Load Failed"); }
        }

        // 📋 COPY UID
        function copyUID() {
            navigator.clipboard.writeText(currentUID).then(() => {
                let currentLang = localStorage.getItem("selectedLang") || "en";
                let msg = langData[currentLang]["uid_copied"] || "UID Copied!";
                alert("📋 " + msg + "\n\nYour Unique ID: " + currentUID);
            });
        }

        // 🚪 LOGOUT (Safe Clear)
        function logoutUser() {
            if(confirm("Are you sure you want to Logout?")) {
                localStorage.removeItem("userId");
                localStorage.removeItem("userToken");
                localStorage.removeItem("userName");
                window.location.replace("index.html");
            }
        }

        // 🛑 PLAY STORE MANDATORY: DELETE ACCOUNT
        async function deleteUserAccount() {
            if(confirm("⚠️ WARNING: Are you sure you want to PERMANENTLY delete your account? All your points and data will be lost. This cannot be undone.")) {
                
                let doubleCheck = prompt("Type 'DELETE' to confirm account deletion:");
                if(doubleCheck !== "DELETE") {
                    alert("Account deletion cancelled.");
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/user/delete-account`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}` 
                        },
                        body: JSON.stringify({ userId: uid })
                    });
                    
                    const result = await response.json();
                    if(result.success) {
                        alert("Your account has been deleted permanently.");
                        localStorage.clear();
                        window.location.replace("index.html");
                    } else {
                        alert("Error deleting account: " + result.message);
                    }
                } catch (e) {
                    alert("Network error. Could not delete account.");
                }
            }
        }
    </script>
