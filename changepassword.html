                        if(!elem.disabled) elem.innerText = transObj[key];
                    } else if(elem.tagName === "H3") {
                        elem.innerHTML = `<i class="fa-solid fa-shield-halved"></i> ${transObj[key]}`;
                    } else {
                        elem.innerText = transObj[key]; 
                    }
                }
            });
            document.getElementById("appLanguage").value = langCode;
        }

        // Script Injector for Admin Banners
        function setAdHTML(container, html) {
            container.innerHTML = html;
            Array.from(container.querySelectorAll("script")).forEach(oldScript => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const uid = localStorage.getItem("userId");
            if (!uid) { window.location.replace("index.html"); return; }
            
            // Sync Language from Home Page
            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);

            auth.onAuthStateChanged((user) => {
                if (user) {
                    
                    // Fetch Admin Configurations (Banners for Change Passcode Page)
                    db.ref('global_system_runtime_configurations/change_passcode').on('value', (snap) => {
                        if(snap.exists()) {
                            const adminData = snap.val();
                            
                            // Load Banners
                            if(adminData.slot1_code && adminData.active !== false) { document.getElementById("adminBannerSlot1").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot1"), adminData.slot1_code); } else { document.getElementById("adminBannerSlot1").style.display = "none"; }
                            if(adminData.slot2_code && adminData.active !== false) { document.getElementById("adminBannerSlot2").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot2"), adminData.slot2_code); } else { document.getElementById("adminBannerSlot2").style.display = "none"; }
                            if(adminData.slot3_code && adminData.active !== false) { document.getElementById("adminBannerSlot3").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot3"), adminData.slot3_code); } else { document.getElementById("adminBannerSlot3").style.display = "none"; }
                            if(adminData.slot4_code && adminData.active !== false) { document.getElementById("adminBannerSlot4").style.display = "flex"; setAdHTML(document.getElementById("adminBannerSlot4"), adminData.slot4_code); } else { document.getElementById("adminBannerSlot4").style.display = "none"; }
                        }
                    });

                } else {
                    window.location.replace("index.html");
                }
            });
        });

        function showCustomAlert(msgKey, isSuccess = false, reloadOnClose = false) {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            let msgStr = langData[currentLang][msgKey] || langData["en"][msgKey] || msgKey;

            const box = document.getElementById("customAlertBox");
            if(isSuccess) box.classList.add("success-border");
            else box.classList.remove("success-border");

            document.getElementById("alertMessage").innerText = msgStr;
            document.getElementById("alertOverlay").style.display = "block";
            box.style.display = "block";

            // If success, we force logout after they click OK
            if(reloadOnClose) {
                box.querySelector("button").onclick = () => {
                    auth.signOut().then(() => {
                        localStorage.clear();
                        window.location.replace("index.html");
                    });
                };
            } else {
                box.querySelector("button").onclick = closeCustomAlert;
            }
        }

        function closeCustomAlert() {
            document.getElementById("customAlertBox").style.display = "none";
            document.getElementById("alertOverlay").style.display = "none";
        }

        // 🚀 SECURE PASSWORD UPDATE VIA PURE FIREBASE AUTH
        function updateAppPassword() {
            let oldPass = document.getElementById("oldPassword").value.trim();
            let newPass = document.getElementById("newPassword").value.trim();
            let confPass = document.getElementById("confirmPassword").value.trim();
            
            if (!oldPass || !newPass || !confPass) { showCustomAlert("err_empty"); return; }
            if (newPass.length < 6) { showCustomAlert("err_length"); return; }
            if (newPass !== confPass) { showCustomAlert("err_match"); return; }

            const btn = document.getElementById("updateBtn");
            btn.disabled = true;
            btn.innerText = "UPDATING...";

            const user = auth.currentUser;

            if (user) {
                // Step 1: Re-authenticate user with the old password (Mandatory for Firebase security)
                const credential = firebase.auth.EmailAuthProvider.credential(user.email, oldPass);

                user.reauthenticateWithCredential(credential).then(() => {
                    // Step 2: Once verified, update the password
                    user.updatePassword(newPass).then(() => {
                        document.getElementById("oldPassword").value = "";
                        document.getElementById("newPassword").value = "";
                        document.getElementById("confirmPassword").value = "";
                        
                        showCustomAlert("success_msg", true, true); 
                    }).catch((error) => {
                        showCustomAlert(error.message); // Fallback generic error
                        resetUpdateButton();
                    });
                }).catch((error) => {
                    // Old password was wrong
                    showCustomAlert("err_wrong_old");
                    resetUpdateButton();
                });
            } else {
                showCustomAlert("err_server");
                resetUpdateButton();
            }
        }

        function resetUpdateButton() {
            let currentLang = localStorage.getItem("selectedLang") || "en";
            const btn = document.getElementById("updateBtn");
            btn.disabled = false;
            btn.innerText = langData[currentLang]["btn_update"] || "Update Passcode";
        }
    </script>
</body>
</html>
