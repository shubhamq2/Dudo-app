        function changeLanguage(langCode) {
            localStorage.setItem("selectedLang", langCode);
            const transObj = langData[langCode] || langData["en"];
            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute("data-i18n");
                if(transObj[key]) { elem.innerText = transObj[key]; }
            });
            document.getElementById("appLanguage").value = langCode;
        }

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDkNc_eIIfqqxbTGqyZ1YWGE3W6lbNqUJQ",
            authDomain: "dudo-63594.firebaseapp.com",
            databaseURL: "https://dudo-63594-default-rtdb.firebaseio.com",
            projectId: "dudo-63594",
            storageBucket: "dudo-63594.firebasestorage.app",
            messagingSenderId: "732244407571",
            appId: "1:732244407571:web:d08486136dea6190de96e6",
            measurementId: "G-H6VVEXCD54"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();
        const uid = localStorage.getItem("userId");

        document.addEventListener("DOMContentLoaded", () => {
            if (!uid) { window.location.href = "index.html"; return; }

            let savedLang = localStorage.getItem("selectedLang") || "en";
            changeLanguage(savedLang);
        });

        function updateAppPassword() {
            let oldPass = document.getElementById("oldPassword").value.trim();
            let newPass = document.getElementById("newPassword").value.trim();
            let confPass = document.getElementById("confirmPassword").value.trim();
            
            let curLang = localStorage.getItem("selectedLang") || "en";

            // 1. Check for empty fields
            if (!oldPass || !newPass || !confPass) {
                alert(langData[curLang]["err_empty"] || "All fields required!");
                return;
            }

            // 2. Validate password minimal length
            if (newPass.length < 6) {
                alert(langData[curLang]["err_length"] || "Minimum 6 characters required!");
                return;
            }

            // 3. Check if new passwords match properly
            if (newPass !== confPass) {
                alert(langData[curLang]["err_match"] || "Passcodes do not match!");
                return;
            }

            // Fetch current saved password from user node block to verify old one
            database.ref('users/' + uid).once('value').then((snap) => {
                if (snap.exists()) {
                    let userData = snap.val();
                    let dbPassword = userData.password; // Fetching current password string

                    if (oldPass !== dbPassword) {
                        alert(langData[curLang]["err_wrong_old"] || "Incorrect old passcode!");
                        return;
                    }

                    // Proceeding to update the node password field value (safely kept as 'password' for backend logic)
                    database.ref('users/' + uid + '/password').set(newPass).then(() => {
                        let okMsg = langData[curLang]["success_msg"] || "Passcode updated successfully!";
                        alert(okMsg);
                        
                        // Force log out and send user back to verification index portal
                        localStorage.removeItem("userId");
                        window.location.replace("index.html");
                    });
                }
            }).catch((err) => {
                alert("❌ Database Query Error: " + err.message);
            });
        }
    </script>
